version: 1

enums:
  EWActionType:
    - JAM = 0
    - SPOOF
    - DECEIVE
    - INTERCEPT
    - DIRECTION_FIND
    - MONITOR
    - DENY

  JamType:
    - NOISE = 0
    - BARRAGE
    - SPOT
    - SWEEP
    - RESPONSIVE
    - FOLLOWER

  EWEffectType:
    - SIGNAL_DEGRADED = 0
    - SIGNAL_DENIED
    - TARGET_DECOYED
    - COMMUNICATIONS_DISRUPTED
    - NO_EFFECT

  EPType:
    - FREQUENCY_HOPPING = 0
    - SPREAD_SPECTRUM
    - ENCRYPTION
    - POWER_CONTROL
    - DIRECTIONAL_ANTENNA
    - BURST_TRANSMISSION

structs:
  EWActionTask:
    parent: Task
    fields:
      ew_action_type: optional EWActionType
      target_signal_id: optional string
      platform_id: optional string
      duration_s: optional float
      area: optional Geometry
      power_w: optional float
      lifecycle_phase: optional LifecyclePhase

  JamTask:
    parent: EWActionTask
    fields:
      jam_type: optional JamType
      frequency_range_hz: optional FloatRange
      effectiveness_estimate: optional float

  SpoofTask:
    parent: EWActionTask
    fields:
      emulated_signal_description: optional string
      intended_effect: optional string

  DirectionFindingResult:
    parent: Intel
    fields:
      bearing_from_sensor_deg: optional float
      sensor_position: optional LLA
      estimated_emitter_position: optional LLA
      confidence: optional float
      signal_id: optional string

  EWEffect:
    parent: Assessment
    fields:
      action_task_id: optional string
      observed_effect: optional EWEffectType
      confidence: optional float
      duration_effective_s: optional float

  SpectrumAllocation:
    parent: Plan
    fields:
      frequency_range_hz: optional FloatRange
      assigned_to_id: optional string
      purpose: optional string
      priority: optional int
      time_window: optional TimeWindow
      exclusive: optional bool

  ElectronicProtection:
    parent: Instruction
    fields:
      ep_type: optional EPType
      applied_to_id: optional string
      parameters: optional any

  ThreatEmitter:
    parent: Intel
    fields:
      emitter_notation: optional string
      location: optional LLA
      signal_id: optional string
      threat_level: optional ThreatLevel
      associated_platform_id: optional string
      first_detected: optional Timestamp
      last_detected: optional Timestamp
