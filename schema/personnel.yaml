version: 1

enums:
  PersonnelStatusType:
    - PRESENT = 0
    - ABSENT
    - WIA
    - KIA
    - MIA
    - CAPTURED
    - EVACUATED
    - ON_LEAVE
    - DETACHED
    - HOSPITALIZED
    - RTD

  CasualtyCause:
    - COMBAT = 0
    - NON_COMBAT
    - ACCIDENT
    - DISEASE
    - FRIENDLY_FIRE

  InjurySeverity:
    - MINOR = 0
    - SERIOUS
    - VSI
    - CRITICAL
    - FATAL

  TreatmentStatus:
    - UNTREATED = 0
    - FIRST_AID
    - STABILIZED
    - EVACUATED
    - HOSPITALIZED
    - RTD
    - DECEASED

structs:
  CasualtyCount:
    fields:
      kia: optional uint32
      wia: optional uint32
      mia: optional uint32
      captured: optional uint32
      non_battle: optional uint32

  PersonnelStatus:
    parent: State
    fields:
      person_id: optional string
      personnel_status: optional PersonnelStatusType
      location: optional LLA
      unit_id: optional string
      role: optional string
      specialty: optional string

  CasualtyReport:
    parent: State
    fields:
      person_id: optional string
      time: optional Timestamp
      location: optional LLA
      cause: optional CasualtyCause
      severity: optional InjurySeverity
      treatment_status: optional TreatmentStatus
      evacuated_to_site_id: optional string

  PersonnelStrength:
    parent: State
    fields:
      unit_id: optional string
      authorized: optional uint32
      assigned: optional uint32
      present: optional uint32
      effective: optional uint32
      casualties: optional CasualtyCount
