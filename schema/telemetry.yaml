version: 1
# --- Telemetry ---
# Communication about the sender's own internal state or process.

structs:
  Telemetry:
    parent: Message
    fields:
      message_id: int
      unit_id: int
    variants:
      GROUND: GroundTelemetry
      AIR: AirTelemetry
      SEA: SeaTelemetry
      SPACE: SpaceTelemetry


