version: 1

structs:
  # Telemetry / observation / response messages
  TelemetryMessage:
    parent: Message
    fields:
      production_method: optional ProductionMethod
      operational_context: optional OperationalContext
    variants:
      UAV: UAVTelemetryMessage

  UAVTelemetryMessage:
    parent: TelemetryMessage
    fields:
      telemetry: UAVTelemetry

  UAVTelemetry:
    fields:
      location: optional Location
      navigation: optional Navigation
      kinematic: optional Kinematic
      sensor: optional Sensor
      input: optional Input
      battery: optional Battery
      fuel: optional Fuel
      consumable: optional Consumable
      parameters: optional RobotParameters
      internal: optional Internal
      condition: optional ConditionState
      mission_progress: optional MissionProgress

  ObservationMessage:
    parent: Message
    fields:
      detection: optional Detection
      classification: optional Classification
      track: optional Track
      source_host: optional string
      source_port: optional uint32
      cot_detail_xml: optional string

  ResponseMessage:
    parent: Message
    variants:
      ACK: AckMessage
      NACK: NackMessage
      RESULT: ResultMessage

  AckMessage:
    parent: ResponseMessage
    fields:
      reply_code: optional ReplyCode
      acknowledged_message_id: optional string
      receipt: optional DeliveryReceipt

  NackMessage:
    parent: ResponseMessage
    fields:
      reply_code: optional ReplyCode
      rejected_message_id: optional string
      reason: optional string
      receipt: optional DeliveryReceipt

  ResultMessage:
    parent: ResponseMessage
    fields:
      reply_code: optional ReplyCode
      success: optional bool
      result_data: optional any
      error: optional string
