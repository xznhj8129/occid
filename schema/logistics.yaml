version: 1

enums:
  SupplyClass:
    - I_SUBSISTENCE = 0
    - II_CLOTHING_EQUIPMENT
    - III_FUEL_POL
    - IV_CONSTRUCTION
    - V_AMMUNITION
    - VI_PERSONAL_ITEMS
    - VII_MAJOR_END_ITEMS
    - VIII_MEDICAL
    - IX_REPAIR_PARTS
    - X_MISCELLANEOUS

  SupplyPriority:
    - ROUTINE = 0
    - PRIORITY
    - IMMEDIATE
    - EMERGENCY

  UnitOfMeasure:
    - EACH = 0
    - KILOGRAM
    - LITER
    - ROUND
    - BOX
    - CASE
    - PALLET
    - METER
    - SQUARE_METER
    - CUBIC_METER
    - HOUR

  ThreatLevel:
    - GREEN = 0
    - AMBER
    - RED
    - BLACK

structs:
  SupplyItem:
    fields:
      supply_class: SupplyClass
      item_type: string
      quantity: float
      unit_of_measure: UnitOfMeasure

  SupplyRequest:
    parent: Task
    fields:
      requesting_unit_id: optional string
      items: optional list[SupplyItem]
      supply_priority: optional SupplyPriority
      delivery_location: optional LLA
      required_by_time: optional Timestamp
      request_status: optional RequestStatus

  ConsumptionRate:
    parent: State
    fields:
      item_type: optional string
      rate_per_hour: optional float
      unit_ref_id: optional string
      conditions: optional string

  SupplyRoute:
    parent: Plan
    fields:
      path: optional LLAPath
      mode: optional string
      capacity_per_trip: optional float
      security_level: optional ThreatLevel
      travel_time_estimate: optional Duration

  ResupplyMission:
    parent: Task
    fields:
      supply_request_id: optional string
      assigned_to_entity_id: optional string
      supply_point_id: optional string
      delivery_window: optional TimeWindow
      lifecycle_phase: optional LifecyclePhase
