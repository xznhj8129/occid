version: 1

structs:
  # Communication: definition, implementation,
  # metadata and formats of information transfer
  Communication:
    variants:
      NODE: Node
      TRANSPORT: Transport
      FEED: Feed
      MESSAGE: Message


  # What transmits or receives messages.
  # Represents the connection, not the entity itself.
  Node:
    parent: Communication


  # --- Transport ---
  # The form of information flow

  Transport:
    parent: Communication
    variants:
      NETWORK: Network
      CARRIER: Carrier
      PROTOCOL: Protocol

  # How messages travel from point to point
  Network:
    parent: Transport

  # What messages are transmitted over (physical medium)
  Carrier:
    parent: Transport

  # Format and standard of messages
  Protocol:
    parent: Transport


  # --- Feed ---
  # Data flow

  Feed:
    parent: Communication
    variants:
      LINK: Link
      STREAM: Stream

  # Discontinuous data flow of discrete packets
  Link:
    parent: Feed

  # Continuous flow of data of indeterminate total size, usually Sensory
  Stream:
    parent: Feed


  # --- Message ---
  # Discrete typed envelope for feed data

  Message:
    parent: Communication
    variants:
      COMMAND: Command
      TELEMETRY: Telemetry
      OBSERVATION: Observation
      RESPONSE: Response

  # Communication about external objects, events, or the environment
  Observation:
    parent: Message

  # Acknowledgment, acceptance, rejection, result, or completion notice
  Response:
    parent: Message
