version: 1

structs:
  # System: integrated set of components performing a function
  System:
    parent: Object
    variants:
      WEAPON_SYSTEM: WeaponSystem
      COMMUNICATION_SYSTEM: CommunicationSystem
      SENSOR_SUITE: SensorSuite
      FIRE_CONTROL: FireControlSystem
      EW_SUITE: EWSuite
      NAVIGATION_SYSTEM: NavigationSystem
      C2_SYSTEM: C2System
      IADS: IntegratedAirDefenseSystem
      POWER_SYSTEM: PowerSystem

  WeaponSystem:
    parent: System
    fields:
      platform_id: optional string
      weapon_id: optional string
      fire_control_id: optional string

  CommunicationSystem:
    parent: System
    fields:
      node_ids: optional list[string]
      transport_ids: optional list[string]
      coverage_capability: optional string

  SensorSuite:
    parent: System
    fields:
      sensor_ids: optional list[string]
      fusion_capability: optional bool
      primary_mode: optional string

  FireControlSystem:
    parent: System
    fields:
      sensor_id: optional string
      weapon_id: optional string
      tracking_mode: optional string
      engagement_capability: optional string

  EWSuite:
    parent: System
    fields:
      sensor_ids: optional list[string]
      jammer_ids: optional list[string]
      direction_finder_ids: optional list[string]
      controller_id: optional string

  NavigationSystem:
    parent: System
    fields:
      primary_source: optional NavSource
      backup_sources: optional list[NavSource]
      accuracy_class: optional string

  C2System:
    parent: System
    fields:
      battle_management_platform_id: optional string
      communication_system_ids: optional list[string]
      display_ids: optional list[string]
      personnel_ids: optional list[string]

  IntegratedAirDefenseSystem:
    parent: System
    fields:
      radar_ids: optional list[string]
      launcher_ids: optional list[string]
      c2_node_id: optional string
      engagement_zone_ids: optional list[string]

  PowerSystem:
    parent: System
    fields:
      source_ids: optional list[string]
      distribution: optional string
      total_capacity: optional float
      current_load: optional float
