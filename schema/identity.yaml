version: 1

enums:
  AltIdType:
    - TRACK_ID = 0
    - SPI_ID
    - ASSET_ID
    - LINK16_TRACK_NUMBER
    - LINK16_JU
    - CALLSIGN
    - MMSI
    - VMF_URN
    - IMO
    - SERIAL_NUMBER
    - REGISTRATION_ID
    - DODAAC
    - UIC
    - NORAD_CAT_ID
    - UNOOSA_NAME
    - UNOOSA_ID

structs:
  AltId:
    fields:
      type: AltIdType
      value: string

  # Identity: fundamental identity, name, ID
  Identity:
    parent: Properties
    fields:
      uid: string
      name: optional string
      model: optional string
      callsign: optional string
      description: optional string
      alternate_ids: optional list[AltId]
      aliases: optional list[string]
      provenance_id: optional string
      visual_markings: optional list[string]
      tags: optional list[string]
      subject: optional string
