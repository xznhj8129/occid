version: 1

enums:
  LifecyclePhase:
    - PLANNED = 0
    - ACTIVE
    - PAUSED
    - COMPLETE
    - ABORTED
    - FAILED

structs:
  # Parameters: current operating configuration or control regime
  Parameters:
    parent: Properties
    variants:
      ROBOT: RobotParameters
      TASK: TaskParameters

  RobotParameters:
    parent: Parameters
    fields:
      autonomy_mode: optional string
      control_authority_holder_id: optional string
      flight_mode: optional string
      armed: optional bool
      in_air: optional bool
      active_modes: optional list[string]
      override_active: optional bool
      failsafe_active: optional bool

  TaskParameters:
    parent: Parameters
    fields:
      lifecycle_phase: optional LifecyclePhase
