version: 1

enums:
  PropulsionType:
    - ELECTRIC = 0
    - GASOLINE
    - DIESEL
    - TURBINE
    - HYBRID
    - HYDROGEN
    - SOLAR

  LandPropulsion:
    - WHEELED = 0
    - TRACKED
    - BIPEDAL
    - LEGGED

  LandVehicleClass:
    - LIGHT = 0
    - ARMORED

  AirVehicleClass:
    - FIGHTER = 0
    - BOMBER
    - TRANSPORT
    - TANKER
    - TRAINER
    - RECONNAISSANCE
    - HELICOPTER
    - TILTROTOR
    - LIGHTER_THAN_AIR

  SeaVehicleClass:
    - FRIGATE = 0
    - DESTROYER
    - CARRIER
    - SUBMARINE
    - PATROL
    - AMPHIBIOUS
    - AUXILIARY
    - MERCHANT

structs:
  # Vehicle: machine operating in a physical domain, manned or unmanned
  Vehicle:
    parent: Machine
    variants:
      LAND: LandVehicle
      AIR: AirVehicle
      SEA: SeaVehicle
      SUBSEA: SubseaVehicle
      SPACE: SpaceVehicle

  LandVehicle:
    parent: Vehicle
    fields:
      max_range_m: optional float
      max_speed_ms: optional float

  AirVehicle:
    parent: Vehicle
    fields:
      max_range_m: optional float
      max_flight_time_s: optional float
      max_speed_ms: optional float
      cruise_speed_ms: optional float
      max_altitude_m: optional float

  SeaVehicle:
    parent: Vehicle
    fields:
      max_range_m: optional float
      max_speed_ms: optional float
      endurance_s: optional float

  SubseaVehicle:
    parent: Vehicle
    fields:
      max_depth_m: optional float
      max_range_m: optional float
      endurance_s: optional float

  SpaceVehicle:
    parent: Vehicle
    fields:
      max_orbit_altitude_m: optional float
      delta_v_ms: optional float
      mission_duration_s: optional float

  # Vehicle attribute specialization under Data -> Properties -> Attributes
  VehicleAttributes:
    parent: MachineAttributes
    variants:
      LAND: LandVehicleAttributes
      AIR: AirVehicleAttributes
      SEA: SeaVehicleAttributes
      SUBSEA: SubseaVehicleAttributes
      SPACE: SpaceVehicleAttributes

  LandVehicleAttributes:
    parent: VehicleAttributes
    fields:
      land_vehicle_class: optional LandVehicleClass
      land_propulsion: optional LandPropulsion

  AirVehicleAttributes:
    parent: VehicleAttributes
    fields:
      air_vehicle_class: optional AirVehicleClass
      propulsion_type: optional PropulsionType

  SeaVehicleAttributes:
    parent: VehicleAttributes
    fields:
      sea_vehicle_class: optional SeaVehicleClass
      propulsion_type: optional PropulsionType

  SubseaVehicleAttributes:
    parent: VehicleAttributes
    fields:
      propulsion_type: optional PropulsionType
      hull_type: optional string

  SpaceVehicleAttributes:
    parent: VehicleAttributes
    fields:
      propulsion_type: optional PropulsionType
      mission_class: optional string
