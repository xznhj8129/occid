structs:
  # Machine: discrete non-inert man-made object capable of actions
  Machine:
    parent: Entity
    variants:
      VEHICLE: Vehicle
      ROBOT: Robot
      PLATFORM: Platform

  # --- Vehicle ---
  Vehicle:
    parent: Machine
    variants:
      LAND: LandVehicle
      AIR: AirVehicle
      SEA: SeaVehicle
      SUBSEA: SubseaVehicle
      SPACE: SpaceVehicle

  LandVehicle:
    parent: Vehicle

  AirVehicle:
    parent: Vehicle

  SeaVehicle:
    parent: Vehicle

  SubseaVehicle:
    parent: Vehicle

  SpaceVehicle:
    parent: Vehicle

  # --- Robot ---
  Robot:
    parent: Machine
    variants:
      AIR: AirRobot
      LAND: LandRobot
      SEA: SeaRobot
      SUBSEA: SubseaRobot
      SPACE: SpaceRobot

  AirRobot:
    parent: Robot

  LandRobot:
    parent: Robot

  SeaRobot:
    parent: Robot

  SubseaRobot:
    parent: Robot

  SpaceRobot:
    parent: Robot

  # --- Platform ---
  Platform:
    parent: Machine
    variants:
      LAUNCHER: Launcher
      CHARGER: Charger
      RELAY: Relay
      GCS: GroundControlStation
      COMMAND_POST: MobileCommandPost
      SENSOR_PLATFORM: SensorPlatform
      OPERATOR_STATION: OperatorStation

  Launcher:
    parent: Platform

  Charger:
    parent: Platform

  Relay:
    parent: Platform

  GroundControlStation:
    parent: Platform

  MobileCommandPost:
    parent: Platform

  SensorPlatform:
    parent: Platform

  OperatorStation:
    parent: Platform
