version: 1

structs:
  # Machine: discrete non-inert man-made object capable of actions
  Machine:
    parent: Entity
    variants:
      VEHICLE: Vehicle
      ROBOT: Robot
      PLATFORM: Platform

  # --- Platform ---
  Platform:
    parent: Machine
    variants:
      LAUNCHER: Launcher
      CHARGER: Charger
      RELAY: Relay
      GCS: GroundControlStation
      COMMAND_POST: MobileCommandPost
      SENSOR_PLATFORM: SensorPlatform
      OPERATOR_STATION: OperatorStation

  Launcher:
    parent: Platform

  Charger:
    parent: Platform

  Relay:
    parent: Platform

  GroundControlStation:
    parent: Platform

  MobileCommandPost:
    parent: Platform

  SensorPlatform:
    parent: Platform

  OperatorStation:
    parent: Platform
