version: 1

enums:
  AuthorityLevel:
    - FULL = 0
    - SHARED
    - DELEGATED
    - MONITOR

  CorrelationType:
    - MANUAL = 0
    - AUTOMATED

  CorrelationReplicationMode:
    - LOCAL = 0
    - GLOBAL

structs:
  # Relationship: typed relation between entities, organizations, tasks, and items
  Relationship:
    parent: Properties
    variants:
      CONTROL: ControlAuthority
      ASSIGNMENT: TaskAssignment
      OWNERSHIP: Ownership
      COMPOSITION: Composition
      TRACKING: TrackingRelationship
      GROUP: GroupRelationship
      CORRELATION: CorrelationRelationship
      ACTIVE_TARGET: ActiveTargetRelationship
      COMMAND: CommandRelationshipEntry

  ControlAuthority:
    parent: Relationship
    fields:
      controller_entity_id: optional string
      authority_level: optional AuthorityLevel

  TaskAssignment:
    parent: Relationship
    fields:
      task_id: optional string
      assignee_entity_id: optional string

  Ownership:
    parent: Relationship
    fields:
      owner_organization_id: optional string

  Composition:
    parent: Relationship
    fields:
      part_item_id: optional string
      whole_object_id: optional string

  TrackingRelationship:
    parent: Relationship
    fields:
      tracker_entity_id: optional string
      tracked_entity_id: optional string

  GroupRelationship:
    parent: Relationship
    fields:
      group_id: optional string
      member_id: optional string
      role_in_group: optional string
      joined_time: optional Timestamp
      left_time: optional Timestamp

  CorrelationRelationship:
    parent: Relationship
    fields:
      primary_entity_id: optional string
      secondary_entity_ids: optional list[string]
      correlation_type: optional CorrelationType
      replication_mode: optional CorrelationReplicationMode

  ActiveTargetRelationship:
    parent: Relationship
    fields:
      actor_id: optional string
      target_id: optional string
      since: optional Timestamp

  CommandRelationshipEntry:
    parent: Relationship
    fields:
      subordinate_organization_id: optional string
      superior_organization_id: optional string
      relationship_type: optional CommandRelationship
      effective_time: optional Timestamp
      expiry_time: optional Timestamp
