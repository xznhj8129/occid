version: 1

structs:
  # Data: concrete typed structures describing objects,
  # their characteristics, condition, intentions, actions, or effects
  Data:
    variants:
      INFORMATION: Information
      SENSORY: Sensory

  # --- Information ---
  Information:
    parent: Data
    variants:
      PROPERTIES: Properties
      STATE: State
      EVENT: Event
      INTEL: Intel

  # --- Properties ---
  Properties:
    parent: Information
    variants:
      IDENTITY: Identity
      ATTRIBUTES: Attributes
      PARAMETERS: Parameters
      RELATIONSHIP: Relationship
