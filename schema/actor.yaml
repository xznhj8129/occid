version: 1

structs:
  # Actor: entity capable of thought, observation, reflexion,
  # logic, reasoning, introspection, and making judgments and decisions
  Actor:
    parent: Entity
    variants:
      PERSON: Person
      AGENT: Agent

  # --- Person ---
  Person:
    parent: Actor

  # --- Agent ---
  Agent:
    parent: Actor
    variants:
      LLM: LLMAgent
      VISION: VisionAgent
      PLANNING: PlanningAgent
      CONTROL: ControlAgent
      FUSION: FusionAgent
      CLASSIFICATION: ClassificationAgent

  LLMAgent:
    parent: Agent

  VisionAgent:
    parent: Agent

  PlanningAgent:
    parent: Agent

  ControlAgent:
    parent: Agent

  FusionAgent:
    parent: Agent

  ClassificationAgent:
    parent: Agent
