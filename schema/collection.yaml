version: 1

enums:
  # --- Collection ---
  FormationType:
    - LINE = 0
    - COLUMN
    - WEDGE
    - VEE
    - ECHELON_LEFT
    - ECHELON_RIGHT
    - DIAMOND
    - STAGGERED_COLUMN
    - BOX
    - FILE
    - HERRINGBONE
    - COIL

structs:
  # Collection: ordered or purposeful grouping of objects
  Collection:
    parent: Object
    variants:
      CONVOY: Convoy
      FORMATION: Formation
      TASK_GROUP: TaskGroup
      SENSOR_NETWORK: SensorNetwork
      TARGET_DECK: TargetDeck
      MINEFIELD: Minefield

  Convoy:
    parent: Collection
    fields:
      member_ids: optional list[string]
      route: optional LLAPath
      spacing_m: optional float
      speed_ms: optional float
      lead_vehicle_id: optional string

  Formation:
    parent: Collection
    fields:
      formation_type: FormationType
      member_ids: optional list[string]
      spacing_m: optional float
      reference_entity_id: optional string

  TaskGroup:
    parent: Collection
    fields:
      member_ids: optional list[string]
      task_ids: optional list[string]

  SensorNetwork:
    parent: Collection
    fields:
      sensor_entity_ids: optional list[string]
      coverage_area: optional Geometry
      fusion_method: optional FusionMethod

  TargetDeck:
    parent: Collection
    fields:
      target_ids: optional list[string]

  Minefield:
    parent: Collection
    fields:
      geometry: optional Geometry
      active: optional bool
