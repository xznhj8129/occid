# OCCID ontology
#
# This file defines the structural buckets used by OCCID records.
# It must not become a taxonomy of possible classes, kinds, symbols, or
# protocol enums. Those belong in schema enums, module files, or protocol
# mapping tables.
#
# Rule:
# - ontology node = what role this data plays in the model
# - schema enum/map = which concrete kind/code/value it has
#
# Examples:
# - a CoT type code is Definition/SemanticCode data, not a new ontology branch
# - a MAVLink/MSP/Hivelink message id is Communication/Protocol mapping data
# - a waypoint, route, target area, or geofence is Control/Reference data

Root:
  description: Top-level OCCID record families.
  children:

    Definition:
      description: Reference systems and mappings that give values their meaning.
      children:

        ReferenceFrame:
          description: Frame, datum, unit, and coordinate-system definitions used by spatial, temporal, and sensor data.

        SemanticCode:
          description: Named code systems and enum dictionaries used by records.

        ProtocolMapping:
          description: Mapping between external protocol codes/messages and OCCID records.

        RelationKind:
          description: Relationship vocabulary used to connect records.

    Struct:
      description: Embedded value structs used inside records. Structs do not have operational identity by themselves.
      children:

        Measurement:
          description: Scalar value with unit meaning.

        Vector:
          description: Ordered numeric components in a declared frame.

        Position:
          description: Global, local, or body-relative position value.

        Attitude:
          description: Orientation value.

        Direction:
          description: Bearing, azimuth, elevation, range, or look vector.

        Geometry:
          description: Point, line, path, area, volume, bounds, or external geometry payload.

        Uncertainty:
          description: Error, covariance, quality, dilution, confidence, or estimate bounds.

        Time:
          description: Timestamp, duration, interval, deadline, stale time, or validity window.

        Payload:
          description: Opaque or encoded data bytes carried by a protocol, media item, or stream.

    Object:
      description: Things with identity that can be named, tracked, owned, grouped, related, or assigned.
      children:

        Entity:
          description: Individually tracked actor, machine, software agent, or system.

        Set:
          description: An object that represents many objects
          children: 

            Organization:
              description: Structured group with membership, command, ownership, or parent-child organization links.

            Collection:
              description: Informal, adhoc grouping of objects with common purpose, appartnance, affinity or goal
                  
            Cluster:
              description: A set of objects united only by criterion

        Item:
          description: A discrete bounded non-agent object

        Location:
          description: Physical-world feature, named location, site, or bounded place.

    Control:
      description: Desired outcomes and directed work.
      children:

        Objective:
          description: Desired end state conveying intent, success rule, target, constraints

        Task:
          description: A directive to accomplish an objective; TaskLevel distinguishes mission-level and plan-level task structure.

        Command:
          description: An immediate imperative requiring execution without interpretation

        Reference:
          description: Control-side referent such as mark, path, region, boundary, target, waypoint, route, or area.

        Constraint:
          description: Limit, rule, condition, or time/resource bound applied to directed work.

        Interface:
          description: Control surface, lease, operator input, remote-control mapping, or executor-facing command interface.

    Communication:
      description: Movement of information between endpoints.
      children:

        Node:
          description: Endpoint that sends, receives, relays, records, controls, or bridges messages.

        Network:
          description: Connectivity topology and routing state.

        Link:
          description: Discrete packet/message path with endpoints, addresses, capacity, condition, and status.

        Stream:
          description: Continuous or ordered data flow such as telemetry, media, sensor samples, or raw bytes.

        Protocol:
          description: Wire format, message id space, payload format, command/result vocabulary, and mapping metadata.

        Message:
          description: Transmitted envelope plus payload.
          children:

            Command:
              description: Message whose payload directs action.

            Telemetry:
              description: Message whose payload reports sender or asset state.

            Observation:
              description: Message whose payload reports external objects, events, environment, or intelligence.

            Response:
              description: Message whose payload acknowledges, rejects, reports delivery, returns data, or reports errors.

    Data:
      description: Concrete facts, state, observations, media, events, and effects.
      children:

        Property:
          description: A generally fixed characteristic, classification, disposition, or capability that defines an object, but is not merely its momentary condition
          children:

            Identity:
              description: Fundamental identity, name, ID
              
            Attribute:
              description: Fundamental characteristics, type, form
              
            Parameter:
              description: Current operating configuration or control regime
              
            Relationship:
              description: Nature of relations, ownership, provenance, link

        State:
          description: Changing condition of an object, node, link, task, system, or process.
          children:

            Position:
              description: Position, attitude, motion, altitude, navigation validity, and location uncertainty.

            Guidance:
              description: Navigation, arming, mode, mission progress, readiness, failsafe, estimator, and control state.

            Health:
              description: Fault, readiness, maintenance, damage, alert, subsystem, and resource health state.

            Resource:
              description: Power, fuel, supply, inventory, payload loadout, capacity, and consumption state.

            Sensor:
              description: Sensor sample, sensor mode, tracker, gimbal, environment sample, calibration, or measurement quality.

            Runtime:
              description: Firmware, hardware identity, software build, load, counters, storage, diagnostics, and internal process state.

            Assignment:
              description: Current task, owner, control lease, objective binding, dispatch state, phase, and status log.

        Event:
          description: Discrete occurrence with subject, source, time, type, and event data.

        Observation:
          description: External detection, classification, track, signal, spot report, threat, or assessment data.

          Detection:
            description: Assessment that something exists or occurred
            
          Classification:
            description: Assessment assigning type or identity to an object
            
          Track:
            description: Assessment of the state of an external object over time
            
          Assessment:
            description: Evaluation of effect, damage, outcome, or threat

        Media:
          description: Image, video, audio, document, frame, recording, point cloud, sample block, or binary media reference.

        Effect:
          description: Payload use, target handover, fires, arming, effector state, result, or damage assessment.
