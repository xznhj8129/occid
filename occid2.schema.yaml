# Experimental minimal semantic schema demo
version: 1
type: schema
package: occid2_demo
root: Root

# Axes are typed semantic dimensions. Values are semantic factors.
# `applies` is applicability: the axis is meaningful only where the region can
# hold. Applicability does not assert the region; it only checks meaning.
axes:
  Substrate:
    cardinality: one
    values:
      - BIOLOGICAL
      - MECHANICAL
      - CYBER

  PhysicalDomain:
    description: Existing domain; a bounded thing operates in exactly one.
    cardinality: one
    values:
      - LAND
      - AIR
      - SEA
      - UNDERSEA
      - SPACE

  Controller:
    cardinality: one
    applies:
      all:
        - Machine
    values:
      - MANNED
      - UNMANNED

  Locomotion:
    cardinality: one
    values:
      - SELF_PROPELLED
      - EXTERNAL
      - STATIC

  Airframe:
    description: Simplified airframe construction, independent of takeoff capability.
    cardinality: one
    applies:
      all:
        - Machine
        - PhysicalDomain.AIR
    values:
      - MULTIROTOR
      - FIXED_WING

  Frame:
    cardinality: one
    values:
      - WGS84
      - LOCAL
      - BODY

  BloodGroup:
    cardinality: one
    applies:
      all:
        - Substrate.BIOLOGICAL
    # One axis-scoped requirement, never one rule per value.
    requires:
      - Biological
    values:
      - A_POS
      - A_NEG
      - B_POS
      - B_NEG
      - AB_POS
      - AB_NEG
      - O_POS
      - O_NEG

  Realm:
    cardinality: one
    values:
      - WORLD
      - INFORMATION

  TemporalMode:
    cardinality: one
    values:
      - ACHIEVE
      - MAINTAIN

  TruthTarget:
    cardinality: one
    applies:
      any:
        - Existence
        - Connectivity
    values:
      - "TRUE"
      - "FALSE"


enums:
  ManeuverIntent:
    - MOVE = 0
    - HOLD

  InformationIntent:
    - LOCATE = 0
    - TRACK
    - IDENTIFY
    - CLASSIFY

  EffectIntent:
    - CREATE = 0
    - REMOVE

  TaskPriority:
    - ROUTINE = 0
    - HIGH
    - IMMEDIATE

  TaskStatus:
    - NEW = 0
    - ACTIVE
    - COMPLETE
    - FAILED
    - CANCELLED

# Surface vocabulary remains ordinary enum members. `product` maps a member to
# the deeper semantic product it compresses. Model names are expanded to their
# semantic ancestry by the compiler.
#
# `relation` names the directed semantic relation the word opens but does not
# flatten into the product: a location task still asks "locate what?". The
# operand lives in a relation and in representation-declared field metadata.
codewords:
  ManeuverIntent.MOVE:
    product: [Task, Realm.WORLD, TemporalMode.ACHIEVE, Position]
    relation: Destination

  ManeuverIntent.HOLD:
    product: [Task, Realm.WORLD, TemporalMode.MAINTAIN, Position]
    relation: Destination

  InformationIntent.LOCATE:
    product: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE, Position]
    relation: Target

  InformationIntent.TRACK:
    product: [Task, Realm.INFORMATION, TemporalMode.MAINTAIN, Position]
    relation: Target

  InformationIntent.IDENTIFY:
    product: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE, Identity]
    relation: Target

  InformationIntent.CLASSIFY:
    product: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE, Classification]
    relation: Target

  EffectIntent.CREATE:
    product: [Task, Realm.WORLD, TemporalMode.ACHIEVE, Existence, TruthTarget.TRUE]
    relation: Target

  EffectIntent.REMOVE:
    product: [Task, Realm.WORLD, TemporalMode.ACHIEVE, Existence, TruthTarget.FALSE]
    relation: Target


models:
  Root:
    description: Everything

  Object:
    description: A discrete thing in the operational world.
    parent: Root # note: Product always includes parent

  Locality:
    description: Physical reference place in the world, ie village, bridge, mountain
    parent: Object
    fields:
      name: optional string

  Entity:
    description: A discrete participant capable of actions.
    parent: Object
    fields:
      uid: UID
      name: optional string

  Biological:
    description: Living participants. Disjoint from Machine.
    parent: Entity
    product:
      - Substrate.BIOLOGICAL

  Person:
    parent: Biological
    fields:
      name: optional string

  Actor:
    parent: Person
    fields:
      role: optional string

  Machine:
    parent: Entity
    product:
      - Substrate.MECHANICAL
    fields:
      serial_number: optional string

  Vehicle:
    parent: Machine
    product:
      - Locomotion.SELF_PROPELLED
      - Substrate.MECHANICAL
    fields:
      model: optional string

  CrewedVehicle:
    parent: Vehicle
    product:
      - Controller.MANNED

  UnmannedVehicle:
    parent: Vehicle
    product:
      - Controller.UNMANNED

  Data:
    parent: Root

  State:
    parent: Data

  Mark:
    parent: Data
    description: Simple representation of a selected point in world
    product: 
      - GlobalPosition
    fields:
      uid: UID
      name: optional string

  Position:
    parent: State

  Altitude:
    description: Vertical position above a reference; meaningful only in air.
    parent: State
    applies:
      - PhysicalDomain.AIR
    fields:
      m: float

  Existence:
    parent: State

  Connectivity:
    parent: State

  Identity:
    parent: State

  Classification:
    parent: State

  GlobalPosition:
    parent: Position
    product:
      - Position
      - Frame.WGS84
    fields:
      lat: float
      lon: float
      alt_m: float

  Control:
    parent: Root

  Directive:
    parent: Control

  Task:
    description: Requirement that some proposition become or remain sufficiently true
    parent: Directive
    fields:
      uid: UID
      instruction: string
      objective_uid: optional UID
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW

  Mission:
    description: A named body of assigned work.
    parent: Directive

  TaskManeuver:
    description: A task concerning movement or maintaining position; intent is ordinary vocabulary.
    parent: Task
    product: [Task]
    fields:
      intent: ManeuverIntent

  TaskInformation:
    description: Practical surface representation for information-outcome task vocabulary
    parent: Task
    product: [Task]
    fields:
      intent: InformationIntent

  TaskEffect:
    description: Practical surface representation for effect task vocabulary
    parent: Task
    product: [Task]
    fields:
      intent: EffectIntent

# Never ever create prefixed "assigned/inline" or other PrefixX models

# Named classes are optional human aliases for useful semantic products.
# An alias is a product, not a representation and not a fundamental identity.
aliases:
  AirMission: [Mission, PhysicalDomain.AIR]
  AirTask: [Task, PhysicalDomain.AIR]
  UGV: [UnmannedVehicle, PhysicalDomain.LAND]
  UAV: [UnmannedVehicle, PhysicalDomain.AIR]
  Drone: [UAV, Airframe.MULTIROTOR]


relations:
  Destination:
    description: A task has a destination position; operand order is task, position.
    signature: [Task, Position]

  Target:
    description: A task acts on a target entity; operand order is task, entity.
    signature: [Task, Entity]

  AssignedWork:
    description: An entity is assigned a task; operand order is entity, task.
    signature: [Entity, Task]


