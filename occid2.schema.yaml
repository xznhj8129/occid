# OCCID2 semantic algebra
#
# This file is a set of equations, not a class hierarchy. Read `*` as the
# product: an unordered, idempotent conjunction of factors of one thing.
#
#   factor       one coordinate of an independent semantic dimension
#   product      f1 * f2 * ... describes one thing; the product is the address
#   alias        Name := product; naming creates no ontology
#   chart        Q * C := v1 * v2 * ...; a quantity in a representation
#                reduces to irreducible typed variables and names the data
#                model it compiles
#   relation     R(role: region, ...); directed, ordered, role-bearing
#   expression   fixed factors + typed free variables + equations;
#                an unbound variable is an unknown, not an error
#   model        Name := parent * name * product; a named product
#
# YAML is only the transport.

version: 2
type: schema
package: occid2_demo
root: Root

# ---------------------------------------------------------------------------
# Axes are typed semantic dimensions. Their values are factors. `applies`
# checks that a dimension is meaningful in a region; `requires` asserts a
# region into the closure. Cardinality bounds a dimension in a complete
# description; per-value disjointness declarations are never needed.
# ---------------------------------------------------------------------------

axes:
  Substrate:
    cardinality: one
    values:
      - BIOLOGICAL
      - MECHANICAL
      - CYBER

  PhysicalDomain:
    description: A bounded thing operates in exactly one domain.
    cardinality: one
    values:
      - LAND
      - AIR
      - SEA
      - UNDERSEA
      - SPACE

  Controller:
    cardinality: one
    applies:
      all:
        - Machine
    values:
      - MANNED
      - UNMANNED

  Locomotion:
    cardinality: one
    values:
      - SELF_PROPELLED
      - EXTERNAL
      - STATIC

  Airframe:
    description: Airframe construction, independent of takeoff capability.
    cardinality: one
    applies:
      all:
        - Machine
        - PhysicalDomain.AIR
    values:
      - MULTIROTOR
      - FIXED_WING

  Representation:
    description: How a semantic quantity becomes data -- its coordinate scheme, datum, unit, or encoding.
    cardinality: many
    values:
      - Geodetic
      - LocalCartesian
      - LocalEuler
      - Quaternion
      - Epoch
      - UID
      - IntID
      - PlainText
      - Seconds
      - Radians
      - Meters
      - MetersPerSecond
      - MSL
      - FlightLevel
      - Boolean
      - Protocol
      - Decimal
      - Integer

  BloodGroup:
    cardinality: one
    applies:
      all:
        - Substrate.BIOLOGICAL
    # One axis-scoped requirement, never one rule per value.
    requires:
      - Biological
    values:
      - A_POS
      - A_NEG
      - B_POS
      - B_NEG
      - AB_POS
      - AB_NEG
      - O_POS
      - O_NEG

  Realm:
    cardinality: one
    values:
      - WORLD
      - INFORMATION

  TemporalMode:
    cardinality: one
    values:
      - ACHIEVE
      - MAINTAIN

  TruthTarget:
    cardinality: one
    applies:
      any:
        - Existence
        - Connectivity
        - Engagement
        - Activity
        - Paused
        - Hold
    values:
      - "TRUE"
      - "FALSE"

# ---------------------------------------------------------------------------
# Surface vocabulary. Enum members are representation, never semantic factors.
# The verb vocabularies (TaskIntent, CommandOperation) are not authored here:
# a word is only a name for an expression, the expressions declare the words
# that name them, and the vocabulary is compiled from those declarations.
# What remains below are standalone value vocabularies.
# ---------------------------------------------------------------------------

enums:
  TaskPriority:
    - ROUTINE = 0
    - HIGH
    - IMMEDIATE

  TaskStatus:
    - NEW = 0
    - ACTIVE
    - COMPLETE
    - FAILED
    - CANCELLED
    - ACCEPTED

  ControlLevel:
    - NONE = 0
    - MONITOR
    - GUIDE
    - FULL

  PlanApprovalState:
    - DRAFT = 0
    - PROPOSED
    - APPROVED
    - REJECTED
    - SUPERSEDED

  BooleanOperator:
    - NONE = 0
    - NOT
    - AND
    - OR
    - XOR
    - NAND
    - NOR
    - XNOR




# ---------------------------------------------------------------------------
# Relations connect independently existing things. Only links that are neither
# factors of one thing nor variables of an expression are relations: work
# participants are expression variables, plans aggregate, and these are the
# links that remain. Each is declared once; roles belong to the relation.
# ---------------------------------------------------------------------------

relations:
  AssignedWork:
    description: An entity carries work.
    operands:
      assignee: Entity
      work: Task

  ConstrainedBy:
    description: A constraint bounds directed work.
    operands:
      subject: Control
      constraint: Constraint

  OwnedBy:
    description: An objective is owned by an entity.
    operands:
      objective: Objective
      owner: Entity

  Holds:
    description: An entity holds an authority.
    operands:
      authority: Authority
      holder: Entity

  GrantedBy:
    description: An authority was granted by an entity.
    operands:
      authority: Authority
      grantor: Entity

  Controls:
    description: A lease controls an asset.
    operands:
      lease: Lease
      asset: Object

  Contains:
    description: A plan contains an item of work, a participant, or a resource.
    operands:
      plan: Plan
      item: Root

# ---------------------------------------------------------------------------
# Charts reduce a semantic quantity in a chosen representation to
# irreducible typed variables:
#
#     chart Q * C  :=  v1 * v2 * ... * vn
#
# The quantity stays semantic; the representation selects the data. A chart
# names the data model its variables compile into, so a field type is a chart
# application, never a hand-authored model.
# ---------------------------------------------------------------------------

charts:
  Position * Representation.Geodetic:
    model: GlobalPosition
    lat: float[deg]
    lon: float[deg]
    h: float[m]

  Position * Representation.LocalCartesian:
    model: LocalPosition
    x: float[m]
    y: float[m]
    z: float[m]

  Velocity * Representation.LocalCartesian:
    model: LocalVelocity
    vx: float[m/s]
    vy: float[m/s]
    vz: float[m/s]

  Attitude * Representation.LocalEuler:
    model: LocalAttitude
    roll: float[rad]
    pitch: float[rad]
    yaw: float[rad]

  Attitude * Representation.Quaternion:
    model: QuaternionAttitude
    qw: float
    qx: float
    qy: float
    qz: float

  Time * Representation.Epoch:
    model: Timestamp
    utime: float[s]

  Identity * Representation.UID:
    model: UID
    uid: string

  Identity * Representation.IntID:
    model: IntID
    id: int

  Text * Representation.PlainText:
    model: PlainText
    value: string

  Duration * Representation.Seconds:
    model: DurationSeconds
    seconds: float[s]

  Angle * Representation.Radians:
    model: AngleRadians
    rad: float[rad]

  Distance * Representation.Meters:
    model: DistanceMeters
    m: float[m]

  Speed * Representation.MetersPerSecond:
    model: SpeedMetersPerSecond
    mps: float[m/s]

  Altitude * Representation.MSL:
    model: AltitudeMSL
    m: float[m]

  Altitude * Representation.FlightLevel:
    model: AltitudeFlightLevel
    fl: float

  Count * Representation.Integer:
    model: ItemCount
    count: int

  Ordinal * Representation.Integer:
    model: OrdinalValue
    n: int

  Truth * Representation.Boolean:
    model: TruthBoolean
    holds: bool

  Code * Representation.Protocol:
    model: ProtocolCode
    code: int

  Scalar * Representation.Decimal:
    model: ScalarDecimal
    value: float

  Scalar * Representation.Integer:
    model: ScalarInteger
    value: int

# ---------------------------------------------------------------------------
# Open expressions:
#
#     E := fixed semantic factors + typed free variables + equations
#
# `given` variables are inputs; `sought` variables are answers. An unbound
# variable is an unknown, not an error, so an expression can be recorded
# before every participant is known.
#
# A form declares the invariant structure; `words:` binds the remaining
# dimensions per vocabulary member and the compiler expands each word into its
# compiled expression. MOVE and HOLD are one form at TemporalMode.ACHIEVE and
# TemporalMode.MAINTAIN -- a synonym or antonym in a vocabulary is a red flag
# for a form that has not been factored.
# ---------------------------------------------------------------------------

expressions:
  POSITION_GOAL:
    description: An actor's position is the destination, achieved or maintained.
    factors: [Task, Realm.WORLD]
    given:
      actor: Entity
      destination: Position
    equations:
      - Position(actor) = destination
    words:
      TaskIntent.MOVE: [TemporalMode.ACHIEVE]
      TaskIntent.HOLD: [TemporalMode.MAINTAIN]

  POSITION_QUERY:
    description: An entity's position is the answer, achieved or maintained.
    factors: [Task, Realm.INFORMATION]
    given:
      target: Entity
    sought:
      position: Position
    equations:
      - Position(target) = position
    words:
      TaskIntent.LOCATE: [TemporalMode.ACHIEVE]
      TaskIntent.TRACK: [TemporalMode.MAINTAIN]

  IDENTIFY:
    description: Solve for the identity of an entity.
    factors: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE]
    given:
      target: Entity
    sought:
      identity: Identity
    equations:
      - Identity(target) = identity
    words: [TaskIntent.IDENTIFY]

  CLASSIFY:
    description: Solve for the classification of an entity.
    factors: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE]
    given:
      target: Entity
    sought:
      classification: Classification
    equations:
      - Classification(target) = classification
    words: [TaskIntent.CLASSIFY]

  EXISTENCE_GOAL:
    description: An object's existence is asserted true or false.
    factors: [Task, Realm.WORLD, TemporalMode.ACHIEVE, Existence]
    given:
      object: Object
    words:
      TaskIntent.CREATE: [TruthTarget.TRUE]
      TaskIntent.REMOVE: [TruthTarget.FALSE]

  FOLLOW:
    description: Follow a path.
    factors: [Task, Realm.WORLD, TemporalMode.MAINTAIN]
    given:
      actor: Entity
      path: GeoPath
    words: [TaskIntent.FOLLOW]

  MEASURE:
    description: Measure a state of a target.
    factors: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE]
    given:
      target: Entity
    sought:
      measurement: State
    words: [TaskIntent.MEASURE]

  OBJECT_STATE_GOAL:
    description: An object's state is changed, or kept as it is.
    factors: [Task, Realm.WORLD]
    given:
      object: Object
    words:
      TaskIntent.MODIFY: [TemporalMode.ACHIEVE]
      TaskIntent.PROTECT: [TemporalMode.MAINTAIN]

  RESTORE:
    description: Return an object to a prior state.
    factors: [Task, Realm.WORLD, TemporalMode.ACHIEVE]
    given:
      object: Object
    words: [TaskIntent.RESTORE]

  DENY:
    description: Prevent connectivity to an object.
    factors: [Task, Realm.WORLD, TemporalMode.MAINTAIN, Connectivity, TruthTarget.FALSE]
    given:
      object: Object
    words: [TaskIntent.DENY]

  TRANSPORT:
    description: Move a thing between places; which end and what moves are bindings.
    factors: [Task, Realm.WORLD, TemporalMode.ACHIEVE]
    given:
      cargo: Object
      origin: Position
      destination: Position
    words: [TaskIntent.TRANSPORT]

  # A command's twins are one form over a state: TruthTarget selects the
  # direction. A parameter that matters is a typed free variable, not a column.

  ENGAGEMENT_COMMAND:
    description: Assert the target state true or false.
    factors: [Command]
    given:
      target: Object
    words:
      CommandOperation.ENGAGE: [TruthTarget.TRUE]
      CommandOperation.DISENGAGE: [TruthTarget.FALSE]

  PROCESS_COMMAND:
    description: Assert a running process paused, or release it.
    factors: [Command, Paused]
    given:
      target: Object
      process: Text
    words:
      CommandOperation.PAUSE: [TruthTarget.TRUE]
      CommandOperation.RESUME: [TruthTarget.FALSE]

  SET:
    description: Set a declared state property on the target.
    factors: [Command]
    given:
      target: Object
      property: Text
      value: Scalar
    words: [CommandOperation.SET]

  DIRECT:
    description: Direct the target to a destination or along a path.
    factors: [Command, TemporalMode.ACHIEVE]
    given:
      target: Object
      destination: Position
      path: GeoPath
      radius: Distance
      speed: Speed
      yaw: Angle
    equations:
      - Position(target) = destination
    words: [CommandOperation.MOVE]

  ALLOCATE:
    description: Allocate a referenced resource.
    factors: [Command]
    given:
      target: Object
      resource: Resource
      quantity: Count
    words: [CommandOperation.ALLOCATE]

  TRANSFER:
    description: Transfer a referenced resource.
    factors: [Command]
    given:
      target: Object
      resource: Resource
      quantity: Count
    words: [CommandOperation.TRANSFER]

  LOAD_CONFIGURATION:
    description: Load a referenced configuration on the target.
    factors: [Command]
    given:
      target: Object
      parameter: Text
      value: Scalar
    words: [CommandOperation.LOAD_CONFIGURATION]

  RESET:
    description: Reset the target to its initial state.
    factors: [Command]
    given:
      target: Object
    words: [CommandOperation.RESET]

# ---------------------------------------------------------------------------
# Models are named products and carriers. Parentage entails the parent's
# meaning; compiled semantics carry inherited factors and derive ancestor
# labels by closure. `product:` entries expand to the semantics they name.
# Chart applications are not models: a chart compiles its own data model.
# ---------------------------------------------------------------------------

models:
  Root:
    description: Everything

  Object:
    description: A discrete thing in the operational world.
    parent: Root

  Locality:
    description: Physical reference place in the world, ie village, bridge, mountain
    parent: Object
    fields:
      name: optional PlainText

  Entity:
    description: A discrete participant capable of actions.
    parent: Object
    fields:
      uid: UID
      name: optional PlainText

  Biological:
    description: Living participants. Disjoint from Machine.
    parent: Entity
    product:
      - Substrate.BIOLOGICAL

  Person:
    parent: Biological
    fields:
      name: optional PlainText

  Actor:
    parent: Person
    fields:
      role: optional Role

  Machine:
    parent: Entity
    product:
      - Substrate.MECHANICAL
    fields:
      serial_number: optional PlainText

  Vehicle:
    parent: Machine
    product:
      - Locomotion.SELF_PROPELLED
      - Substrate.MECHANICAL
    fields:
      model: optional PlainText

  CrewedVehicle:
    parent: Vehicle
    product:
      - Controller.MANNED

  UnmannedVehicle:
    parent: Vehicle
    product:
      - Controller.UNMANNED

  Data:
    description: Values rather than world referents.
    parent: Root

  State:
    description: A semantic quantity; a chart realizes it as data variables.
    parent: Data

  Position:
    description: Where something is.
    parent: State

  Velocity:
    parent: State

  Attitude:
    parent: State

  Identity:
    parent: State

  Classification:
    parent: State

  Existence:
    parent: State

  Connectivity:
    parent: State

  Engagement:
    description: Whether a declared property or function is engaged.
    parent: State

  Activity:
    description: Whether a process or execution is running.
    parent: State

  Paused:
    description: Whether a running process is held paused.
    parent: State

  Hold:
    description: Whether a resource is held by its holder.
    parent: State

  Truth:
    description: Whether a proposition holds.
    parent: State

  Text:
    description: Human-authored textual content whose encoding is not itself domain meaning.
    parent: State

  Duration:
    description: An interval of time.
    parent: State

  Angle:
    parent: State

  Distance:
    parent: State

  Speed:
    parent: State

  Count:
    description: Discrete quantity.
    parent: State

  Ordinal:
    description: Position in an ordered sequence.
    parent: State

  Code:
    description: Opaque protocol or enumeration code.
    parent: State

  Scalar:
    description: A bare scalar with no further unit semantics.
    parent: State

  Altitude:
    description: Vertical position above a reference; meaningful only in air.
    parent: State
    applies:
      - PhysicalDomain.AIR

  Mark:
    description: Named point of interest; its semantic form is a position.
    parent: Data
    product:
      - GlobalPosition
    fields:
      uid: UID
      name: optional PlainText

  Control:
    parent: Root

  Directive:
    parent: Control

  Task:
    description: Requirement that some proposition become or remain sufficiently true.
    parent: Directive
    fields:
      uid: UID
      instruction: PlainText
      intent: TaskIntent
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW

  Mission:
    description: A named body of assigned work.
    parent: Directive

  # ===========================================================================
  # Controlled work, expressed rather than transcribed.
  #
  # The word is the whole verb taxonomy: `Task.intent` and `Command.operation`
  # carry a vocabulary member, the member names an expression, and the
  # expression entails its factors. Verb parameters are typed free variables;
  # records, constraints, objectives, authorities, and plans are value models;
  # links between independently existing things are relations with named roles.
  # ===========================================================================

  # --- value models ----------------------------------------------------------

  Record:
    description: Provenance and revision metadata for a stored thing.
    parent: Data
    fields:
      uid: UID
      id: optional IntID
      revision: optional ItemCount
      created_ts: Timestamp
      updated_ts: Timestamp
      origin_system: PlainText
      provenance: list[PlainText]

  Time:
    description: A point on the time line.
    parent: State

  Range:
    parent: Data

  NumericRange:
    parent: Range
    fields:
      min_value: optional ScalarDecimal
      max_value: optional ScalarDecimal

  Condition:
    description: Predicate logic; it describes logic, not the state of evaluating it.
    parent: Data

  Predicate:
    description: Atomic condition; a quantity of a subject compared against a value.
    parent: Condition
    fields:
      subject: optional UID
      quantity: optional PlainText
      value: optional Scalar

  BooleanLogic:
    description: Boolean composition of conditions.
    parent: Condition
    fields:
      operator: BooleanOperator
      terms: list[Condition]

  GeoPath:
    parent: Data
    fields:
      points: list[GlobalPosition]

  Role:
    description: An organizational function; authority attaches to the role, not to its current holder.
    parent: Data
    fields:
      name: optional PlainText

  Resource:
    description: A thing that can be acquired, allocated, or transferred.
    parent: Object
    fields:
      uid: optional UID
      name: optional PlainText

  # --- constraints ------------------------------------------------------------

  Constraint:
    description: Limit, rule, or time/resource bound applied to directed work.
    parent: Control
    fields:
      condition: optional Condition

  TaskTimeWindow:
    parent: Constraint
    fields:
      earliest_start: optional Timestamp
      latest_finish: optional Timestamp

  WeatherLimits:
    parent: Constraint
    fields:
      ifr: optional TruthBoolean
      night: optional TruthBoolean
      rain: optional NumericRange
      snow: optional NumericRange
      temp: optional NumericRange
      wind: optional NumericRange
      vis: optional NumericRange
      icing: optional TruthBoolean

  # --- objectives -------------------------------------------------------------
  # A desired end state is a condition, and success is decided by conditions;
  # `Condition` is the common atom, not a species per criterion.

  Objective:
    description: Desired end state; the condition that should hold, the criteria that decide it, priority, and deadline.
    parent: Control
    fields:
      record: optional Record
      uid: UID
      id: optional IntID
      name: PlainText
      condition: optional Condition
      criteria: list[Condition]
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW
      start_time: optional Timestamp
      deadline: optional Timestamp

  # --- commands ---------------------------------------------------------------
  # The operation word selects the expression and nothing else: there is no
  # per-operation command class, and a verb's parameters are its variables.

  Command:
    description: Immediate bounded imperative applied to a concrete target.
    parent: Directive
    fields:
      uid: UID
      operation: CommandOperation

  # --- authorities ------------------------------------------------------------

  Authority:
    description: Command, permission, delegation, or control-right context for directed work.
    parent: Control
    fields:
      record: optional Record
      uid: UID
      id: optional IntID
      role: optional Role

  Lease:
    description: Bounded control right issued under an Authority.
    parent: Authority
    fields:
      bound: optional Condition
      control_level: optional ControlLevel

  # --- plans ------------------------------------------------------------------
  # Membership and assignment are relations (AssignedWork, Contains); a plan
  # record is representation of approval state, not a tree of pointers.

  Plan:
    description: Proposed or approved method for accomplishing work.
    parent: Control
    fields:
      record: optional Record
      uid: UID
      id: optional IntID
      name: optional PlainText
      approval_state: PlanApprovalState = DRAFT

  PlanContingency:
    description: Conditional work that applies when a condition holds.
    parent: Data
    fields:
      condition: Condition

# ---------------------------------------------------------------------------
# Aliases name useful products. A named combination and an unnamed equivalent
# combination have the same semantic normal form.
# ---------------------------------------------------------------------------

aliases:
  AirMission: [Mission, PhysicalDomain.AIR]
  AirTask: [Task, PhysicalDomain.AIR]
  UGV: [UnmannedVehicle, PhysicalDomain.LAND]
  UAV: [UnmannedVehicle, PhysicalDomain.AIR]
  Drone: [UAV, Airframe.MULTIROTOR]
  Geodetic: [Representation.Geodetic]
  LocalCartesian: [Representation.LocalCartesian]
  LocalEuler: [Representation.LocalEuler]
  Quaternion: [Representation.Quaternion]
  Epoch: [Representation.Epoch]
