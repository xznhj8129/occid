# OCCID2 semantic algebra
#
# This file is a set of equations, not a class hierarchy. Read `*` as the
# product: an unordered, idempotent conjunction of factors of one thing.
#
#   factor       one coordinate of an independent semantic dimension
#   product      f1 * f2 * ... describes one thing; the product is the address
#   alias        Name := product; naming creates no ontology
#   chart        Q * C := v1 * v2 * ...; a quantity in a representation
#                reduces to irreducible typed variables
#   relation     R(role: region, ...); directed, ordered, role-bearing;
#                a specialization inherits direction positionally
#   scheme       a parameterized expression family
#   expression   fixed factors + typed free variables + equations;
#                an unbound variable is an unknown, not an error
#   definition   semantic declarations interpreted by the live registry
#
# YAML is only the transport.

version: 2

# ---------------------------------------------------------------------------
# Axes are typed semantic dimensions. Their values are factors. `applies`
# checks that a dimension is meaningful in a region; `requires` asserts a
# region into the closure. Cardinality bounds a dimension in a complete
# description; per-value disjointness declarations are never needed.
# ---------------------------------------------------------------------------

axes:
  Substrate:
    cardinality: one
    values:
      - BIOLOGICAL
      - MECHANICAL
      - CYBER

  PhysicalDomain:
    description: A bounded thing operates in exactly one domain.
    cardinality: one
    values:
      - LAND
      - AIR
      - SEA
      - UNDERSEA
      - SPACE

  Controller:
    cardinality: one
    applies:
      all:
        - Machine
    values:
      - MANNED
      - UNMANNED

  Locomotion:
    cardinality: one
    values:
      - SELF_PROPELLED
      - EXTERNAL
      - STATIC

  Airframe:
    description: Airframe construction, independent of takeoff capability.
    cardinality: one
    applies:
      all:
        - Machine
        - PhysicalDomain.AIR
    values:
      - MULTIROTOR
      - FIXED_WING

  Representation:
    description: The coordinate scheme through which a structured quantity becomes data variables.
    cardinality: many
    values:
      - Geodetic
      - LocalCartesian
      - LocalEuler
      - Quaternion

  # Height references are semantic factors, not provenance annotations.
  # Recognizing Position does not make ellipsoid and MSL heights interchangeable.
  # An omitted reference remains unknown; no reference is assumed or converted.
  AltitudeReference:
    cardinality: one
    applies: {any: [{all: [Position, Representation.Geodetic]}, Height]}
    values:
      - WGS84Ellipsoid
      - MeanSeaLevel

  BloodGroup:
    cardinality: one
    applies:
      all:
        - Substrate.BIOLOGICAL
    # One axis-scoped requirement, never one rule per value.
    requires:
      - Biological
    values:
      - A_POS
      - A_NEG
      - B_POS
      - B_NEG
      - AB_POS
      - AB_NEG
      - O_POS
      - O_NEG

  Realm:
    cardinality: one
    values:
      - WORLD
      - INFORMATION

  TemporalMode:
    cardinality: one
    values:
      - ACHIEVE
      - MAINTAIN

  TruthTarget:
    cardinality: one
    applies:
      any:
        - Existence
        - Connectivity
        - Engagement
        - Activity
        - Paused
        - Hold
    values:
      - "TRUE"
      - "FALSE"

  # A component's role qualifies its own quantity. It does not turn the
  # containing task, objective, or path into that quantity.
  IdentifierKind:
    cardinality: one
    values: [UID, SerialNumber, ModelDesignator]
  TextRole:
    cardinality: one
    values: [Name, Instruction]
  Bound:
    cardinality: one
    values: [Lower, Upper]
  TimeRole:
    cardinality: one
    values: [EarliestStart, LatestFinish, Start, Deadline]
  ConditionRole:
    cardinality: many
    values: [Requirement, Criterion, Term, LeaseBound, Trigger]
  WeatherQuantity:
    cardinality: one
    values: [Rain, Snow, Temperature, Wind, Visibility]
  PermissionKind:
    cardinality: one
    values: [IFR, Night, Icing]
  PathRole:
    cardinality: one
    values: [Waypoint]
  Participation:
    cardinality: many
    values: [Actor, Destination, Origin, Target, Object, Cargo, Path, Resource, Quantity, Radius, Speed, Yaw, Process, Property, Parameter, Value, Subject, PositionAnswer, IdentityAnswer, ClassificationAnswer, MeasurementAnswer]
  BindingMode:
    cardinality: one
    values: [Input, Answer]

  # These dimensions are meanings. The numeric codes in the vocabularies
  # below are representations; chart bindings declare their correspondence.
  Urgency:
    cardinality: one
    values: [ROUTINE, HIGH, IMMEDIATE]
  WorkState:
    cardinality: one
    values: [NEW, ACTIVE, COMPLETE, FAILED, CANCELLED, ACCEPTED]
  ControlExtent:
    cardinality: one
    values: [NONE, MONITOR, GUIDE, FULL]
  ApprovalState:
    cardinality: one
    values: [DRAFT, PROPOSED, APPROVED, REJECTED, SUPERSEDED]
  LogicOperator:
    cardinality: one
    values: [NONE, NOT, AND, OR, XOR, NAND, NOR, XNOR]

# ---------------------------------------------------------------------------
# Surface vocabulary. Members are representation, never semantic factors.
# A word is a name an expression declares for itself; the runtime collects
# those names into its vocabulary. What remains below are the value
# vocabularies, which are not words.
# ---------------------------------------------------------------------------

vocabularies:
  TaskPriority:
    ROUTINE: 0
    HIGH: 1
    IMMEDIATE: 2

  TaskStatus:
    NEW: 0
    ACTIVE: 1
    COMPLETE: 2
    FAILED: 3
    CANCELLED: 4
    ACCEPTED: 5

  ControlLevel:
    NONE: 0
    MONITOR: 1
    GUIDE: 2
    FULL: 3

  PlanApprovalState:
    DRAFT: 0
    PROPOSED: 1
    APPROVED: 2
    REJECTED: 3
    SUPERSEDED: 4

  BooleanOperator:
    NONE: 0
    NOT: 1
    AND: 2
    OR: 3
    XOR: 4
    NAND: 5
    NOR: 6
    XNOR: 7

# ---------------------------------------------------------------------------
# Factors declare meaning and implications. An implication entails its region;
# closure derives semantic ancestry. Products expand to the semantics they name,
# and charts reduce selected representations to typed variables.
# No generated carrier class or field hierarchy is required.
# ---------------------------------------------------------------------------

factors:
  Root:
    description: Everything

  Object:
    description: A discrete thing in the operational world.
    implies: [Root]

  Locality:
    description: Physical reference place in the world, ie village, bridge, mountain
    implies: [Object]

  Entity:
    description: A discrete participant capable of actions.
    implies: [Object]

  Biological:
    description: Living participants. Disjoint from Machine.
    implies: [Entity, Substrate.BIOLOGICAL]

  Person:
    implies: [Biological]

  Actor:
    implies: [Person]

  Machine:
    implies: [Entity, Substrate.MECHANICAL]

  Vehicle:
    implies: [Machine, Locomotion.SELF_PROPELLED, Substrate.MECHANICAL]

  CrewedVehicle:
    implies: [Vehicle, Controller.MANNED]

  UnmannedVehicle:
    implies: [Vehicle, Controller.UNMANNED]

  Data:
    description: Values rather than world referents.
    implies: [Root]

  State:
    description: A semantic quantity; a chart realizes it as data variables.
    implies: [Data]

  Position:
    description: Where something is.
    implies: [State]

  Velocity:
    implies: [State]

  Attitude:
    implies: [State]

  Identity:
    implies: [State]

  Classification:
    implies: [State]

  Existence:
    implies: [State]

  Connectivity:
    implies: [State]

  Engagement:
    description: Whether a declared property or function is engaged.
    implies: [State]

  Activity:
    description: Whether a process or execution is running.
    implies: [State]

  Paused:
    description: Whether a running process is held paused.
    implies: [State]

  Hold:
    description: Whether a resource is held by its holder.
    implies: [State]

  Text:
    primitive: string
    description: Human-authored textual content whose encoding is not itself domain meaning.
    implies: [State]

  Duration:
    primitive: float
    description: An interval of time.
    implies: [State]

  Angle:
    primitive: float
    implies: [State]

  Distance:
    primitive: float
    implies: [State]

  Speed:
    primitive: float
    implies: [State]

  Count:
    primitive: int
    description: Discrete quantity.
    implies: [State]

  Ordinal:
    primitive: int
    description: Position in an ordered sequence.
    implies: [State]

  Code:
    description: Opaque protocol or enumeration code.
    implies: [State]

  Scalar:
    primitive: float
    description: A bare scalar with no further unit semantics.
    implies: [State]

  Altitude:
    description: Vertical position above a reference; meaningful only in air.
    applies: [PhysicalDomain.AIR]
    implies: [State]

  Mark:
    description: Named point of interest; its semantic form is a position.
    implies: [Data, GlobalPosition]

  Control:
    implies: [Root]

  Directive:
    implies: [Control]

  Task:
    description: Requirement that some proposition become or remain sufficiently true.
    implies: [Directive]

  Mission:
    description: A named body of assigned work.
    implies: [Directive]

  # ===========================================================================
  # Controlled work, expressed rather than transcribed.
  #
  # The word is the whole verb taxonomy: `TaskIntent` and `CommandOperation`
  # members name expressions, and each expression entails its factors.
  # Verb parameters are typed free variables;
  # constraints, objectives, authorities, and plans are value models;
  # links between independently existing things are relations with named roles.
  # ===========================================================================

  # --- value models ----------------------------------------------------------

  Time:
    primitive: float
    description: A point on the time line.
    implies: [State]

  Range:
    implies: [Data]

  NumericRange:
    implies: [Range]

  Condition:
    description: Predicate logic; it describes logic, not the state of evaluating it.
    implies: [Data]

  Predicate:
    description: Atomic condition; a quantity of a subject compared against a value.
    implies: [Condition]

  BooleanLogic:
    description: Boolean composition of conditions.
    implies: [Condition]

  GeoPath:
    implies: [Data]

  Role:
    description: An organizational function; authority attaches to the role, not to its current holder.
    implies: [Data]

  Resource:
    description: A thing that can be acquired, allocated, or transferred.
    implies: [Object]

  # --- constraints ------------------------------------------------------------

  Constraint:
    description: Limit, rule, or time/resource bound applied to directed work.
    implies: [Control]

  TaskTimeWindow:
    implies: [Constraint]

  WeatherLimits:
    implies: [Constraint]

  # --- objectives -------------------------------------------------------------
  # A desired end state is a condition, and success is decided by conditions;
  # `Condition` is the common atom, not a species per criterion.

  Objective:
    description: Desired end state; the condition that should hold, the criteria that decide it, priority, and deadline.
    implies: [Control]

  # --- commands ---------------------------------------------------------------
  # The operation word selects the expression and nothing else: there is no
  # per-operation command class, and a verb's parameters are its variables.

  Command:
    description: Immediate bounded imperative applied to a concrete target.
    implies: [Directive]

  # --- authorities ------------------------------------------------------------

  Authority:
    description: Command, permission, delegation, or control-right context for directed work.
    implies: [Control]

  Lease:
    description: Bounded control right issued under an Authority.
    implies: [Authority]

  # --- plans ------------------------------------------------------------------
  # Membership and assignment are relations (AssignedWork, Contains); a plan
  # record is representation of approval state, not a tree of pointers.

  Plan:
    description: Proposed or approved method for accomplishing work.
    implies: [Control]

  PlanContingency:
    description: Conditional work that applies when a condition holds.
    implies: [Data]

  # Irreducible quantities used by the reductions below. Names and codes
  # remain values; a source field spelling is never their semantic address.
  Reference:
    implies: [Data]
  SemanticRegion:
    implies: [Data]
  Priority:
    implies: [State]
  WorkStatus:
    implies: [State]
  Approval:
    implies: [State]
  ControlPermission:
    implies: [State]
  LogicOperation:
    implies: [Data]
  Intent:
    implies: [Data]
  Operation:
    implies: [Data]
  Permission:
    primitive: bool
    implies: [State]
  Latitude:
    implies: [Angle]
  Longitude:
    implies: [Angle]
  Height:
    implies: [Distance]
  CartesianX:
    implies: [Distance]
  CartesianY:
    implies: [Distance]
  CartesianZ:
    implies: [Distance]
  VelocityX:
    implies: [Speed]
  VelocityY:
    implies: [Speed]
  VelocityZ:
    implies: [Speed]
  Roll:
    implies: [Angle]
  Pitch:
    implies: [Angle]
  Yaw:
    implies: [Angle]
  QuaternionScalar:
    implies: [Scalar]
  QuaternionX:
    implies: [Scalar]
  QuaternionY:
    implies: [Scalar]
  QuaternionZ:
    implies: [Scalar]

# ---------------------------------------------------------------------------
# Aliases name useful products. A named combination and an unnamed equivalent
# combination have the same semantic normal form.
# ---------------------------------------------------------------------------

aliases:
  AirMission: [Mission, PhysicalDomain.AIR]
  AirTask: [Task, PhysicalDomain.AIR]
  UGV: [UnmannedVehicle, PhysicalDomain.LAND]
  UAV: [UnmannedVehicle, PhysicalDomain.AIR]
  Drone: [UAV, Airframe.MULTIROTOR]
  Geodetic: [Representation.Geodetic]
  LocalCartesian: [Representation.LocalCartesian]
  LocalEuler: [Representation.LocalEuler]
  Quaternion: [Representation.Quaternion]

  # Structured representations name products selected through charts.
  # These aliases do not require Python representation classes.
  # Position expressed through the geodetic chart.
  GlobalPosition: Position * Representation.Geodetic
  # Position expressed through the local cartesian chart.
  LocalPosition: Position * Representation.LocalCartesian
  # Velocity expressed through the local cartesian chart.
  LocalVelocity: Velocity * Representation.LocalCartesian
  # Attitude expressed through the local Euler chart.
  LocalAttitude: Attitude * Representation.LocalEuler
  # Attitude expressed through the quaternion chart.
  QuaternionAttitude: Attitude * Representation.Quaternion

# ---------------------------------------------------------------------------
# Charts reduce a semantic quantity in a chosen representation to
# typed semantic variables, recursively reducing to primitives:
#
#     chart Q * C  :=  v1 * v2 * ... * vn
#
# The quantity stays semantic; the representation selects the data. A datum
# selects charts through its semantic product; a chart never declares a
# model. Each variable has its own product, type, role, and cardinality.
# `many` binds an ordered sequence: multiplication remains idempotent,
# while two equal waypoints or terms remain two distinct occurrences.
# Qualifiers propagate through a nested reduction; whole and part meanings
# are never multiplied. Names on the left are chart coordinates only.
# Missing optional variables stay unknown. Declared defaults are identifiable
# deductions and do not rewrite the source value. Units stay with primitives.
# ---------------------------------------------------------------------------

charts:
  Position * Representation.Geodetic:
    lat: {semantics: Latitude, type: float, unit: deg}
    lon: {semantics: Longitude, type: float, unit: deg}
    h: {semantics: Height, type: float, unit: m, inherit: [AltitudeReference]}

  Position * Representation.LocalCartesian:
    x: {semantics: CartesianX, type: float, unit: m}
    y: {semantics: CartesianY, type: float, unit: m}
    z: {semantics: CartesianZ, type: float, unit: m}

  Velocity * Representation.LocalCartesian:
    vx: {semantics: VelocityX, type: float, unit: m/s}
    vy: {semantics: VelocityY, type: float, unit: m/s}
    vz: {semantics: VelocityZ, type: float, unit: m/s}

  Attitude * Representation.LocalEuler:
    roll: {semantics: Roll, type: float, unit: rad}
    pitch: {semantics: Pitch, type: float, unit: rad}
    yaw: {semantics: Yaw, type: float, unit: rad}

  Attitude * Representation.Quaternion:
    qw: {semantics: QuaternionScalar, type: float}
    qx: {semantics: QuaternionX, type: float}
    qy: {semantics: QuaternionY, type: float}
    qz: {semantics: QuaternionZ, type: float}

  # The original value models reduce to quantities and typed bindings.
  # Parent meaning selects inherited charts: Machine also reduces through
  # Entity, Lease through Authority, and TaskTimeWindow through Constraint.
  Locality:
    name: {semantics: Text * TextRole.Name, type: string, optional: true}
  Entity:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    name: {semantics: Text * TextRole.Name, type: string, optional: true}
  Actor:
    role: {semantics: Role, optional: true}
  Machine:
    serial_number: {semantics: Identity * IdentifierKind.SerialNumber, type: string, optional: true}
  Vehicle:
    model: {semantics: Identity * IdentifierKind.ModelDesignator, type: string, optional: true}
  Mark:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    name: {semantics: Text * TextRole.Name, type: string, optional: true}

  Task:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    instruction: {semantics: Text * TextRole.Instruction, type: string}
    intent: {semantics: Intent, type: word, vocabulary: TaskIntent}
    priority: {semantics: Priority, type: code, vocabulary: TaskPriority, default: ROUTINE, values: {ROUTINE: Urgency.ROUTINE, HIGH: Urgency.HIGH, IMMEDIATE: Urgency.IMMEDIATE}}
    status: {semantics: WorkStatus, type: code, vocabulary: TaskStatus, default: NEW, values: {NEW: WorkState.NEW, ACTIVE: WorkState.ACTIVE, COMPLETE: WorkState.COMPLETE, FAILED: WorkState.FAILED, CANCELLED: WorkState.CANCELLED, ACCEPTED: WorkState.ACCEPTED}}

  NumericRange:
    coords:
      min_value: {semantics: Scalar * Bound.Lower, type: float, optional: true}
      max_value: {semantics: Scalar * Bound.Upper, type: float, optional: true}
    ordered: [[min_value, max_value]]

  Predicate:
    subject_uid: {semantics: Reference * Participation.Subject, type: reference, optional: true}
    quantity: {semantics: SemanticRegion * Participation.Quantity, type: product, optional: true}
    value: {semantics: Scalar * Participation.Value, type: float, optional: true}
  BooleanLogic:
    operator: {semantics: LogicOperation, type: code, vocabulary: BooleanOperator, values: {NONE: LogicOperator.NONE, NOT: LogicOperator.NOT, AND: LogicOperator.AND, OR: LogicOperator.OR, XOR: LogicOperator.XOR, NAND: LogicOperator.NAND, NOR: LogicOperator.NOR, XNOR: LogicOperator.XNOR}}
    terms: {semantics: Condition, qualifiers: ConditionRole.Term, many: true}
  GeoPath:
    points: {semantics: Position * Representation.Geodetic, qualifiers: PathRole.Waypoint, many: true}
  Role:
    name: {semantics: Text * TextRole.Name, type: string, optional: true}
  Resource:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity, optional: true}
    name: {semantics: Text * TextRole.Name, type: string, optional: true}

  Constraint:
    condition: {semantics: Condition, qualifiers: ConditionRole.Requirement, optional: true}

  TaskTimeWindow:
    coords:
      earliest_start: {semantics: Time * TimeRole.EarliestStart, type: float, unit: s, optional: true}
      latest_finish: {semantics: Time * TimeRole.LatestFinish, type: float, unit: s, optional: true}
    ordered: [[earliest_start, latest_finish]]
  WeatherLimits:
    ifr: {semantics: Permission * PermissionKind.IFR, type: bool, optional: true}
    night: {semantics: Permission * PermissionKind.Night, type: bool, optional: true}
    rain: {semantics: NumericRange, qualifiers: WeatherQuantity.Rain, optional: true}
    snow: {semantics: NumericRange, qualifiers: WeatherQuantity.Snow, optional: true}
    temp: {semantics: NumericRange, qualifiers: WeatherQuantity.Temperature, optional: true}
    wind: {semantics: NumericRange, qualifiers: WeatherQuantity.Wind, optional: true}
    vis: {semantics: NumericRange, qualifiers: WeatherQuantity.Visibility, optional: true}
    icing: {semantics: Permission * PermissionKind.Icing, type: bool, optional: true}

  Objective:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    name: {semantics: Text * TextRole.Name, type: string}
    condition: {semantics: Condition, qualifiers: ConditionRole.Requirement, optional: true}
    criteria: {semantics: Condition, qualifiers: ConditionRole.Criterion, many: true}
    priority: {semantics: Priority, type: code, vocabulary: TaskPriority, default: ROUTINE, values: {ROUTINE: Urgency.ROUTINE, HIGH: Urgency.HIGH, IMMEDIATE: Urgency.IMMEDIATE}}
    status: {semantics: WorkStatus, type: code, vocabulary: TaskStatus, default: NEW, values: {NEW: WorkState.NEW, ACTIVE: WorkState.ACTIVE, COMPLETE: WorkState.COMPLETE, FAILED: WorkState.FAILED, CANCELLED: WorkState.CANCELLED, ACCEPTED: WorkState.ACCEPTED}}
    start_time: {semantics: Time * TimeRole.Start, type: float, unit: s, optional: true}
    deadline: {semantics: Time * TimeRole.Deadline, type: float, unit: s, optional: true}

  Command:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    operation: {semantics: Operation, type: word, vocabulary: CommandOperation}
  Authority:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    role: {semantics: Role, optional: true}
  Lease:
    bound: {semantics: Condition, qualifiers: ConditionRole.LeaseBound, optional: true}
    control_level: {semantics: ControlPermission, type: code, vocabulary: ControlLevel, optional: true, values: {NONE: ControlExtent.NONE, MONITOR: ControlExtent.MONITOR, GUIDE: ControlExtent.GUIDE, FULL: ControlExtent.FULL}}
  Plan:
    uid: {semantics: Identity * IdentifierKind.UID, type: identity}
    name: {semantics: Text * TextRole.Name, type: string, optional: true}
    approval_state: {semantics: Approval, type: code, vocabulary: PlanApprovalState, default: DRAFT, values: {DRAFT: ApprovalState.DRAFT, PROPOSED: ApprovalState.PROPOSED, APPROVED: ApprovalState.APPROVED, REJECTED: ApprovalState.REJECTED, SUPERSEDED: ApprovalState.SUPERSEDED}}
  PlanContingency:
    condition: {semantics: Condition, qualifiers: ConditionRole.Trigger}

# ---------------------------------------------------------------------------
# Relations connect independently existing things. Direction and arity are
# declared once at the base; a specialization narrows operand regions and may
# rename roles positionally. A fact of a specialization is a fact of the base,
# and a query at a base returns every specialization.
# ---------------------------------------------------------------------------

relations:
  # A chart's bindings witness the directed whole/part incidence. Typed chart
  # variables narrow the part region and retain their own named roles/order.
  HasComponent:
    operands: {whole: Root, part: Root}
  RefersTo:
    operands: {reference: Reference, referent: Root}

  Directed:
    description: A directed link; direction and arity declared once.
    operands:
      source: Root
      target: Root

  AssignedWork:
    description: An entity carries work.
    specializes: Directed
    operands:
      assignee: Entity
      work: Task

  ConstrainedBy:
    description: A constraint bounds directed work.
    specializes: Directed
    operands:
      subject: Control
      constraint: Constraint

  OwnedBy:
    description: An objective is owned by an entity.
    specializes: Directed
    operands:
      objective: Objective
      owner: Entity

  Holds:
    description: An entity holds an authority.
    specializes: Directed
    operands:
      authority: Authority
      holder: Entity

  GrantedBy:
    description: An authority was granted by an entity.
    specializes: Directed
    operands:
      authority: Authority
      grantor: Entity

  Controls:
    description: A lease controls an asset.
    specializes: Directed
    operands:
      lease: Lease
      asset: Object

  Contains:
    description: A plan contains an item of work, a participant, or a resource.
    specializes: Directed
    operands:
      plan: Plan
      item: Root

# ---------------------------------------------------------------------------
# Open expressions:
#
#     E := fixed semantic factors + typed free variables + equations
#
# `given` variables are inputs; `sought` variables are answers. An unbound
# variable is an unknown, not an error, so an expression can be recorded
# before every participant is known.
#
# A scheme is a parameterized expression family. An expression is a scheme
# instantiated at factor coordinates; it declares its own name and the words
# that name it, and the runtime vocabulary is the set of those words.
# MOVE and HOLD are one scheme at TemporalMode.ACHIEVE and TemporalMode.MAINTAIN
# -- a synonym or antonym in a vocabulary is a red flag for a scheme that has
# not been factored.
# ---------------------------------------------------------------------------

expressions:
  # --- schemes: structure only, declared once ---

  POSITION_GOAL:
    roles: {actor: Participation.Actor, destination: Participation.Destination}
    description: An actor's position is the destination.
    factors: [Task, Realm.WORLD]
    given:
      actor: Entity
      destination: Position
    equations:
      - Position(actor) = destination

  POSITION_QUERY:
    roles: {target: Participation.Target, position: Participation.PositionAnswer}
    description: An entity's position is the answer.
    factors: [Task, Realm.INFORMATION]
    given:
      target: Entity
    sought:
      position: Position
    equations:
      - Position(target) = position

  EXISTENCE_GOAL:
    roles: {object: Participation.Object}
    description: An object's existence is asserted.
    factors: [Task, Realm.WORLD, TemporalMode.ACHIEVE, Existence]
    given:
      object: Object

  OBJECT_STATE_GOAL:
    roles: {object: Participation.Object}
    description: An object's state is asserted.
    factors: [Task, Realm.WORLD]
    given:
      object: Object

  ENGAGEMENT_COMMAND:
    roles: {target: Participation.Target}
    description: The target's engagement state is asserted.
    factors: [Command]
    given:
      target: Object

  PROCESS_COMMAND:
    roles: {target: Participation.Target, process: Participation.Process}
    description: A running process is asserted paused or released.
    factors: [Command, Paused]
    given:
      target: Object
      process: Text

  # --- expressions: scheme instances; the expression declares its words ---

  MOVE:
    of: POSITION_GOAL
    binds: [TemporalMode.ACHIEVE]
    words: [TaskIntent.MOVE]

  HOLD:
    of: POSITION_GOAL
    binds: [TemporalMode.MAINTAIN]
    words: [TaskIntent.HOLD]

  LOCATE:
    of: POSITION_QUERY
    binds: [TemporalMode.ACHIEVE]
    words: [TaskIntent.LOCATE]

  TRACK:
    of: POSITION_QUERY
    binds: [TemporalMode.MAINTAIN]
    words: [TaskIntent.TRACK]

  CREATE:
    of: EXISTENCE_GOAL
    binds: [TruthTarget.TRUE]
    words: [TaskIntent.CREATE]

  REMOVE:
    of: EXISTENCE_GOAL
    binds: [TruthTarget.FALSE]
    words: [TaskIntent.REMOVE]

  MODIFY:
    of: OBJECT_STATE_GOAL
    binds: [TemporalMode.ACHIEVE]
    words: [TaskIntent.MODIFY]

  PROTECT:
    of: OBJECT_STATE_GOAL
    binds: [TemporalMode.MAINTAIN]
    words: [TaskIntent.PROTECT]

  ENGAGE:
    of: ENGAGEMENT_COMMAND
    binds: [TruthTarget.TRUE]
    words: [CommandOperation.ENGAGE]

  DISENGAGE:
    of: ENGAGEMENT_COMMAND
    binds: [TruthTarget.FALSE]
    words: [CommandOperation.DISENGAGE]

  PAUSE:
    of: PROCESS_COMMAND
    binds: [TruthTarget.TRUE]
    words: [CommandOperation.PAUSE]

  RESUME:
    of: PROCESS_COMMAND
    binds: [TruthTarget.FALSE]
    words: [CommandOperation.RESUME]

  # --- expressions declared in full ---

  IDENTIFY:
    roles: {target: Participation.Target, identity: Participation.IdentityAnswer}
    description: Solve for the identity of an entity.
    factors: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE]
    given:
      target: Entity
    sought:
      identity: Identity
    equations:
      - Identity(target) = identity
    words: [TaskIntent.IDENTIFY]

  CLASSIFY:
    roles: {target: Participation.Target, classification: Participation.ClassificationAnswer}
    description: Solve for the classification of an entity.
    factors: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE]
    given:
      target: Entity
    sought:
      classification: Classification
    equations:
      - Classification(target) = classification
    words: [TaskIntent.CLASSIFY]

  FOLLOW:
    roles: {actor: Participation.Actor, path: Participation.Path}
    description: Follow a path.
    factors: [Task, Realm.WORLD, TemporalMode.MAINTAIN]
    given:
      actor: Entity
      path: GeoPath
    words: [TaskIntent.FOLLOW]

  MEASURE:
    roles: {target: Participation.Target, measurement: Participation.MeasurementAnswer}
    description: Measure a state of a target.
    factors: [Task, Realm.INFORMATION, TemporalMode.ACHIEVE]
    given:
      target: Entity
    sought:
      measurement: State
    words: [TaskIntent.MEASURE]

  RESTORE:
    roles: {object: Participation.Object}
    description: Return an object to a prior state.
    factors: [Task, Realm.WORLD, TemporalMode.ACHIEVE]
    given:
      object: Object
    words: [TaskIntent.RESTORE]

  DENY:
    roles: {object: Participation.Object}
    description: Prevent connectivity to an object.
    factors: [Task, Realm.WORLD, TemporalMode.MAINTAIN, Connectivity, TruthTarget.FALSE]
    given:
      object: Object
    words: [TaskIntent.DENY]

  TRANSPORT:
    roles: {cargo: Participation.Cargo, origin: Participation.Origin, destination: Participation.Destination}
    description: Move a thing between places; which end and what moves are bindings.
    factors: [Task, Realm.WORLD, TemporalMode.ACHIEVE]
    given:
      cargo: Object
      origin: Position
      destination: Position
    words: [TaskIntent.TRANSPORT]

  SET:
    roles: {target: Participation.Target, property: Participation.Property, value: Participation.Value}
    description: Set a declared state property on the target.
    factors: [Command]
    given:
      target: Object
      property: Text
      value: Scalar
    words: [CommandOperation.SET]

  DIRECT:
    roles: {target: Participation.Target, destination: Participation.Destination, path: Participation.Path, radius: Participation.Radius, speed: Participation.Speed, yaw: Participation.Yaw}
    description: Direct the target to a destination or along a path.
    factors: [Command, TemporalMode.ACHIEVE]
    given:
      target: Object
      destination: Position
      path: GeoPath
      radius: Distance
      speed: Speed
      yaw: Angle
    equations:
      - Position(target) = destination
    words: [CommandOperation.MOVE]

  ALLOCATE:
    roles: {target: Participation.Target, resource: Participation.Resource, quantity: Participation.Quantity}
    description: Allocate a referenced resource.
    factors: [Command]
    given:
      target: Object
      resource: Resource
      quantity: Count
    words: [CommandOperation.ALLOCATE]

  TRANSFER:
    roles: {target: Participation.Target, resource: Participation.Resource, quantity: Participation.Quantity}
    description: Transfer a referenced resource.
    factors: [Command]
    given:
      target: Object
      resource: Resource
      quantity: Count
    words: [CommandOperation.TRANSFER]

  LOAD_CONFIGURATION:
    roles: {target: Participation.Target, parameter: Participation.Parameter, value: Participation.Value}
    description: Load a referenced configuration on the target.
    factors: [Command]
    given:
      target: Object
      parameter: Text
      value: Scalar
    words: [CommandOperation.LOAD_CONFIGURATION]

  RESET:
    roles: {target: Participation.Target}
    description: Reset the target to its initial state.
    factors: [Command]
    given:
      target: Object
    words: [CommandOperation.RESET]

