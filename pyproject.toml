[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "occid2"
version = "2.0.0.dev0"
description = "OCCID2 semantic algebra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["msgpack>=1.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["occid2"]

[tool.setuptools.package-data]
"occid2" = ["definitions.yaml"]
