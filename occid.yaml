    family: Directive
    description: Directed work that must be accomplished in support of an optional objective
    fields:
      record: Record
      uid: UID
      id: IntID(Task)
      instruction: string
      target_uids: list[UID]
      location_uids: list[UID]
      objective_uid: optional UID
      constraints: list[Constraint]
      preconditions: optional list[Predicate | BooleanLogic]
      start_time: optional float
      deadline: optional float
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW

  Predicate:
    model_id: 195
    package: condition
    family: Condition
