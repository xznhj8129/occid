models:
  Communication:
    model_id: 60
    package: communication
    semantic_role: concept
    parent: Root
    children:
    - Interface
    - Link
    - DataRateSpec
    - LinkCapacity
    - Message
    - Network
    - Node
    - Protocol
    description: Movement of information between endpoints

  Interface:
    model_id: 172
    package: interface
    semantic_role: concept
    parent: Communication
    children:
    - RemoteControl
    - ObserverSource
    description: System or protocol interface through which a component communicates with another endpoint

  Link:
    model_id: 189
    package: link
    semantic_role: concept
    parent: Communication
    children:
    - Radio
    description: Communication capability or connection kind a node can use; mutable condition is reported separately as LinkState
    fields:
      name: optional string
      endpoint_uid: optional UID
      interface_name: optional string
      address: optional NetworkAddress
      radio_uid: optional UID
      link_type: optional LinkType
      net_type: optional NetType
      data_type: optional LinkDataType
      direction: optional LinkDirection
      rate_spec: optional DataRateSpec
      user_capacity: optional LinkCapacity
      network_uid: optional UID

  DataRateSpec:
    model_id: 79
    package: link
    semantic_role: representation
    parent: Communication
    fields:
      nominal_bps: optional float
      sustained_bps: optional float
      burst_bps: optional float

  LinkCapacity:
    model_id: 190
    package: link
    semantic_role: representation
    parent: Communication
    fields:
      max_nodes: optional int
      max_users: optional int
      max_streams: optional int

  SignalQuality:
    model_id: 343
    package: link
    semantic_role: representation
    parent: Measurement
    description: Protocol-neutral observed receive-signal quality; values are present only when the source defines their physical or normalized meaning
    fields:
      strength_dbm: optional float
      snr_db: optional float
      quality_ratio: optional float

  DeliveryQuality:
    model_id: 83
    package: link
    semantic_role: representation
    parent: Measurement
    description: Protocol-neutral observed communication delivery quality over an observation interval
    fields:
      latency_s: optional float
      packet_loss_ratio: optional float
      error_ratio: optional float

  LinkCounters:
    model_id: 191
    package: link
    semantic_role: representation
    parent: Measurement
    description: Monotonic observed communication-link event counters
    fields:
      error_count: optional int
      receive_error_count: optional int
      corrected_receive_count: optional int

  MeshLink:
    model_id: 218
    package: mesh
    semantic_role: representation
    parent: LinkState
    description: Observed state of a link between two mesh nodes
    fields:
      link_uid: optional UID
      condition: optional LinkCondition
      connection_status: optional ConnectionStatus
      signal: optional SignalQuality
      delivery: optional DeliveryQuality
      counters: optional LinkCounters
      src_uid: UID
      dst_uid: UID
      updated_ts: optional Timestamp

  MeshNode:
    model_id: 219
    package: mesh
    semantic_role: representation
    parent: Node
    fields:
      uid: UID
      id: IntID(Node)
      entity_uid: optional UID
      roles: list[CapabilityRole]
      addresses: list[NetworkAddress]
      links: map[string, Link]
      radios: map[string, RadioProfile]
      protocols: map[string, Protocol]
      state: optional MeshNodeState
      last_seen_ts: optional Timestamp
      position: optional GlobalPosition
      link_state: optional LinkState

