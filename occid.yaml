types:
  Interface:
    model_id: 110
    package: interface
    family: Communication
    description: System or protocol interface through which a component communicates with another endpoint

  Link:
    model_id: 121
    package: link
    family: Communication
    description: Communication capability or connection kind a node can use; mutable condition is reported separately as LinkState
    fields:
      schema_ref: optional string
      name: optional string
      endpoint_ref: optional string
      interface_name: optional string
      address: optional NetworkAddress
      radio_ref: optional string
      link_type: optional LinkType
      net_type: optional NetType
      data_type: optional LinkDataType
      direction: optional LinkDirection
      rate_spec: optional DataRateSpec
      user_capacity: optional LinkCapacity
      network_ref: optional string

  LinkState:
    model_id: 124
    package: link
    family: State
    description: Time-varying condition and observed quality of a communication link
    fields:
      link_ref: optional string
      condition: optional LinkCondition
      connection_status: optional ConnectionStatus
      signal: optional SignalQuality
      delivery: optional DeliveryQuality
      counters: optional LinkCounters

  CommandMessage:
    model_id: 35
    package: c3
    family: Message
    description: Message whose payload directs action
    fields:
      src: MessageTarget
      dst: MessageTarget
      ts: Timestamp
      priority: MessagePriority
      seq: int
      command: StateChangeCommand | ProcessControlCommand | ConfigurationCommand | MotionCommand | ResourceCommand | ExecutionCommand

  ObservationMessage:
    model_id: 170
    package: isr
    family: Message
    description: Message whose payload reports external objects, events, environment, or intelligence
    fields:
      src: MessageTarget
      dst: MessageTarget
      ts: Timestamp
      priority: MessagePriority
      seq: int
      observation: Classification | Track | Assessment | IsrResult | Detection | VisionBox | VisionDetection | VisionDetectionFrame
        | IsrObservation | TrackUpdate

  ResponseMessage:
    model_id: 211
    package: message
    family: Message
    description: Message whose payload acknowledges, rejects, reports delivery, returns data, or reports errors
    fields:
      src: MessageTarget
      dst: MessageTarget
      ts: Timestamp
      priority: MessagePriority
      seq: int
      seq_reply: optional int
      response_to: optional string

  TelemetryMessage:
    model_id: 254
    package: telemetry
    family: Message
    description: Message whose payload reports sender or asset state
    fields:
      src: MessageTarget
      dst: MessageTarget
      ts: Timestamp
      priority: MessagePriority
      seq: int
      state: LinkState | MeshLink | Lifecycle | Activation | Cue | Execution | ExecutionAcceptance | ExecutionStatusReport |
        TaskDelta | GNC | NavigationValidity | GnssSolution | AutopilotMissionState | FlightControlState | Health | HealthAlert
        | SubsystemHealth | HealthSnapshot | MaintenanceStatus | NavReadinessState | Input | ControlAxisSet | ControlChannelValue
        | ControlOverride | ControlAttitudeSetpoint | Internal | FirmwareInfo | RuntimeLoadState | Kinematic | ImuSample | Resource
        | FuelState | SuppliesSchema | PowerSourceSchema | PowerStateSchema | ElectricalResourceState | SensorState | TrackerState
        | FlightSensorConfiguration | EntityState | Validation | Position | LocationState | SpotterOrigin

  Network:
    model_id: 164
    package: network
    family: Communication
    description: Connectivity topology and routing state

  Node:
    model_id: 166
    package: node
    family: Communication
    description: Deployed compute and communications endpoint participating in OCCID on behalf of an Entity
    fields:
      uid: UID
      id: IntID(Node)
      entity_uid: optional UID
      roles: list[CapabilityRole]
      addresses: list[NetworkAddress]
      links: map[string, Link]
      radios: map[string, RadioProfile]
      protocols: map[string, Protocol]

  Protocol:
    model_id: 197
    package: protocol
    family: Communication
    description: Wire format, message id space, payload format, command/result vocabulary, and mapping metadata

  Assignment:
    model_id: 13
    package: assignment
    family: Control
    description: Deliberate binding of an assignee to a subject under stated authority and constraints
    fields:
      record: Record
      uid: UID
      id: IntID(Assignment)
      assignee_uid: UID
      authority_uid: UID
      assigned_by_uid: UID
      status: AssignmentStatus = PROPOSED
      constraints: list[Constraint]

  CommandAuthority:
    model_id: 34
    package: authority
    family: Authority
    fields:
      record: Record
      uid: UID
      id: IntID(Authority)
      holder_uid: UID
      granted_by_uid: optional UID
      scope_uids: list[UID]
      constraints: list[Constraint]
      organization_uid: UID
      role: Role

  StateChangeCommand:
    model_id: 231
    package: command
    family: Command
    description: Change, enable, or disable one declared state property on the target
    fields:
      target_uid: UID
      constraints: list[Constraint]
      operation: StateChangeOperation
      property_name: optional string
      value: optional MetadataValue

  ProcessControlCommand:
    model_id: 196
    package: command
    family: Command
    description: Start, stop, pause, resume, or cancel a named process on the target
    fields:
      target_uid: UID
      constraints: list[Constraint]
      operation: ProcessControlOperation
      process_name: optional string

  ConfigurationCommand:
    model_id: 37
    package: command
    family: Command
    description: Set a configuration parameter or load a referenced configuration on the target
    fields:
      target_uid: UID
      constraints: list[Constraint]
      operation: ConfigurationOperation
      parameter_name: optional string
      value: optional MetadataValue
      configuration_ref: optional string

  MotionCommand:
    model_id: 160
    package: command
    family: Command
    description: Direct immediate target motion using a destination, path, or maintained spatial condition
    fields:
      target_uid: UID
      constraints: list[Constraint]
      operation: MotionOperation
      destination: optional GlobalPosition
      path: optional GeoPath
      radius_m: optional float
      speed_ms: optional float
      yaw_rad: optional float

  ResourceCommand:
    model_id: 210
    package: command
    family: Command
    description: Acquire, release, allocate, or transfer a referenced resource
    fields:
      target_uid: UID
      constraints: list[Constraint]
      operation: ResourceOperation
      resource_ref: optional string
      quantity: optional float

  ExecutionCommand:
    model_id: 70
    package: command
    family: Command
    description: Execute, abort, or reset a referenced plan, execution, or executable object
    fields:
      target_uid: UID
      constraints: list[Constraint]
      operation: ExecutionOperation

  Constraint:
    model_id: 38
    package: constraint
    family: Control
    description: Limit, rule, or time/resource bound applied to directed work
    fields:
      condition: optional Predicate | BooleanLogic

  Objective:
    model_id: 169
    package: objective
    family: Control
    description: Desired end state with intent, success rule, target, priority, and deadline
    fields:
      record: Record
      uid: UID
      id: IntID(Objective)
      name: string
      intent: string
      desired_state: string
      success_criteria: list[SuccessCriterion]
      target_uids: list[UID]
      constraints: list[Constraint]
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW
      owner_uid: optional UID
      start_time: optional float
      deadline: optional float

  Plan:
    model_id: 185
    package: plan
    family: Control
    description: Proposed or approved method for accomplishing one or more tasks using actors, resources, sequencing, routes,
      constraints, and contingencies
    fields:
      record: Record
      uid: UID
      id: IntID(Plan)
      name: optional string
      objective_uids: list[UID]
      task_uids: list[UID]
      actor_uids: list[UID]
      resource_uids: list[UID]
      assignment_uids: list[UID]
      steps: list[PlanStep]
      routes: list[GeoPath]
      constraints: list[Constraint]
      contingencies: list[PlanContingency]
      approval_state: PlanApprovalState = DRAFT

  Task:
    model_id: 246
