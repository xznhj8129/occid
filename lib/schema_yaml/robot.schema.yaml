version: 1
enums:
  SerialTelemetryType:
    - MSP = 0
    - MAVLINK

  RCType:
    - PWM = 0
    - CRSF
    - MAVLINK
    - MSP

  UAVRadioType:
    - ELRS = 0
    - MLRS
    - SIK
    - WIFI_DUALBAND
    - MESHTASTIC
    - WIFI_915

  AutopilotType:
    - BETAFLIGHT = 0
    - INAV
    - ARDUPILOT
    - PX4
    - CUSTOM

  RobotControlMode:
    - MANUAL = 0
    - REMOTE
    - ASSISTED
    - PROGRAMMED
    - AUTONOMOUS
    - ROGUE

  ControlLevel:
    - NONE = 0
    - MONITOR
    - GUIDE
    - FULL

models:
  RobotControlSchema:
    fields:
      control_modes: optional RobotControlMode
      autopilot: optional bool
      autopilot_controller_model: string = ""
      autopilot_type: optional AutopilotType
      autopilot_fw: optional FirmwareInfo


  RemoteControlSchema:
    fields:
      links: map[string, LinkSchema] = {}
      rc_link: string = ""
      vid_link: string = ""
      ctrl_video_sep: optional bool
      telemetry: optional TelemetryState


  ControlLease:
    fields:
      asset_id: string
      holder_id: string
      control_level: ControlLevel
      lease_start: float
      lease_end: float
      lease_rev: int = 0
