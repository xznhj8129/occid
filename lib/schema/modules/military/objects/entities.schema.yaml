version: 1
type: module
package: military_entities
description: "Military entity extensions for combat loadouts, NATO categories, payloads, and effects."
tags:
  - military
requires:
  - core
  - military_effects
  - military_organization
  - military_aerial
extend_variants:
  Person:
    - MilitaryPerson
  Machine:
    - MilitaryMachine
  GroundMachine:
    - MilitaryGroundMachine
  AirMachine:
    - MilitaryAirMachine

models:
  MilitaryPerson:
    semantic_role: representation
    parent: Person
    fields:
      attack_modes: list[AttackMode]
      weapons: list[ItemCount]
      ammo: list[ItemCount]


  MilitaryMachine:
    semantic_role: representation
    parent: Machine
    fields:
      category: optional NATOUnitCategory


  MilitaryGroundMachine:
    semantic_role: representation
    parent: GroundMachine
    fields:
      payload: Payload
      effects: GroundEffects


  MilitaryAirMachine:
    semantic_role: representation
    parent: AirMachine
    fields:
      payload: Payload
      effects: AirEffects
