version: 1
type: module
package: military_tasks
description: "Military tasking vocabulary and profiles attached to generic OCCID Tasks."
tags:
  - military
requires:
  - core
  - military_effects

enums:
  TaskCombat:
    - DEFEND = 0
    - ATTACK
    - PROTECT
    - COMBAT_SUPPORT
    - COMBAT_RESERVE

models:
  MunitionAllocation:
    semantic_role: specialization
    parent: Struct
    fields:
      munition_type: string
      qty: int = 0

  CombatTaskProfile:
    description: Military domain detail associated with a generic Task without creating a Task subtype
    semantic_role: specialization
    parent: Struct
    fields:
      task_uid: UID
      combat_task: optional TaskCombat
      target_category: optional TargetCategory
      target_point: optional GlobalPosition
      munitions: list[MunitionAllocation]
      effect: optional string
      desired_bda: bool = false
