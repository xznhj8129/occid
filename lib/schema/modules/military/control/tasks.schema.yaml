version: 1
type: module
package: military_tasks
description: "Military tasking extensions for combat, fires, and munition allocation."
tags:
  - military
requires:
  - core
  - military_effects
extend_variants:
  Task:
    - CombatTask

enums:
  TaskCombat:
    - DEFEND = 0
    - ATTACK
    - PROTECT
    - COMBAT_SUPPORT
    - COMBAT_RESERVE

models:
  MunitionAllocation:
    fields:
      munition_type: string
      qty: int = 0


  CombatTask:
    parent: Task
    fields:
      combat_task: optional TaskCombat
      target_category: optional TargetCategory
      target_point: optional GlobalPosition
      munitions: list[MunitionAllocation]
      effect: optional string
      desired_bda: bool = false
