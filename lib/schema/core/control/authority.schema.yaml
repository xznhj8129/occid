version: 1
type: schema
package: authority
root: Authority
tags:
  - core

enums:
  ControlLevel:
    - NONE = 0
    - MONITOR
    - GUIDE
    - FULL

models:
  Authority:
    description: Command, permission, delegation, authorization, or control-right context under which directed work may be assigned or exercised
    semantic_role: concept
    parent: Control
    fields:
      record: Record
      uid: UID
      id: IntID(Authority)
      holder_uid: UID
      granted_by_uid: optional UID
      scope_uids: list[UID]
      constraints: list[Constraint]

  Lease:
    description: Bounded control right issued under an Authority record
    semantic_role: representation
    parent: Authority
    fields:
      asset_uid: UID
      bound: Condition
    variants:
      - AttachmentLease
      - Controllease

  AttachmentLease:
    description: Authority lease to an organization
    semantic_role: representation
    parent: Lease
    fields:
      attachment_uid: UID

  ControlLease:
    description: Temporary direct control access
    semantic_role: representation
    parent: Lease
    fields:
      controller: UID
      control_level: ControlLevel
