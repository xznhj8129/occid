version: 1
type: schema
package: authority
root: Authority
tags:
  - core

enums:
  ControlLevel:
    - NONE = 0
    - MONITOR
    - GUIDE
    - FULL

models:
  Authority:
    description: Command, permission, delegation, authorization, or control-right context under which directed work may be assigned or exercised
    semantic_role: ontology
    parent: Control
    fields:
      record: RecordMeta
      uid: UID
      id: int
      holder_uid: UID
      granted_by_uid: optional UID
      scope_uids: list[UID]
      constraints: list[Constraint]

  ControlLease:
    description: Time-bounded control right issued under an Authority record
    semantic_role: specialization
    parent: Authority
    fields:
      asset_uid: UID
      control_level: ControlLevel
      lease_start: float
      lease_end: float
      lease_rev: int = 0
