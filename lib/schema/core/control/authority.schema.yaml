version: 1
type: schema
package: authority
root: Authority
tags:
  - core

enums:
  ControlLevel:
    - NONE = 0
    - MONITOR
    - GIDE
    - FULL

models:
  Authority:
    description: Command, permission, delegation, authorization, or control-right context under which directed work may be assigned or exercised
    semantic_role: concept
    parent: Control
    fields:
      uid: ID
      holder_uid: ID
      granted_by_uid: optional ID
      scope_uids: list[ID]
      constraints: list[Constraint]

  # Command authority belongs to a ROLE WITHIN AN ORGANIZATION.
  # It does not belong permanently to Alice, Bob, Hermes-7, etc.
  #
  # The roster tells us which actor currently occupies that role.
  #
  # Therefore command authority survives replacement of the actor.
  #
  # Role alone does not imply authority:
  #
  #   Commander Role
  #
  # means "organizational function named Commander".
  #
  #   CommandAuthority(Organization X, Commander)
  #
  # means "the Commander role of Organization X actually possesses
  # command authority over Organization X."
  CommandAuthority:
    semantic_role: concept
    parent: Authority
    fields:
      organization_uid: ID
      role: Role

  Lease:
    description: Bounded control right issued under an Authority record
    semantic_role: representation
    parent: Authority
    fields:
      asset_uid: ID
      bound: Condition

  AttachmentLease:
    description: Authority lease to an organization
    semantic_role: representation
    parent: Lease
    fields:
      parent_uid: ID
      attachment_uid: ID

  ControlLease:
    description: Temporary direct control access
    semantic_role: representation
    parent: Lease
    fields:
      controller: ID
      control_level: ControlLevel
