version: 1
type: schema
package: command
root: Command
tags:
  - core

enums:
  CommandResult:
    - ACCEPTED = 0
    - TEMPORARILY_REJECTED
    - DENIED
    - UNSUPPORTED
    - FAILED
    - IN_PROGRESS
    - CANCELLED

models:

  Command:
    description: An immediate imperative requiring execution without interpretation
    parent: Control

  FlightCommand:
    description: Immediate flight-domain command; distinct from Task and Plan lifecycle semantics
    parent: Command

  LowLevelFlightCommand:
    description: Direct flight-control imperative mapped by an endpoint adapter to MAVLink, MSP, or another native flight-controller protocol
    parent: FlightCommand

  ArmCommand:
    parent: LowLevelFlightCommand

  DisarmCommand:
    parent: LowLevelFlightCommand

  TakeoffCommand:
    parent: LowLevelFlightCommand

  LandCommand:
    parent: LowLevelFlightCommand

  ReturnToLaunchCommand:
    parent: LowLevelFlightCommand

  SetModeCommand:
    description: Select a portable standard mode or an endpoint-native mode; at least one selector must be provided and adapters must reject unsupported or ambiguous selections
    parent: LowLevelFlightCommand
    fields:
      standard_mode: optional StandardFlightMode
      native_mode_name: optional string
      native_mode_code: optional int

  GoToCommand:
    parent: LowLevelFlightCommand
    fields:
      position: GlobalPosition
      yaw_rad: optional float

  SetTakeoffAltitudeCommand:
    parent: LowLevelFlightCommand
    fields:
      relative_altitude_m: float

  SelectMissionCommand:
    parent: LowLevelFlightCommand
    fields:
      sequence: int

  StartOffboardCommand:
    parent: LowLevelFlightCommand

  StopOffboardCommand:
    parent: LowLevelFlightCommand

  SetControlAttitudeCommand:
    description: Apply an attitude and thrust setpoint; endpoint adapters map the semantic setpoint to the native flight-controller mechanism
    parent: LowLevelFlightCommand
    fields:
      setpoint: ControlAttitudeSetpoint

  SetControlOverrideCommand:
    description: Apply normalized direct control-axis overrides through the endpoint adapter
    parent: LowLevelFlightCommand
    fields:
      override: ControlOverride

  TaskCommand:
    parent: Command
    fields:
      task: Task

  ApplyPlanCommand:
    description: Direct an executor to apply an approved plan
    parent: Command
    fields:
      plan: Plan

  TrackerCommand:
    parent: Command
    fields:
      lock: optional bool
      reset: optional bool
      slew: optional LocalDirection
      search_box_size: optional int
      shutdown: optional bool
