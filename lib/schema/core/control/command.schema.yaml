version: 1
type: schema
package: command
root: Command
tags:
  - core

enums:
  CommandResult:
    - ACCEPTED = 0
    - TEMPORARILY_REJECTED
    - DENIED
    - UNSUPPORTED
    - FAILED
    - IN_PROGRESS
    - CANCELLED

  FlightCommandType:
    - ARM = 0
    - DISARM
    - TAKEOFF
    - LAND
    - RETURN_TO_LAUNCH
    - SET_MODE
    - GOTO
    - SET_TAKEOFF_ALTITUDE
    - SELECT_MISSION
    - START_OFFBOARD
    - STOP_OFFBOARD

models:

  Command:
    description: An immediate imperative requiring execution without interpretation
    parent: Control

  FlightCommand:
    parent: Command
    fields:
      command_type: FlightCommandType

  TaskCommand:
    parent: Command
    fields:
      task: Task

  TrackerCommand:
    parent: Command
    fields:
      lock: optional bool
      reset: optional bool
      slew: optional LocalDirection
      search_box_size: optional int
      shutdown: optional bool
