version: 1
type: schema
package: command
root: Command
tags:
  - core

enums:
  CommandResult:
    - ACCEPTED = 0
    - TEMPORARILY_REJECTED
    - DENIED
    - UNSUPPORTED
    - FAILED
    - IN_PROGRESS
    - CANCELLED

models:

  Command:
    description: An immediate imperative requiring execution without interpretation
    parent: Control

  FlightCommand:
    parent: Command

  ArmCommand:
    parent: FlightCommand

  DisarmCommand:
    parent: FlightCommand

  TakeoffCommand:
    parent: FlightCommand

  LandCommand:
    parent: FlightCommand

  ReturnToLaunchCommand:
    parent: FlightCommand

  SetModeCommand:
    parent: FlightCommand
    fields:
      mode: FlightMode

  GoToCommand:
    parent: FlightCommand
    fields:
      position: GlobalPosition
      yaw_deg: float

  SetTakeoffAltitudeCommand:
    parent: FlightCommand
    fields:
      altitude_m: float

  SelectMissionCommand:
    parent: FlightCommand
    fields:
      sequence: int

  StartOffboardCommand:
    parent: FlightCommand

  StopOffboardCommand:
    parent: FlightCommand

  TaskCommand:
    parent: Command
    fields:
      task: Task

  TrackerCommand:
    parent: Command
    fields:
      lock: optional bool
      reset: optional bool
      slew: optional LocalDirection
      search_box_size: optional int
      shutdown: optional bool
