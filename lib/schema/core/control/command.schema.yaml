version: 1
type: schema
package: command
root: Command
tags:
  - core

enums:
  CommandResult:
    - ACCEPTED = 0
    - TEMPORARILY_REJECTED
    - DENIED
    - UNSUPPORTED
    - FAILED
    - IN_PROGRESS
    - CANCELLED

  DirectControlMode:
    - MANUAL_AXIS = 0
    - ATTITUDE_THRUST

models:

  Command:
    description: An immediate imperative requiring execution without interpretation
    parent: Control

  FlightCommand:
    description: Immediate aircraft operation such as arming, takeoff, landing, or recovery; distinct from navigation, mode selection, direct control, and Task/Plan lifecycle semantics
    parent: Command

  ArmCommand:
    parent: FlightCommand

  DisarmCommand:
    parent: FlightCommand

  TakeoffCommand:
    parent: FlightCommand

  LandCommand:
    parent: FlightCommand

  ReturnToLaunchCommand:
    parent: FlightCommand

  SetTakeoffAltitudeCommand:
    parent: FlightCommand
    fields:
      relative_altitude_m: float

  NavigationCommand:
    description: Immediate navigation operation that changes a destination, waypoint, or selected onboard mission without implying a higher-level Task or Plan lifecycle
    parent: Command

  GoToCommand:
    parent: NavigationCommand
    fields:
      position: GlobalPosition
      yaw_rad: optional float

  SetWaypointCommand:
    description: Write one endpoint mission waypoint while preserving its explicit OCCID waypoint representation
    parent: NavigationCommand
    fields:
      waypoint: AutopilotMissionWaypoint

  SelectMissionCommand:
    description: Select an already-present onboard mission sequence; mission upload/generation remains runtime policy outside the OCCID SDK
    parent: NavigationCommand
    fields:
      sequence: int

  ModeCommand:
    description: Immediate activation or deactivation of a flight-controller mode; imperative actions such as takeoff, land, and return use their own command families
    parent: Command

  SetModeCommand:
    description: Select a portable standard mode or an endpoint-native mode; exactly one semantic/native selector must be usable by the endpoint and enabled controls activation versus deactivation
    parent: ModeCommand
    fields:
      standard_mode: optional StandardFlightMode
      native_mode_name: optional string
      native_mode_code: optional int
      enabled: bool = true

  DirectControlCommand:
    description: Lifecycle command for a direct-control session; high-rate control samples themselves are Input models and are not Commands
    parent: Command

  BeginDirectControlCommand:
    description: Begin delivery of a declared direct-control input form; endpoint runtimes own native offboard/manual-control/override lifecycle
    parent: DirectControlCommand
    fields:
      mode: DirectControlMode

  EndDirectControlCommand:
    description: End the active direct-control session and relinquish its endpoint-specific control mechanism
    parent: DirectControlCommand

  TaskCommand:
    parent: Command
    fields:
      task: Task

  ApplyPlanCommand:
    description: Direct an executor to apply an approved plan
    parent: Command
    fields:
      plan: Plan

  TrackerCommand:
    parent: Command
    fields:
      lock: optional bool
      reset: optional bool
      slew: optional LocalDirection
      search_box_size: optional int
      shutdown: optional bool
