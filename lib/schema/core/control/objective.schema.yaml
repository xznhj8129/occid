version: 1
type: schema
package: objective
root: Objective
tags:
  - core

models:
  SuccessCriterion:
    description: Typed, human-readable condition used to determine whether an objective succeeded
    semantic_role: representation
    parent: Struct
    fields:
      statement: string
      metric: optional string
      target_value: optional MetadataValue

  Objective:
    description: Desired end state with intent, success rule, target, priority, and deadline
    semantic_role: concept
    parent: Control
    fields:
      uid: ID
      name: string
      intent: string
      desired_state: string
      success_criteria: list[SuccessCriterion]
      target_uids: list[ID]
      constraints: list[Constraint]
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW
      owner_uid: optional ID
      start_time: optional float
      deadline: optional float
