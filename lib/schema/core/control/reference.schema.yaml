version: 1
type: schema
package: reference
root: Reference
tags:
  - core

models:
  Reference:
    description: Control-side referent such as mark, path, region, boundary, target, waypoint, route, or area
    parent: Control
    variants:
      - Mark
      - ReferencePath
      - Region
      - Boundary

  Mark:
    parent: Reference

  ReferencePath:
    parent: Reference

  Region:
    parent: Reference

  Boundary:
    parent: Reference

  FlightLevelBand:
    parent: Region
    fields:
      altitude_range_m: NumericRange
      alt_sep_m: float

  MissionPoi:
    parent: Mark
    variants: null
    fields:
      uid: StringID
      name: string
      pos: GlobalPosition
      origin: string
      cot: optional string
      added_ts: optional float
      stale_after_s: optional float
      url: optional string

  AutopilotMissionWaypoint:
    parent: Mark
    fields:
      waypoint_index: int
      action_code: optional int
      position: GlobalPosition
      param1: optional int
      param2: optional int
      param3: optional int
      flag: optional int

  PlannerMissionPoint:
    parent: Mark
    fields:
      num: int
      point_type: PlannerPointType
      category: PlannerPointCategory
      pos: GlobalPosition


  LoiterOrbit:
    parent: ReferencePath
    fields:
      orbit_direction: int
      orbit_radius: int
      loiter_time: int

  MissionRouteGeometry:
    parent: ReferencePath
    fields:
      route_in: GeoPath
      survey: GeoPath
      survey_area: GeoArea
      route_out: GeoPath

  PlannedRoutePoints:
    parent: ReferencePath
    fields:
      start: PlannerMissionPoint
      route_in: list[PlannerMissionPoint]
      survey: list[PlannerMissionPoint]
      survey_area: list[PlannerMissionPoint]
      route_out: list[PlannerMissionPoint]
      end: PlannerMissionPoint
