version: 1
type: schema
name: execution
description: "Plans, sequences, and actions used to execute directed activity."
tags:
  - core
root: control

models:
  Execution:
    parent: Control
    variants:
      - Plan
      - Sequence
      - Action

  Plan:
    parent: Execution

  Sequence:
    parent: Execution

  Action:
    parent: Execution

  FlightPhasePlan:
    parent: Sequence
    fields:
      phase: AirMissionPhase
      flight_level: optional FlightLevelBand
      alt_frame: optional AltitudeDatum
      h_sep_m: optional float
      delay_s: optional float
      airspeed: optional float
      path_offset: optional LocalDirection
      formation_2d: optional AirGroupFormation2DType
      formation_3d: optional AirGroupFormation3DType

  PlannedUnitMission:
    parent: Plan
    variants:
    fields:
      unit_num: int
      callsign: string
      fl: float
      route_in: GeoPath
      objective: PlannerMissionPoint
      route_out: GeoPath
      home: GlobalPosition
      land_pos: GlobalPosition
      ip_wait_delay: float = 0.0
      wp: GeoPath
