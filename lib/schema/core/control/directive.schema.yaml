version: 1
type: schema
name: directive
description: "What must be achieved, why, and within what bounds"
tags:
  - core
root: control
branches:
  - task

models:
  Directive:
    parent: Control
    variants:
      - Mission
      - Task
      - Command

  Mission:
    parent: Directive

  Command:
    parent: Directive

  MissionProgress:
    parent: Mission
    fields:
      waypoint_count: optional int
      current_waypoint_index: optional int
      mission_valid: optional bool
