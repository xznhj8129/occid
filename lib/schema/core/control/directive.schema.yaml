version: 1
type: schema
package: directive
root: Directive
tags:
  - core

models:
  Directive:
    description: Ordered or requested work, including missions, tasks, and immediate commands
    parent: Control
    variants:
      - Mission
      - Task
      - Command

  Mission:
    parent: Directive

  Command:
    parent: Directive

  MissionProgress:
    parent: Mission
    fields:
      waypoint_count: optional int
      current_waypoint_index: optional int
      mission_valid: optional bool

  Task:
    description: A directive to carry out part of a mission
    parent: Directive
    variants:
      - MoveTask
      - ResupplyTask
    fields:
      task_id: string
      task_type: TaskType
      unit_code: string
      capability: optional Capability
      status: TaskStatus = NEW
      command_result: optional CommandResult
      assign_fail: optional TaskAssignFail
      phase: TaskPhase = CREATED
      geometry_id: optional string
      start_time: optional float
      deadline: optional float
      priority: TaskPriority = ROUTINE
      remarks: optional string
      last_update: optional float
      issued_by: optional string
      accepted_by: optional string
      assigned_assets: list[string]
      attempt_idx: int = 0
      dispatch_state: DeliveryState = QUEUED
      dispatch_error: optional string
      time_window: optional TaskTimeWindow
      retry_profile: optional RetryProfile
      status_log: list[TaskStatusEntry]
      qos: QosTier = ROUTINE
      ack_mode: AckMode = RECEIPT
      route_mode: RouteMode = DIRECT
      conflict_policy: ConflictPolicy = VECTOR_CLOCK
      objective: optional ObjectiveSchema

  VehicleCommand:
    parent: Command
    fields:
      command_id: string
      command_type: FlightCommandType
      asset_id: string
      mode: optional string
      enabled: optional bool
      altitude_m: optional float
      yaw_deg: optional float
      destination: optional GlobalPosition
      waypoint: optional AutopilotMissionWaypoint
      sequence: optional int
      control_override: optional ControlOverride
      attitude_setpoint: optional ControlAttitudeSetpoint

  TrackerCommand:
    parent: Command
    fields:
      lock: optional bool
      reset: optional bool
      slew: optional LocalDirection
      search_box_size: optional int
      shutdown: optional bool

  MoveTask:
    parent: Task
    fields:
      task_type: const TaskType = MOVE
      movement_domain: OperationalDomain
      destination: GlobalPosition
      route: optional GeoPath
      speed_ms: optional float

  ResupplyTask:
    parent: Task
    fields:
      task_type: const TaskType = RESUPPLY
      destination: GlobalPosition
      supplies: list[ItemCount]

  AirMissionSchema:
    parent: Mission
    fields:
      mission_name: string
      mission_uid: string
      mission_time: float
      mission_type: TaskType
      takeoff: FlightPhasePlan
      assembly_point: FlightPhasePlan
      route: FlightPhasePlan
      ingress: FlightPhasePlan
      survey_area: FlightPhasePlan
      egress: FlightPhasePlan
      landing: FlightPhasePlan
      pois: list[MissionPoi]
      assignments: map[string, FlightAssignment]
      unit_plans: map[string, PlannedUnitMission]
      routes: MissionRouteGeometry
      route_points: PlannedRoutePoints
