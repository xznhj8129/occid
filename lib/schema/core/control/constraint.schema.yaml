version: 1
type: schema
package: constraint
root: Constraint
tags:
  - core

models:
  Constraint:
    description: Limit, rule, condition, or time/resource bound applied to directed work
    parent: Control
    variants:
      - Restriction
      - Limitation
      - ConstraintCondition

  Restriction:
    parent: Constraint

  Limitation:
    parent: Constraint

  ConstraintCondition:
    parent: Constraint

  TaskTimeWindow:
    parent: Constraint
    fields:
      earliest_start: optional float
      latest_finish: optional float
