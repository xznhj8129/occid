version: 1
type: schema
package: constraint
root: Constraint
tags:
  - core

models:
  Constraint:
    description: Limit, rule, or time/resource bound applied to directed work
    semantic_role: ontology
    parent: Control
    variants:
      - Restriction
      - Limitation
    fields:
      condition: optional Condition

  Restriction:
    semantic_role: specialization
    parent: Constraint

  Limitation:
    semantic_role: specialization
    parent: Constraint

  TaskTimeWindow:
    semantic_role: specialization
    parent: Constraint
    fields:
      earliest_start: optional float
      latest_finish: optional float

  WeatherLimits:
    semantic_role: specialization
    parent: Constraint
    fields:
      ifr: optional bool
      night: optional bool
      rain: optional NumericRange
      snow: optional NumericRange
      temp: optional NumericRange
      wind: optional NumericRange
      vis: optional NumericRange
      icing: optional bool
