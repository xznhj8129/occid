version: 1
type: schema
package: aerial
root: Control
tags:
- core

enums:
  FlightPlanPhase:
  - ONLINE = 0
  - PREPARING
  - TAKEOFF
  - ASSEMBLY
  - HOLDING
  - ENROUTE
  - INITIAL
  - OBJECTIVE
  - EGRESS
  - RETURN
  - APPROACH
  - LANDING
  - SHUTDOWN

  AirPlanAction:
  - FLY = 0
  - AIR_DROP
  - RECOVERY

  OrbitPattern:
  - CIRCLE = 0
  - RACETRACK
  - FIGURE_EIGHT

  FlightPlanPointType:
  - HOME = 0
  - TAKEOFF
  - LANDING
  - HOLD
  - WAYPOINT
  - ASSEMBLY
  - POI
  - ROI
  - SURVEY
  - INGRESS
  - EGRESS

  AirFormationXY:
  - NONE = 0
  - LINE
  - ECHELON
  - TRAIL
  - SQUARE
  - DIAMOND
  - VEE
  - MISSING_MAN
  - HEAVY_LEFT
  - HEAVY_RIGHT
  - ECHELON_LEFT
  - ECHELON_RIGHT
  - STAGG_TRAIL_LEFT
  - STAGG_TRAIL_RIGHT

  MilitaryAirTask:
  - ISR = 0
  - CLOSE_AIR_SUPPORT
  - ELECTRONIC_WARFARE
  - STRIKE
  - SEAD

  AirRole:
  - GROUND = 0
  - AIR_DEFENSE
  - FIGHTER
  - GROUND_ATTACK
  - ISR
  - MINE
  - CARGO

  AirISRType:
  - OVERFLY = 0
  - FLYBY
  - ORBIT

models:

  LoiterOrbit:
    description: Embedded orbit geometry and timing value
    semantic_role: representation
    parent: SpatialStruct
    fields:
      orbit_direction_ccw: bool
      orbit_radius_m: int
      loiter_time_s: int
      pattern: OrbitPattern
      
  AirPlan:
    description: Plan applicable to aerial operations and flight
    semantic_role: concept
    parent: Plan

  GroupFlightPlan:
    semantic_role: representation
    parent: AirPlan
    fields:
      plan_phase: FlightPlanPhase
      flight_level: NumericRange
      alt_sep_m: float
      alt_frame: optional AltitudeDatum
      h_sep_m: optional float
      delay_s: optional float
      airspeed: optional float
      path_offset: optional LocalDirection
      formation: optional AirFormationXY

  UnitFlightPlan:
    semantic_role: representation
    parent: AirPlan
    fields:
      unit_num: int
      callsign: string
      fl: float
      route_in: GeoPath
      target: FlightMissionPoint
      route_out: GeoPath
      home: GlobalPosition
      land_pos: GlobalPosition
      ip_wait_delay: float = 0.0
      wp: GeoPath

  PlannedAirMission:
    semantic_role: representation
    parent: AirPlan
    description: Saved operator mission plan - the planner inputs, restorable for editing
    fields:
      air_action: AirPlanAction = FLY
      manual: bool = false
      points: PlannedRoutePoints
      config: map[string, float] #??????????
      saved_ts: optional Timestamp

  MissionRouteGeometry: # too general name
    description: Embedded route geometry used by a mission plan
    semantic_role: representation
    parent: SpatialStruct
    fields:
      route_in: GeoPath
      survey: GeoPath
      survey_area: GeoArea
      route_out: GeoPath

  FlightMissionPoint:
    semantic_role: representation
    parent: AutopilotMissionWaypoint
    fields:
      point_type: FlightPlanPointType

  PlannedRoutePoints:
    description: Embedded set of planner points defining mission-plan route segments
    semantic_role: representation
    parent: SpatialStruct
    fields:
      start: FlightMissionPoint
      route_in: list[FlightMissionPoint]
      route_out: list[FlightMissionPoint]
      end: FlightMissionPoint

  MilitaryUnitFlightPlan:
    semantic_role: representation
    parent: UnitFlightPlan
    fields:
      target: FlightMissionPoint
      
maps:
  AIR_ROLE_LABELS:
    type: map[AirRole, string]
    value:
      GROUND: Ground
      AIR_DEFENSE: Air Defense
      FIGHTER: Fighter
      GROUND_ATTACK: Ground Attack
      ISR: ISR
      MINE: Mine
      CARGO: Cargo

  AIR_ROLE_NAMES:
    type: map[AirRole, string]
    value:
      GROUND: Ground
      AIR_DEFENSE: Air Defense
      FIGHTER: Fighter
      GROUND_ATTACK: Ground Attack
      ISR: ISR
      MINE: Mine
      CARGO: Cargo
