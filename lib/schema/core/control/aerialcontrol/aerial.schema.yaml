version: 1
type: schema
package: aerial
root: Control
tags:
  - core

enums:
  FlightPlanPhase:
    - ONLINE = 0
    - PREPARING
    - TAKEOFF
    - ASSEMBLY
    - HOLDING
    - ENROUTE
    - INITIAL
    - OBJECTIVE
    - EGRESS
    - RETURN
    - APPROACH
    - LANDING
    - SHUTDOWN

  AirPlanAction:
    - FLY = 0
    - AIR_DROP
    - RECOVERY

  FlightType:
    - SURVEY_POINT = 0
    - SURVEY_AREA
    - ONE_WAY

  OrbitPattern:
    - CIRCLE = 0
    - RACETRACK
    - FIGURE_EIGHT

  FlightPlanPointType:
    - HOME = 0
    - TAKEOFF
    - LANDING
    - HOLD
    - WAYPOINT
    - ASSEMBLY
    - POI
    - ROI
    - SURVEY

  PlannerPointCategory:
    - ROUTE_IN = 0
    - SURVEY
    - SURVEY_AREA
    - ROUTE_OUT

  AirGroupFormation3DType:
    - NONE = 0
    - BOX
    - SEP_2D_PER_FL
    - SEP_2D_SPACED

  AirGroupFormation2DType:
    - NONE = 0
    - LINE
    - ECHELON
    - TRAIL
    - SQUARE
    - DIAMOND
    - VEE
    - HEAVY_LEFT
    - HEAVY_RIGHT
    - ECHELON_LEFT
    - ECHELON_RIGHT
    - STAGG_TRAIL_LEFT
    - STAGG_TRAIL_RIGHT

models:

  AirPlan:
    description: Plan applicable to aerial operations and flight
    semantic_role: concept
    parent: Plan

  GroupFlightPlan:
    semantic_role: representation
    parent: AirPlan
    fields:
      plan_phase: FlightPlanPhase
      flight_level: optional FlightLevelBand
      alt_frame: optional AltitudeDatum
      h_sep_m: optional float
      delay_s: optional float
      airspeed: optional float
      path_offset: optional LocalDirection
      formation_2d: optional AirGroupFormation2DType
      formation_3d: optional AirGroupFormation3DType

  UnitFlightPlan:
    semantic_role: representation
    parent: AirPlan

    fields:
      unit_num: int
      callsign: string
      fl: float
      route_in: GeoPath
      target: FlightMissionPoint
      route_out: GeoPath
      home: GlobalPosition
      land_pos: GlobalPosition
      ip_wait_delay: float = 0.0
      wp: GeoPath

  PlannedAirMission:
    semantic_role: representation
    parent: AirPlan
    description: Saved operator mission plan - the planner inputs, restorable for editing
    fields:
      flight_type: FlightType = SURVEY_POINT #??????????
      air_action: AirPlanAction = FLY
      manual: bool = false
      points: PlannedRoutePoints
      config: map[string, float] #??????????
      saved_ts: optional Timestamp

  FlightLevelBand:
    description: Embedded flight-level band value used by plans rather than an independently identified control reference
    semantic_role: representation
    parent: Struct
    fields:
      altitude_range_m: NumericRange
      alt_sep_m: float
      
  LoiterOrbit:
    description: Embedded orbit geometry and timing value
    semantic_role: representation
    parent: SpatialStruct
    fields:
      orbit_direction_ccw: bool
      orbit_radius_m: int
      loiter_time_s: int
      pattern: OrbitPattern

  MissionRouteGeometry: # too general name
    description: Embedded route geometry used by a mission plan
    semantic_role: representation
    parent: SpatialStruct
    fields:
      route_in: GeoPath
      survey: GeoPath
      survey_area: GeoArea
      route_out: GeoPath

  FlightMissionPoint:
    semantic_role: representation
    parent: AutopilotMissionWaypoint
    fields:
      point_type: FlightPlanPointType
      category: PlannerPointCategory

  PlannedRoutePoints:
    description: Embedded set of planner points defining mission-plan route segments
    semantic_role: representation
    parent: SpatialStruct
    fields:
      start: FlightMissionPoint
      route_in: list[FlightMissionPoint]
      route_out: list[FlightMissionPoint]
      end: FlightMissionPoint