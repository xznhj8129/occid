version: 1
type: schema
package: aerial
root: Control
tags:
  - core

enums:
  AirRole:
    - GROUND = 0
    - AIR_DEFENSE
    - FIGHTER
    - GROUND_ATTACK
    - ISR
    - MINE
    - CARGO

  FormationPattern:
    - LINE = 0
    - ECHELON
    - TRAIL
    - SQUARE
    - DIAMOND
    - VEE
    - MISSING_MAN
    - HEAVY_LEFT
    - HEAVY_RIGHT
    - ECHELON_LEFT
    - ECHELON_RIGHT
    - STAGGERED_TRAIL_LEFT
    - STAGGERED_TRAIL_RIGHT

  FormationRole:
    - LEAD = 0
    - FOLLOWER

  FormationJoinState:
    - UNKNOWN = 0
    - JOINING
    - JOINED
    - LEAVING
    - ABSENT

  FlightPlanPhase:
    - ONLINE = 0
    - PREPARING
    - TAKEOFF
    - ASSEMBLY
    - HOLDING
    - ENROUTE
    - INITIAL
    - OBJECTIVE
    - EGRESS
    - RETURN
    - APPROACH
    - LANDING
    - SHUTDOWN

  AirPlanAction:
    - FLY = 0
    - AIR_DROP
    - RECOVERY

  MilitaryAirTask:
    - ISR = 0
    - CLOSE_AIR_SUPPORT
    - ELECTRONIC_WARFARE
    - STRIKE
    - SEAD

  AirISRType:
    - OVERFLY = 0
    - FLYBY
    - ORBIT

models:
  FormationStation:
    description: One element's station, role, and timing within a formation
    semantic_role: representation
    parent: Struct
    fields:
      element_uid: ID
      role: FormationRole
      station_index: optional int
      lateral_offset: optional DistanceMeters
      vertical_offset: optional DistanceMeters
      longitudinal_offset: optional DistanceMeters
      altitude_offset: optional DistanceMeters
      delay: optional Duration

  Formation:
    description: Formation definition for a group, including member stations and stream timing
    semantic_role: representation
    parent: Struct
    fields:
      pattern: FormationPattern
      lateral_separation: DistanceMeters
      vertical_separation: optional DistanceMeters
      altitude_offset: optional DistanceMeters
      altitude_datum: optional AltitudeDatum
      element_interval: optional Duration
      stations: list[FormationStation]

  GroupFlightPlan:
    description: Flight plan for a group flying a route in formation
    semantic_role: representation
    parent: RoutePlan
    fields:
      action: AirPlanAction = FLY
      home: optional GlobalPosition
      flight_level: optional NumericRange
      cruise_airspeed: optional Airspeed
      formation: optional Formation

  FormationElementState:
    description: One element's observed position, deviation, and join state within a formation
    semantic_role: representation
    parent: Struct
    fields:
      element_uid: ID
      join_state: FormationJoinState
      position: optional GlobalPosition
      lateral_offset: optional DistanceMeters
      vertical_offset: optional DistanceMeters
      longitudinal_offset: optional DistanceMeters

  FormationState:
    description: Time-indexed formation condition for one plan, one entry per element
    semantic_role: representation
    parent: SubjectState
    fields:
      elements: list[FormationElementState]

  FlightState:
    description: Time-indexed flight phase and active waypoint for one plan
    semantic_role: representation
    parent: SubjectState
    fields:
      phase: FlightPlanPhase
      active_waypoint_index: optional int
