version: 1
type: schema
package: task
root: Task
tags:
  - core

enums:
  TaskISR:
    - OBSERVE = 0
    - SEARCH
    - FIND
    - SURVEY
    - INVESTIGATE
    - IMPROVE_TRACK
    - IMAGERY

  TaskType:
    - POSITIONING = 0
    - CARGO
    - HOLD
    - SUPPORT
    - MOVE
    - RESUPPLY

  TaskLevel:
    - MISSION = 0
    - PLAN

  TaskPhase:
    - CREATED = 0
    - DISPATCHED
    - ASSIGNED
    - RUNNING
    - DONE_OK
    - DONE_FAIL
    - CANCELLED

  TaskPriority:
    - ROUTINE = 0
    - HIGH
    - IMMEDIATE

  TaskStatus:
    - NEW = 0
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - FAILED
    - CANCELLED

  TaskAssignFail:
    - FAIL = 0
    - FAIL_NO_ASSETS
    - FAIL_BAD_REQUEST_CANTPRO
    - FAIL_DENIED
    - FAIL_INSUFFICIENT_INFO
    - FAIL_REJECTED
    - FAIL_C2_ELEMENT
    - FAIL_PLATFORM_CANTCO
    - FAIL_STALE
    - FAIL_CANCELLED

  TaskAir:
    - FLY = 0
    - AIR_DROP
    - RECOVERY

  AirMoveTask:
    - FLY = 0
    - RELOCATION

models:
  Task:
    description: A directive to accomplish an objective
    parent: Control
    variants:
      - Mission
      - Plan

    fields:
      task_id: StringID
      task_level: TaskLevel
      task_type: optional TaskType
      unit_code: string
      capability: optional Capability
      status: TaskStatus = NEW
      command_result: optional CommandResult
      assign_fail: optional TaskAssignFail
      phase: TaskPhase = CREATED
      geometry_id: optional StringID
      start_time: optional float
      deadline: optional float
      priority: TaskPriority = ROUTINE
      remarks: optional string
      last_update: optional float
      issued_by: optional string
      accepted_by: optional string
      assigned_assets: list[string]
      attempt_idx: int = 0
      dispatch_state: DeliveryState = QUEUED
      dispatch_error: optional string
      time_window: optional TaskTimeWindow
      status_log: list[TaskStatusEntry]
      qos: QosTier = ROUTINE
      ack_mode: AckMode = RECEIPT
      route_mode: RouteMode = DIRECT
      conflict_policy: ConflictPolicy = VECTOR_CLOCK
      objective: optional Objective

  Mission:
    description: Tactical, intent-based task that may contain other tasks
    parent: Task
    fields:
      task_level: const TaskLevel = MISSION
      tasks: list[Task]

  IsrTask:
    parent: Task
    fields:
      isr_task: optional TaskISR
      area: GeoArea
      dwell_seconds: optional float
      isr_params: optional IsrParameters
      isr_result: optional IsrResult
