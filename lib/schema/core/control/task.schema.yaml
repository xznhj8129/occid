version: 1
type: schema
package: task
root: Task
tags:
  - core

enums:
  TaskType:
    - MANEUVER = 0
    - EFFECT
    - INFORMATION
    - TRANSPORT

  TaskIntent:
    - MOVE = 0
    - HOLD
    - FOLLOW
    - TRANSIT
    - POSITION
    - CREATE
    - REMOVE
    - MODIFY
    - RESTORE
    - PROTECT
    - DENY
    - SEARCH
    - OBSERVE
    - IDENTIFY
    - CLASSIFY
    - MEASURE
    - ASSESS
    - MONITOR
    - CARGO
    - PERSONNEL
    - SUPPLY
    - EVACUATE
    - RECOVER

  TaskPhase:
    - CREATED = 0
    - DISPATCHED
    - ASSIGNED
    - RUNNING
    - DONE_OK
    - DONE_FAIL
    - CANCELLED

  TaskPriority:
    - ROUTINE = 0
    - HIGH
    - IMMEDIATE

  TaskStatus:
    - NEW = 0
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - FAILED
    - CANCELLED

maps:
  VALID_TASK_INTENT_TYPES:
    type: map[TaskIntent, TaskType]
    value:
      MOVE: MANEUVER
      HOLD: MANEUVER
      FOLLOW: MANEUVER
      TRANSIT: MANEUVER
      POSITION: MANEUVER
      CREATE: EFFECT
      REMOVE: EFFECT
      MODIFY: EFFECT
      RESTORE: EFFECT
      PROTECT: EFFECT
      DENY: EFFECT
      SEARCH: INFORMATION
      OBSERVE: INFORMATION
      IDENTIFY: INFORMATION
      CLASSIFY: INFORMATION
      MEASURE: INFORMATION
      ASSESS: INFORMATION
      MONITOR: INFORMATION
      CARGO: TRANSPORT
      PERSONNEL: TRANSPORT
      SUPPLY: TRANSPORT
      EVACUATE: TRANSPORT
      RECOVER: TRANSPORT

models:
  Task:
    description: Generic instruction-bearing work that must be accomplished in support of an optional objective
    parent: Directive
    fields:
      record: RecordMeta
      task_id: StringID
      instruction: string
      task_type: TaskType
      task_intent: optional TaskIntent
      target_refs: list[StringID]
      location_refs: list[StringID]
      objective_id: optional StringID
      constraints: list[Constraint]
      start_time: optional float
      deadline: optional float
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW
