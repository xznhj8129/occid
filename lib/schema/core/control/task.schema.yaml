version: 1
type: schema
package: task
root: Task
tags:
  - core

enums:
  TaskISR:
    - OBSERVE = 0
    - SEARCH
    - FIND
    - SURVEY
    - INVESTIGATE
    - IMPROVE_TRACK
    - IMAGERY

  TaskType:
    - POSITIONING = 0
    - CARGO
    - HOLD
    - SUPPORT
    - MOVE
    - RESUPPLY

  TaskPhase:
    - CREATED = 0
    - DISPATCHED
    - ASSIGNED
    - RUNNING
    - DONE_OK
    - DONE_FAIL
    - CANCELLED

  TaskPriority:
    - ROUTINE = 0
    - HIGH
    - IMMEDIATE

  TaskStatus:
    - NEW = 0
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - FAILED
    - CANCELLED

  TaskAssignFail:
    - FAIL = 0
    - FAIL_NO_ASSETS
    - FAIL_BAD_REQUEST_CANTPRO
    - FAIL_DENIED
    - FAIL_INSUFFICIENT_INFO
    - FAIL_REJECTED
    - FAIL_C2_ELEMENT
    - FAIL_PLATFORM_CANTCO
    - FAIL_STALE
    - FAIL_CANCELLED

  TaskAir:
    - FLY = 0
    - AIR_DROP
    - RECOVERY

  AirMoveTask:
    - FLY = 0
    - RELOCATION

models:
  Task:
    description: Work that must be accomplished in support of an objective
    parent: Control
    variants:
      - Mission

    fields:
      record: RecordMeta
      task_id: StringID
      task_type: optional TaskType
      status: TaskStatus = NEW
      start_time: optional float
      deadline: optional float
      priority: TaskPriority = ROUTINE

  Mission:
    description: Tactical, intent-based task that may contain other tasks
    parent: Task
    fields:
      tasks: list[Task]

  IsrTask:
    parent: Task
    fields:
      isr_task: optional TaskISR
      area: GeoArea
      dwell_seconds: optional float
      isr_params: optional IsrParameters
      isr_result: optional IsrResult

  MoveTask:
    description: Reposition to a destination; the entity resolves how
    parent: Task
    fields:
      task_type: const TaskType = MOVE
      destination: GlobalPosition
      route: optional GeoPath
      speed_ms: optional float
      altitude_m: optional float
      hold_seconds: optional float

  HoldTask:
    description: Hold position within a radius of a location
    parent: Task
    fields:
      task_type: const TaskType = HOLD
      location: GlobalPosition
      radius_m: float

  ResupplyTask:
    description: Deliver a payload to a destination
    parent: Task
    fields:
      task_type: const TaskType = RESUPPLY
      destination: GlobalPosition
      payload: map[string, int]
