version: 1
type: schema
package: task
root: Task
tags:
  - core

enums:
  ManeuverIntent:
    semantic_role: vocabulary
    values:
      - MOVE = "MOVE"
      - HOLD = "HOLD"
      - FOLLOW = "FOLLOW"
      - TRANSIT = "TRANSIT"
      - POSITION = "POSITION"

  EffectIntent:
    semantic_role: vocabulary
    values:
      - CREATE = "CREATE"
      - REMOVE = "REMOVE"
      - MODIFY = "MODIFY"
      - RESTORE = "RESTORE"
      - PROTECT = "PROTECT"
      - DENY = "DENY"

  InformationIntent:
    semantic_role: vocabulary
    values:
      - SEARCH = "SEARCH"
      - OBSERVE = "OBSERVE"
      - IDENTIFY = "IDENTIFY"
      - CLASSIFY = "CLASSIFY"
      - MEASURE = "MEASURE"
      - ASSESS = "ASSESS"
      - MONITOR = "MONITOR"

  TransportIntent:
    semantic_role: vocabulary
    values:
      - CARGO = "CARGO"
      - PERSONNEL = "PERSONNEL"
      - SUPPLY = "SUPPLY"
      - EVACUATE = "EVACUATE"
      - RECOVER = "RECOVER"

  TaskPhase:
    - CREATED = 0
    - DISPATCHED
    - ASSIGNED
    - RUNNING
    - DONE_OK
    - DONE_FAIL
    - CANCELLED

  TaskPriority:
    - ROUTINE = 0
    - HIGH
    - IMMEDIATE

  TaskStatus:
    - NEW = 0
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - FAILED
    - CANCELLED

models:
  Task:
    description: Directed work that must be accomplished in support of an optional objective
    semantic_role: ontology
    parent: Directive
    fields:
      record: RecordMeta
      task_id: StringID
      instruction: optional string
      target_refs: list[StringID]
      location_refs: list[StringID]
      objective_id: optional StringID
      constraints: list[Constraint]
      preconditions: optional list[Condition]
      start_time: optional float
      deadline: optional float
      priority: TaskPriority = ROUTINE
      status: TaskStatus = NEW

  TaskManeuver:
    description: Practical Task schema for desired movement, position, or spatial persistence
    semantic_role: specialization
    parent: Task
    fields:
      intent: ManeuverIntent

  TaskEffect:
    description: Practical Task schema for desired creation, removal, modification, restoration, protection, or denial
    semantic_role: specialization
    parent: Task
    fields:
      intent: EffectIntent

  TaskInformation:
    description: Practical Task schema for desired search, observation, identification, classification, measurement, assessment, or monitoring
    semantic_role: specialization
    parent: Task
    fields:
      intent: InformationIntent

  TaskTransport:
    description: Practical Task schema for desired movement of cargo, personnel, supplies, casualties, or recoverable assets
    semantic_role: specialization
    parent: Task
    fields:
      intent: TransportIntent
