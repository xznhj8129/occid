version: 1
type: schema
name: reasoning
description: ""
tags:
  - core
root: control

models:
  Reasoning:
    parent: Control
    variants:
      - Purpose
      - Intent
      - Objective

  Purpose:
    parent: Reasoning

  Intent:
    parent: Reasoning

  Objective:
    parent: Reasoning

  ObjectiveSchema:
    parent: Objective
    fields:
      objective_id: string
      intent: string
      success_rule: optional string
      priority: optional TaskPriority
      target_ref: optional string
      geo_goal: optional GlobalPosition
      end_condition: optional string
      deadline_ts: optional float

  ObjectiveBinding:
    parent: Objective
    fields:
      objective_id: string
      task_ids: list[string]
      priority: optional TaskPriority
      deadline_ts: optional float
      success_rule: optional string
