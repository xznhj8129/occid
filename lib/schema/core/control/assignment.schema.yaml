version: 1
type: schema
package: assignment
root: Assignment
tags:
  - core

enums:
  AssignmentStatus:
    - PROPOSED = 0
    - ASSIGNED
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - REJECTED
    - CANCELLED

models:
  Assignment:
    description: Explicit binding of a task to an assignee under stated authority and constraints
    semantic_role: ontology
    parent: Control
    fields:
      record: RecordMeta
      assignment_id: StringID
      task_id: StringID
      assignee_id: StringID
      plan_id: optional StringID
      authority_id: optional StringID
      assigned_by: StringID
      assigned_at: float
      accepted_at: optional float
      status: AssignmentStatus = PROPOSED
      constraints: list[Constraint]

  FlightAssignment:
    semantic_role: specialization
    parent: Assignment
    fields:
      num: int
      unit_id: optional StringID
      callsign: optional string
      objective_assign: optional int
      wave_n: int = 0
      formation_n: int = 0
      takeoff_time: float = 0.0
