version: 1
type: schema
package: assignment
root: Assignment
tags:
  - core

enums:
  AssignmentStatus:
    - PROPOSED = 0
    - ASSIGNED
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - REJECTED
    - CANCELLED

models:
  Assignment:
    description: Explicit binding of a task to an assignee under stated authority and constraints
    semantic_role: ontology
    parent: Control
    fields:
      record: RecordMeta
      uid: UID
      id: int
      task_uid: UID
      assignee_uid: UID
      plan_uid: optional UID
      authority_uid: optional UID
      assigned_by_uid: UID
      assigned_at: float
      accepted_at: optional float
      status: AssignmentStatus = PROPOSED
      constraints: list[Constraint]

  FlightAssignment:
    semantic_role: specialization
    parent: Assignment
    fields:
      num: int
      unit_uid: optional UID
      callsign: optional string
      objective_assign: optional int
      wave_n: int = 0
      formation_n: int = 0
      takeoff_time: float = 0.0
