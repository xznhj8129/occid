version: 1
type: schema
package: assignment
root: Assignment
tags:
  - core

enums:
  AssignmentStatus:
    - PROPOSED = 0
    - ASSIGNED
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - REJECTED
    - CANCELLED

models:
  Assignment:
    description: Deliberate binding of an assignee to a subject under stated authority and constraints
    semantic_role: concept
    parent: Control
    fields:
      uid: ID
      assignee_uid: ID
      authority_uid: ID
      assigned_by_uid: ID
      status: AssignmentStatus = PROPOSED
      constraints: list[Constraint]

  TaskAssignment:
    description: Assignment of a Task to an assignee
    semantic_role: representation
    parent: Assignment
    fields:
      task_uid: ID

  RoleAssignment:
    description: Assignment of an organizational Role to an actor
    semantic_role: representation
    parent: Assignment
    fields:
      organization_uid: ID
      role: OrgRole

  FlightAssignment:
    semantic_role: representation
    parent: Assignment
    fields:
      num: int
      unit_uid: optional ID
      callsign: optional string
      objective_assign: optional int
      wave_n: int = 0 #?
      formation_n: int = 0 #???
      takeoff_ts: Timestamp
