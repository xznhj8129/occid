version: 1
type: schema
package: plan
root: Plan
tags:
  - core

enums:
  PlanApprovalState:
    - DRAFT = 0
    - PROPOSED
    - APPROVED
    - REJECTED
    - SUPERSEDED

  PlanStepStatus:
    - PENDING = 0
    - READY
    - ACTIVE
    - COMPLETE
    - FAILED
    - SKIPPED

  WaypointRole:
    - HOME = 0
    - TAKEOFF
    - LANDING
    - HOLD
    - WAYPOINT
    - ASSEMBLY
    - POI
    - ROI
    - SURVEY
    - INGRESS
    - EGRESS

  OrbitPattern:
    - CIRCLE = 0
    - RACETRACK
    - FIGURE_EIGHT


models:
  Plan:
    description: Proposed or approved method for accomplishing one or more tasks using actors, resources, sequencing, routes, constraints, and contingencies
    semantic_role: concept
    parent: Control

    fields:
      uid: ID
      name: optional string
      approval_state: PlanApprovalState = DRAFT

  OperationalPlan:
    description: Task-based
    semantic_role: concept
    parent: Plan
    fields:
      objective_uids: list[ID]
      task_uids: list[ID]
      actor_uids: list[ID]
      resource_uids: list[ID]
      assignment_uids: list[ID]
      constraints: list[Constraint]
      contingencies: list[PlanContingency]


  RoutePlan:
    description: Plan of routed movement along an ordered sequence of movement points
    semantic_role: concept
    parent: Plan
    fields:
      waypoints: list[Waypoint]

  Waypoint:
    description: A point of movement on a route, with its role and movement constraints
    semantic_role: representation
    parent: SpatialStruct
    fields:
      position: GlobalPosition
      role: WaypointRole = WAYPOINT
      capture_radius: optional DistanceMeters
      hold_time: optional Duration
      heading_rad: optional float
      speed_ms: optional float
      velocity: optional VelocityVector
      orbit: optional LoiterOrbit
      area: optional GeoArea

  LoiterOrbit:
    description: Embedded orbit geometry and timing value
    semantic_role: representation
    parent: SpatialStruct
    fields:
      orbit_direction_ccw: bool
      orbit_radius: DistanceMeters
      loiter_time: Duration
      pattern: OrbitPattern

  PlanContingency: # conditional plans or tasks?
    semantic_role: representation
    parent: Struct
    fields:
      condition: Condition
      task_uids: list[ID]
