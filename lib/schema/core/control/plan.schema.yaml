version: 1
type: schema
package: plan
root: Plan
tags:
  - core

enums:
  PlanApprovalState:
    - DRAFT = 0
    - PROPOSED
    - APPROVED
    - REJECTED
    - SUPERSEDED

  PlanStepStatus:
    - PENDING = 0
    - READY
    - ACTIVE
    - COMPLETE
    - FAILED
    - SKIPPED

  FlightType:
    - SURVEY_POINT = 0
    - SURVEY_AREA
    - ONE_WAY

  FlightPlanPhase:
    - ONLINE = 0
    - PREPARING
    - TAKEOFF
    - ASSEMBLY
    - HOLDING
    - ENROUTE
    - INITIAL
    - OBJECTIVE
    - EGRESS
    - RETURN
    - APPROACH
    - LANDING
    - SHUTDOWN

models:
  Plan:
    description: Proposed or approved method for accomplishing one or more tasks using actors, resources, sequencing, routes, constraints, and contingencies
    parent: Control
    variants:
      - AutopilotFlightPlan
      - GroupFlightPlan
      - UnitFlightPlan
      - MissionPlan
    fields:
      record: RecordMeta
      plan_id: StringID
      name: optional string
      objective_ids: list[StringID]
      task_ids: list[StringID]
      actor_ids: list[StringID]
      resource_ids: list[StringID]
      assignments: list[StringID]
      steps: list[PlanStep]
      routes: list[GeoPath]
      constraints: list[Constraint]
      contingencies: list[PlanContingency]
      approval_state: PlanApprovalState = DRAFT

  PlanStep:
    description: Immutable planned step definition; runtime status belongs to execution state
    parent: Struct
    fields:
      step_id: StringID
      task_id: optional StringID
      actor_ids: list[StringID]
      depends_on: list[StringID]
      sequence: int

  PlanContingency:
    parent: Struct
    fields:
      contingency_id: StringID
      condition: string
      response: string
      task_ids: list[StringID]

  AutopilotFlightPlan:
    parent: Plan
    fields:
      waypoints: list[AutopilotMissionWaypoint]

  GroupFlightPlan:
    parent: Plan
    fields:
      plan_phase: FlightPlanPhase
      flight_level: optional FlightLevelBand
      alt_frame: optional AltitudeDatum
      h_sep_m: optional float
      delay_s: optional float
      airspeed: optional float
      path_offset: optional LocalDirection
      formation_2d: optional AirGroupFormation2DType
      formation_3d: optional AirGroupFormation3DType

  UnitFlightPlan:
    parent: Plan
    variants: null
    fields:
      unit_num: int
      callsign: string
      fl: float
      route_in: GeoPath
      target: PlannerMissionPoint
      route_out: GeoPath
      home: GlobalPosition
      land_pos: GlobalPosition
      ip_wait_delay: float = 0.0
      wp: GeoPath

  MissionPlan:
    parent: Plan
    description: Saved operator mission plan - the planner inputs, restorable for editing
    fields:
      flight_type: FlightType = SURVEY_POINT
      air_task: TaskAir = FLY
      manual: bool = false
      points: PlannedRoutePoints
      config: map[string, float]
      saved_ts: optional float
