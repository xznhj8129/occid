version: 1
type: schema
package: plan
root: Plan
tags:
  - core

enums:
  FlightType:
    - SURVEY_POINT = 0
    - SURVEY_AREA
    - ONE_WAY

  FlightPlanPhase:
    - ONLINE = 0
    - PREPARING
    - TAKEOFF
    - ASSEMBLY
    - HOLDING
    - ENROUTE
    - INITIAL
    - OBJECTIVE
    - EGRESS
    - RETURN
    - APPROACH
    - LANDING
    - SHUTDOWN

models:
  Plan:
    description: Plan-level task with structured execution data and no task subdivision
    parent: Task
    fields:
      task_level: const TaskLevel = PLAN

  AutopilotFlightPlan:
    parent: Plan
    fields:
      waypoints: list[AutopilotMissionWaypoint]

  GroupFlightPlan:
    parent: Plan
    fields:
      plan_phase: FlightPlanPhase
      flight_level: optional FlightLevelBand
      alt_frame: optional AltitudeDatum
      h_sep_m: optional float
      delay_s: optional float
      airspeed: optional float
      path_offset: optional LocalDirection
      formation_2d: optional AirGroupFormation2DType
      formation_3d: optional AirGroupFormation3DType

  UnitFlightPlan:
    parent: Plan
    variants: null
    fields:
      unit_num: int
      callsign: string
      fl: float
      route_in: GeoPath
      target: PlannerMissionPoint
      route_out: GeoPath
      home: GlobalPosition
      land_pos: GlobalPosition
      ip_wait_delay: float = 0.0
      wp: GeoPath

  MissionPlan:
    parent: Plan
    description: Saved operator mission plan - the planner inputs, restorable for editing
    fields:
      name: string
      flight_type: FlightType = SURVEY_POINT
      air_task: TaskAir = FLY
      manual: bool = false
      points: PlannedRoutePoints
      config: map[string, float]
      saved_ts: optional float
