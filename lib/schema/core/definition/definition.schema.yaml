version: 1
type: schema
name: definition
description: "Abstract semantic descriptors, classification axes, and symbology maps."
tags:
  - core
root: core

enums:
  ConfidenceLevel:
    - UNKNOWN = 0
    - LOW
    - MEDIUM
    - HIGH
    - CONFIRMED

  OperationalDomain:
    - LAND = 0
    - AIR
    - SEA
    - SUB
    - SPACE
    - CYBER
    - ALL

  EffectDomain:
    - LAND = 0
    - AIR
    - SEA
    - SUB
    - SPACE
    - CYBER
    - ALL

  SchemaKind:
    - BASIC_UNIT = 0
    - GROUND_ORG
    - AIR_ORG
    - AIR_UNIT
    - GROUND_UNIT
    - INTEL_TRACK
    - LINK
    - SENSOR
    - INSTALLATION

  Faction:
    - UNKNOWN = 0
    - PENDING
    - FRIENDLY
    - SUSPECT
    - HOSTILE
    - NEUTRAL
    - ASSUMED
    - FAKER
    - JOKER

  AlternateIdType:
    - TRACK_ID = 0
    - ASSET_ID
    - CALLSIGN
    - SERIAL_NUMBER
    - REGISTRATION
    - UNIT_CODE
    - TRACK_NUMBER
    - JU_NUMBER

  PriorityLevel:
    - LOW = 0
    - NORMAL
    - HIGH
    - CRITICAL

  PropulsionType:
    - FOOT = 0
    - WHEELED
    - TRACKED
    - ROTARY_WING
    - FIXED_WING
    - JET
    - MARITIME
    - STATIC

  NavigationMode:
    - MANUAL = 0
    - INS
    - GNSS
    - INS_GNSS
    - VISUAL
    - TERRAIN_FOLLOW

  FuelType:
    - GASOLINE = 0
    - DIESEL
    - HEAVY_FUEL
    - JET_FUEL
    - BATTERY
    - HYBRID

maps:
  SIDC_FACTION:
    type: map[string, string]
    value:
      UNKNOWN: U
      PENDING: P
      FRIENDLY: F
      SUSPECT: S
      HOSTILE: H
      NEUTRAL: N

  SIDC_DOMAIN:
    type: map[string, string]
    value:
      ground: G
      air: A
      sea: S
      sub: U

  SIDC_STATUS:
    type: map[string, string]
    value:
      anticipated: A
      present: P
      present-capable: C
      present-damaged: D
      present-destroyed: X

  SIDC_AIR_A5:
    type: map[string, string]
    value:
      track: "-"
      military: M
      civilian: C

  SIDC_AIR_A6:
    type: map[string, string]
    value:
      fixed-wing: F
      rotary: H
      weapon: W

  SIDC_AIR_MILITARY:
    type: map[string, string]
    value:
      fighter: F
      attack: A
      bomber: B
      utility: U
      drone: Q
      missile: M
      decoy: D
      recon: R
      ecm: J

  SIDC_GROUND_A5:
    type: map[string, string]
    value:
      track: "-"
      unit: U

  SIDC_GROUND_A6:
    type: map[string, string]
    value:
      combat: C
      combat-support: U
      service-support: S

  SIDC_COMBAT_GROUND:
    type: map[string, string]
    value:
      air-defence: D
      armor: A
      ssm: M
      artillery: F
      infantry: I
      anti-tank: A
      recon: R
      hq: H
      engineer: E

  SIDC_COMBAT_GROUND_INFANTRY:
    type: map[string, string]
    value:
      light: L
      motorized: M
      mechanized: Z
      ifv: I
      air-assault: A

  SIDC_AIR_WEAPON_MISSILE:
    type: map[string, string]
    value:
      ssm: S*APWMSS----
      sam: S*APWMSA----
      aam: S*APWMAA----
      asm: S*APWMAS----
      land-attack: S*APWML----

  SIDC_GROUND_ARTILLERY:
    type: map[string, string]
    value:
      spg: S*GPUCFHE---
      light_towed: S*GPUCFHL---
      medium_towed: S*GPUCFHM---
      heavy_towed: S*GPUCFHH---
      sp_mrl: S*GPUCFRMS--
      towed_mortar: S*GPUCFMT---
      ssm: S*GPUCMMT---

  SIDC_UNIT_SIZE:
    type: map[string, string]
    value:
      single: "-"
      team: A
      squad: B
      section: C
      platoon: D
      company: E
      battalion: F
      regiment: G
      brigade: H
      division: H

  SIDC_CODES:
    type: map[string, any]
    value:
      friendly:
        land:
          default: S*GP--------
          unit: S*GPUC------
          infantry: S*GPUCI-----
          armor: S*GPUCA-----
          recon: S*GPUCR-----
          artillery: S*GPUCF-----
          hq: S*GPUH----A-
          tfhq: S*GPUH----B-
          tf: S*GPUH----E-
        air:
          default: S*APM-------
      hostile:
        land:
          default: SHGPU-------
        air:
          default: SHAPM-------
