version: 1
type: schema
package: entities
root: Entity
tags:
  - core

enums:
  EntityType:
    - PERSON = 0
    - MACHINE
    - SYSTEM

  MachineType:
    - VEHICLE = 0
    - ROBOT

  SystemType:
    - PLATFORM = 0
    - EQUIPMENT

  EntityOperationalState:
    - UNKNOWN = 0
    - READY
    - ACTIVE
    - DEGRADED
    - MAINTENANCE
    - DAMAGED
    - DESTROYED
    - OFFLINE

  EntityLifecycleStatus:
    - ACTIVE = 0
    - INACTIVE
    - UNKNOWN

models:
  Entity:
    description: One discrete "atom" capable of actions
    parent: Object
    variants:
      - Actor
      - Machine
    fields:
      object_type: ObjectType = ENTITY
      entity_id: string
      short_id: optional string
      name: optional string
      entity_type: optional EntityType
      lifecycle_status: optional EntityLifecycleStatus
      created_ts: optional float
      updated_ts: optional float
      origin_system: optional string
      alt_ids: list[Identifier]
      tags: list[string]
      metadata: list[MetadataEntry]
      relations: list[RelationSchema]
      location_state: optional LocationState
      symbology: optional SymbologySchema
      display_meta: optional DisplayMeta

  Actor:
    parent: Entity
    variants:
      - Person
      - Agent

  Agent:
    parent: Actor

  Person:
    parent: Actor
    variants: null
    fields:
      entity_type: EntityType = PERSON
      role: string
      serial_uid: string = ""
      op_domain: OperationalDomain = LAND
      propulsion: PropulsionType = FOOT
      navigation: NavigationMode
      navaids: list[NavAids]
      health: HumanHealthStatus
      sensors: map[string, SensorSchema]
      links: map[string, LinkSchema]

  Machine:
    parent: Entity
    variants:
      - Vehicle
      - Robot
      - Platform
      - GroundMachine
      - AirMachine
    fields:
      entity_type: EntityType = MACHINE
      sys_id: string
      machine_type: optional MachineType
      status: EntityOperationalState
      health_snapshot: optional HealthSnapshot
      power_state: optional PowerStateSchema
      supplies: optional SuppliesSchema
      link_condition: optional LinkCondition
      control_level: optional ControlLevel
      components: list[EntityComponentRef]

  Vehicle:
    parent: Machine

  Platform:
    parent: Machine

  GroundMachine:
    parent: Machine
    variants:
      - GroundRobot
    fields:
      machine_type: MachineType
      op_domain: OperationalDomain = LAND
      model: string
      role: string
      serial_uid: string = ""
      sensors: map[string, SensorSchema]
      navigation: GroundNavigationSchema

  AirMachine:
    parent: Machine
    variants:
      - AirRobot
    fields:
      machine_type: optional MachineType
      op_domain: OperationalDomain = AIR
      model: string
      serial_uid: string = ""
      sensors: map[string, SensorSchema]
      navigation: AirNavigationSchema
      maint_status: optional MaintenanceStatus
