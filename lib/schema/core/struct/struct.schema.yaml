version: 1
type: schema
package: struct
root: Struct
tags:
  - core

models:
  Struct:
    description: "Primitive reusable low-level struct families."
    parent: Root
    variants:
      - Vector
      - Measurement
      - Bearing
      - GeoPos
      - LocalPos
      - Line
      - StructPath
      - Shape
      - Bounding
      - Uncertainty
      - Pose
      - Range
      - Transform
      - Orbital
      - SpatialStruct

  Vector:
    parent: Struct

  Measurement:
    parent: Struct

  Bearing:
    parent: Struct

  GeoPos:
    parent: Struct

  LocalPos:
    parent: Struct

  Line:
    parent: Struct

  StructPath:
    parent: Struct

  Shape:
    parent: Struct

  Bounding:
    parent: Struct

  Uncertainty:
    parent: Struct

  Pose:
    parent: Struct

  Range:
    parent: Struct

  Transform:
    parent: Struct

  Orbital:
    parent: Struct

  Time:
    parent: Measurement
    fields:
      utime: int

  Duration:
    parent: Measurement
    fields:
      ms: optional float
      seconds: optional float
      minutes: optional float
      hours: optional float
      days: optional float
      weeks: optional float
      months: optional float
      years: optional float

  Timestamp:
    parent: Measurement
    fields:
      ms: float
      seconds: float
      minutes: float
      hours: float
      day: float
      month: float
      year: float
      tz: float

  ItemCount:
    parent: Measurement
    fields:
      item_type: string
      qty: int = 0

  NumericRange:
    parent: Range
    fields:
      min_value: optional float
      max_value: optional float
