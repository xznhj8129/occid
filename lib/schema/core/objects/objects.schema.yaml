version: 1
type: schema
name: objects
description: "Objects, entities, sets, items, and world references."
tags:
  - core
root: core
branches:
  - entities
  - organization
  - items
  - world

enums:
  ObjectType:
    - ENTITY = 0
    - ORGANIZATION

models:
  Object:
    parent: Root

  BaseObject:
    parent: Object
    variants:
      - Entity
      - Set
      - Item
      - World
    fields:
      object_type: ObjectType

  Entity:
    parent: BaseObject

  Set:
    parent: BaseObject
    variants:
      - Organization
      - Collection
      - Cluster
      - System

  Organization:
    parent: Set
    variants:
      - BaseOrg

  Collection:
    parent: Set

  Cluster:
    parent: Set

  System:
    parent: Set

  Item:
    parent: BaseObject
    variants:
      - Record
      - Equipment
      - Component
      - Payload

  Record:
    parent: Item

  Equipment:
    parent: Item

  Component:
    parent: Item

  Payload:
    parent: Item

  World:
    parent: BaseObject
    variants:
      - Feature
      - Location
      - Site

  Feature:
    parent: World

  Location:
    parent: World

  Site:
    parent: World
