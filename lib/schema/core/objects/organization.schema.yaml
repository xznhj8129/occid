version: 1
type: schema
name: organization
description: "Organized sets of entities and subordinate organizations."
tags:
  - core
root: objects

enums:
  OrgLevel:
    - UNIT = 0
    - GROUP

  OrgType:
    - CIV = 0
    - COMMERCIAL
    - NGO
    - GOVT

  OrgTopology:
    - NONE = 0
    - HIERARCHICAL
    - CELLULAR

models:
  BaseOrg:
    parent: Organization
    variants:
    fields:
      org_uid: string
      object_type: ObjectType = ORGANIZATION
      orglevel: OrgLevel = GROUP
      org_type: optional OrgType
      topology: optional OrgTopology
      position: optional GlobalPosition
      control_level: optional ControlLevel
      link_condition: optional LinkCondition
