models:
  OrgComposition:
    fields:
      category: optional NATOUnitCategory
      label: optional string
      qty: int = 0


  BaseOrg:
    parent: BaseObject
    fields:
      org_uid: string
      object_type: ObjectType = ORGANIZATION
      orglevel: OrgLevel = GROUP
      topology: optional OrgTopology
      sidc: optional string
      position: optional GlobalPosition
      control_level: optional ControlLevel
      link_condition: optional LinkCondition
      link_loadout: list[ItemCount]


  FlyingOrg:
    parent: BaseOrg
    fields:
      category: NATOUnitCategory
      op_domain: OperationalDomain = AIR
      air_units: list[ItemCount]


  BaseOrbatOrg:
    parent: BaseOrg
    fields:
      Orgtype: OrgLayout = ORBAT
      topology: OrgTopology = HIERARCHICAL
      category: NATOUnitCategory
      size: OOBSize
      op_domain: OperationalDomain
      taskforce: optional bool
      links: map[string, LinkSchema]
      tac_elements: list[OrgComposition]
      sup_elements: list[OrgComposition]
      tac_e_comp: list[ItemCount]
      sup_e_comp: list[ItemCount]
      personnel: list[ItemCount]
      vehicles: list[ItemCount]
      equipment: list[ItemCount]
      spacing: float = 0.0


  GroundOrbatOrg:
    parent: BaseOrbatOrg
    fields:
      category: NATOUnitCategory
      op_domain: OperationalDomain = LAND
      combat_domain: OperationalDomain
      ammo: list[ItemCount]
      weapons: list[ItemCount]
      air_units: list[ItemCount]
