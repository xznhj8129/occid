version: 1
type: schema
package: spatial
root: SpatialStruct
tags:
  - core

enums:
  InertialReferenceFrame:
    - NEU = 0
    - NED
    - ENU

  BodyReferenceFrame:
    - FLU = 0
    - FRD

  AltitudeDatum:
    - RELATIVE = 0
    - SEA_LEVEL
    - TERRAIN
    - POI_RELATIVE
    - BAROMETRIC
    - INVALID

  GeometryTypes:
    - POINT = 0
    - MULTI_POINT
    - LINE_STRING
    - MULTI_LINE_STRING
    - POLYGON
    - MULTI_POLYGON
    - GEOMETRY_COLLECTION

  GeoJsonGeometryTypes:
    - POINT = "Point"
    - MULTI_POINT = "MultiPoint"
    - LINE_STRING = "LineString"
    - MULTI_LINE_STRING = "MultiLineString"
    - POLYGON = "Polygon"
    - MULTI_POLYGON = "MultiPolygon"
    - GEOMETRY_COLLECTION = "GeometryCollection"

  SurfaceFormationShapes:
    - COLUMN = 0
    - LINE
    - SCREEN
    - WEDGE
    - LOZENGE
    - CIRCLE
    - SQUARE

  FormationForm:
    - PERIMETER = 0
    - FILL

  RouteLeg:
    - UNDEFINED = 0
    - OUTBOUND
    - RETURN

  RouteMethod:
    - WALKING = 0
    - DRIVING
    - FLYING
    - SWIMMING
    - WATERCRAFT

  RouteType:
    - PRIMARY = 0
    - SECONDARY

  WaypointType:
    - GLOBAL = 0
    - LOCAL
    - OBJECT

models:
  SpatialStruct:
    description: Spatial struct support models
    parent: Struct

  EulerAngles:
    description: Euler attitude in radians; frame metadata is optional in the record but consumers performing transforms or control must require the frames they depend on
    parent: Pose
    fields:
      roll_rad: float
      pitch_rad: float
      yaw_rad: float
      body_frame: optional BodyReferenceFrame
      reference_frame: optional InertialReferenceFrame

  LocalDirection:
    description: Local bearing/azimuth/elevation angles in radians; slant_range is an optional distance in meters when range is known
    parent: Bearing
    fields:
      bearing: float
      azimuth: float
      elevation: float
      slant_range: optional float

  LocalVector:
    parent: Vector
    fields:
      x: float
      y: float
      z: float
      frame: InertialReferenceFrame

  GlobalPosition:
    parent: GeoPos
    fields:
      lat: float
      lon: float
      alt: float
      mgrs: optional string
      datum: const string = "WGS84"
      alt_frame: AltitudeDatum

  GeoPath:
    parent: StructPath
    fields:
      points: list[GlobalPosition]

  GeoArea:
    parent: Shape
    fields:
      vertices: list[GlobalPosition]

  BoundingBox:
    parent: Bounding
    fields:
      x1: float
      y1: float
      z1: float
      x2: float
      y2: float
      z2: float

  VelocityVector:
    description: Linear velocity with optional explicit inertial reference frame
    parent: Vector
    fields:
      x: float
      y: float
      z: float
      frame: optional InertialReferenceFrame

  AngularVelocityVector:
    description: Body angular velocity in radians per second with optional explicit body frame
    parent: Vector
    fields:
      x_rad_s: float
      y_rad_s: float
      z_rad_s: float
      frame: optional BodyReferenceFrame

  AltitudeState:
    parent: Measurement
    fields:
      absolute_m: optional float
      relative_m: optional float
      datum: AltitudeDatum

  LocationUncertainty:
    parent: Uncertainty
    fields:
      horiz_err_m: optional float
      vert_err_m: optional float
      ellipse_major_m: optional float
      ellipse_minor_m: optional float
      ellipse_bearing_deg: optional float

  GeoJsonGeometry:
    parent: Shape
    fields:
      type: GeoJsonGeometryTypes
      coordinates: optional any
      geometries: optional list[GeoJsonGeometry]
      bbox: optional BoundingBox

  Position:
    description: Position in space, address or placement
    parent: State

  LocationState:
    parent: Position
    fields:
      inertial_frame: optional InertialReferenceFrame
      body_frame: optional BodyReferenceFrame
      position: optional GlobalPosition
      uncertainty: optional LocationUncertainty
      attitude: optional EulerAngles
      altitude: optional AltitudeState
      velocity: optional VelocityVector
      navigation_validity: optional NavigationValidity
      gnss: optional GnssSolution

  SpotterOrigin:
    parent: Position
    fields:
      position: GlobalPosition
      attitude: optional EulerAngles
      look_vector: optional LocalDirection
