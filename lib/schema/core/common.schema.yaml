version: 1
type: schema
package: common
root: Root
tags:
  - core

enums:
  ConfidenceLevel:
    - UNKNOWN = 0
    - LOW
    - MEDIUM
    - HIGH
    - CONFIRMED

  OperationalDomain:
    - LAND = 0
    - AIR
    - SEA
    - SUB
    - SPACE
    - CYBER
    - ALL

  EffectDomain:
    - LAND = 0
    - AIR
    - SEA
    - SUB
    - SPACE
    - CYBER
    - ALL

  SchemaKind:
    - BASIC_UNIT = 0
    - GROUND_ORG
    - AIR_ORG
    - AIR_UNIT
    - GROUND_UNIT
    - LINK
    - SENSOR
    - INSTALLATION

  PriorityLevel:
    - LOW = 0
    - NORMAL
    - HIGH
    - CRITICAL

  PropulsionType:
    - FOOT = 0
    - WHEELED
    - TRACKED
    - ROTARY_WING
    - FIXED_WING
    - JET
    - MARITIME
    - STATIC

  NavigationMode:
    - MANUAL = 0
    - INS
    - GNSS
    - INS_GNSS
    - VISUAL
    - TERRAIN_FOLLOW

  FuelType:
    - BATTERY = 0
    - GASOLINE
    - DIESEL
    - HEAVY_FUEL
    - JET_FUEL
    - HYBRID

models:
  Root:
    description: Any distinct part of the overall framework that can be identified, described, or referenced
    variants:
      - Definition
      - Struct
      - Object
      - Control
      - Communication
      - Data

  Definition:
    description: Abstract structure used to define how values, space, geometry, time, or relations are interpreted; semantic
      descriptors.
    parent: Root
    variants:
      - Frame
      - Coordinate
      - Geometry
      - SemanticType
      - DefinitionRelationship

  Frame:
    parent: Definition

  Coordinate:
    parent: Definition

  Geometry:
    parent: Definition

  SemanticType:
    parent: Definition
    variants:
      - Category
      - Role
      - Function
      - FactionAxis
      - Domain

  Category:
    parent: SemanticType

  Role:
    parent: SemanticType

  Function:
    parent: SemanticType

  FactionAxis:
    parent: SemanticType

  Domain:
    parent: SemanticType

  DefinitionRelationship:
    parent: Definition

  Struct:
    description: Primitive reusable low-level struct families.
    parent: Root
    variants:
      - Vector
      - Measurement
      - Bearing
      - GeoPos
      - LocalPos
      - Line
      - StructPath
      - Shape
      - Bounding
      - Uncertainty
      - Pose
      - Range
      - Transform
      - Orbital
      - SpatialStruct

  Vector:
    parent: Struct

  Measurement:
    parent: Struct

  Bearing:
    parent: Struct

  GeoPos:
    parent: Struct

  LocalPos:
    parent: Struct

  Line:
    parent: Struct

  StructPath:
    parent: Struct

  Shape:
    parent: Struct

  Bounding:
    parent: Struct

  Uncertainty:
    parent: Struct

  Pose:
    parent: Struct

  Range:
    parent: Struct

  Transform:
    parent: Struct

  Orbital:
    parent: Struct

  Time:
    parent: Measurement
    fields:
      utime: int

  Duration:
    parent: Measurement
    fields:
      ms: optional float
      seconds: optional float
      minutes: optional float
      hours: optional float
      days: optional float
      weeks: optional float
      months: optional float
      years: optional float

  Timestamp:
    parent: Measurement
    fields:
      ms: float
      seconds: float
      minutes: float
      hours: float
      day: float
      month: float
      year: float
      tz: float

  ItemCount:
    parent: Measurement
    fields:
      item_type: string
      qty: int = 0

  NumericRange:
    parent: Range
    fields:
      min_value: optional float
      max_value: optional float
