version: 1
type: schema
package: radio
root: Radio
tags:
  - core

enums:
  Waveform:
    - FM = 0
    - AM
    - OFDM
    - USB
    - LSB
    - LORA
    - LTE
    - DSSS
    - FHSS

  RadioService:
    - VOICE = 0
    - APRS
    - LORA
    - RC_LINK
    - TELEMETRY_LINK
    - FPV_VIDEO
    - MESHTASTIC
    - MESHCORE

  NATORadioBands:
    - A_BAND_0_250M = 0
    - B_BAND_250M_500M
    - C_BAND_500M_1G
    - D_BAND_1G_2G
    - E_BAND_2G_3G
    - F_BAND_3G_4G
    - G_BAND_4G_6G
    - H_BAND_6G_8G
    - I_BAND_8G_10G
    - J_BAND_10G_20G
    - K_BAND_20G_40G
    - L_BAND_40G_60G
    - M_BAND_60G_100G

models:
  Radio:
    description: What messages are transmitted over
    semantic_role: representation
    parent: Link
    variants:
      - FrequencyRange
      - ChannelSpec
      - RadioProfile

  FrequencyRange:
    semantic_role: representation
    parent: Radio
    fields:
      low_mhz: optional float
      high_mhz: optional float
      center_mhz: optional float

  ChannelSpec:
    semantic_role: representation
    parent: Radio
    fields:
      channel_uid: optional UID
      label: optional string
      frequency: optional FrequencyRange
      bandwidth_mhz: optional float
      spacing_mhz: optional float

  RadioProfile:
    semantic_role: representation
    parent: Radio
    variants: null
    fields:
      service: optional RadioService
      waveform: optional Waveform
      frequency: optional FrequencyRange
      channel_plan: list[ChannelSpec]
      active_channel_uid: optional UID
      crypto_types: list[CryptoType]
      crypto_profile: optional CryptoProfile
      lora: optional LoRaProfile
      aprs: optional AprsProfile
      elrs: optional ElrsProfile
      fpv: optional FpvProfile
