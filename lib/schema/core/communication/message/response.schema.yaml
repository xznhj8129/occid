version: 1
type: schema
name: response
description: "Communication whose purpose is acknowledgment, acceptance, rejection, result, or completion notice"
tags:
  - core
root: message

models:
  Response:
    parent: Message

  DeliveryReceipt:
    parent: Response
    fields:
      msg_id: string
      node_id: string
      delivery_state: DeliveryState
      seen_ts: optional float
      exec_ts: optional float
      error_code: optional string

  MessageTransferResult:
    parent: Response
    fields:
      target_count: int = 0
      bytes_sent: int = 0
      delivery_state: optional DeliveryState
      error: optional string
