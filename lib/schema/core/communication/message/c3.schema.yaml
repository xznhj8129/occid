version: 1
type: schema
package: c3
root: CommandMessage
tags:
  - core

models:
  CommandMessage:
    description: Message whose payload directs action
    semantic_role: ontology
    parent: Message
    fields:
      command: Command

  HumanTextMessage:
    semantic_role: specialization
    parent: Message
    fields:
      message_id: optional string
      conversation_id: optional string
      reply_to_id: optional string
      sender_uid: optional UID
      sender_name: optional string
      destination_uid: optional UID
      destination_group: optional string
      kind: optional string
      message: string
      position: optional GlobalPosition
      targets: list[MessageTarget]
