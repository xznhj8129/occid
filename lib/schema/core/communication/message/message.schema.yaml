version: 1
type: schema
package: message
root: Message
tags:
  - core

enums:
  DeliveryState:
    - QUEUED = 0
    - SENT
    - RECEIVED
    - ACKED
    - NACKED
    - EXECUTED
    - EXPIRED
    - DROPPED

  ReplyAck:
    - ACK = 0
    - RECEIVED
    - WILCO

  AckMode:
    - NONE = 0
    - RECEIPT
    - EXECUTION
    - BOTH

  QosTier:
    - BULK = 0
    - ROUTINE
    - URGENT
    - CRITICAL

  MessagePriority:
    - ROUTINE = 0
    - PRIORITY
    - IMMEDIATE
    - FLASH

  RouteMode:
    - DIRECT = 0
    - RELAY
    - STORE_FORWARD
    - FLOOD

  ConflictPolicy:
    - LAST_WRITE = 0
    - AUTHORITY_WINS
    - VECTOR_CLOCK
    - MANUAL

models:
  Message:
    description: Transmitted envelope plus payload
    parent: Communication
    variants:
      - C3
      - ISR
      - Telemetry
      - Response

  RetryProfile:
    fields:
      max_attempts: int = 0
      base_delay_ms: int = 0
      backoff_factor: float = 1.0
      jitter_pct: float = 0.0

  RouteHint:
    fields:
      next_hop: optional string
      hop_limit: optional int
      preferred_relays: list[NodeRef]
      avoid_nodes: list[NodeRef]

  MessageEnvelope:
    parent: Message
    fields:
      msg_id: string
      msg_type: string
      src: string
      dst: string
      ts: float
      conversation_id: optional string
      ttl_s: optional float
      qos: QosTier = ROUTINE
      priority: MessagePriority = ROUTINE
      ack_mode: AckMode = RECEIPT
      route_mode: RouteMode = DIRECT
      route_hint: optional RouteHint
      retry: optional RetryProfile

  MessageTarget:
    parent: Message
    fields:
      target_id: optional string
      target_type: optional string
      callsign: optional string
      address: optional NetworkAddress
