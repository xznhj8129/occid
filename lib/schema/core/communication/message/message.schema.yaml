version: 1
type: schema
package: message
root: Message
tags:
  - core

enums:
  DeliveryState:
    - QUEUED = 0
    - SENT
    - RECEIVED
    - ACKED
    - NACKED
    - EXECUTED
    - EXPIRED
    - DROPPED

  ReplyAck:
    - ACK = 0
    - RECEIVED
    - WILCO

  AckMode:
    - NONE = 0
    - RECEIPT
    - EXECUTION
    - BOTH

  QosTier:
    - BULK = 0
    - ROUTINE
    - URGENT
    - CRITICAL

  MessagePriority:
    - ROUTINE = 0
    - PRIORITY
    - IMMEDIATE
    - FLASH

  RouteMode:
    - DIRECT = 0
    - RELAY
    - STORE_FORWARD
    - FLOOD

  ConflictPolicy:
    - LAST_WRITE = 0
    - AUTHORITY_WINS
    - VECTOR_CLOCK
    - MANUAL

models:
  Message:
    description: Transmitted envelope plus payload
    parent: Communication
    variants:
      - CommandMessage
      - TelemetryMessage
      - ObservationMessage
      - ResponseMessage
    fields:
      src: MessageTarget
      dst: MessageTarget
      ts: Timestamp
      priority: MessagePriority
      seq: int

  MessageTarget:
    fields:
      target_id: StringID

  ResponseMessage:
    description: Message whose payload acknowledges, rejects, reports delivery, returns data, or reports errors
    parent: Message
    variants:
      - DeliveryReceipt
      - MessageTransferResult
    fields:
      seq_reply: int

  DeliveryReceipt:
    parent: ResponseMessage
    fields:
      node_id: StringID
      delivery_state: DeliveryState
      seen_ts: optional float
      exec_ts: optional float
      error_code: optional string

  MessageTransferResult:
    parent: ResponseMessage
    fields:
      target_count: int = 0
      bytes_sent: int = 0
      delivery_state: optional DeliveryState
      error: optional string
