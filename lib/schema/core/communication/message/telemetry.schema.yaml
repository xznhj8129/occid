version: 1
type: schema
package: telemetry
root: TelemetryMessage
tags:
  - core

models:
  TelemetryMessage:
    description: Message whose payload reports sender or asset state
    semantic_role: ontology
    parent: Message
    fields:
      state: State

  UAVTelemetryMessage:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      state: TelemetryState

  CapabilityAdvert:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      node_id: StringID
      roles: list[CapabilityRole]
      link_ids: list[string]
      sensor_ids: list[string]
      payload_ids: list[string]

  StateDelta:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      entity_id: StringID
      changed_fields: map[string, State]

  TransportCounters:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      rx_count: int = 0
      tx_count: int = 0
      parse_error_count: int = 0
      dropped_count: int = 0

  TransportError:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      error: NetworkError
      source_address: optional NetworkAddress
      payload: optional ProtocolPayload
