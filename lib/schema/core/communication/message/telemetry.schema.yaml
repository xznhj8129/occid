version: 1
type: schema
package: telemetry
root: Telemetry
tags:
  - core

models:
  Telemetry:
    description: Message whose payload reports sender or asset state
    parent: Message

  CapabilityAdvert:
    parent: Telemetry
    fields:
      node_id: string
      roles: list[CapabilityRole]
      link_ids: list[string]
      sensor_ids: list[string]
      payload_ids: list[string]

  StateDelta:
    parent: Telemetry
    fields:
      entity_id: string
      changed_fields: list[string]
      source: optional string

  TransportCounters:
    parent: Telemetry
    fields:
      rx_count: int = 0
      tx_count: int = 0
      parse_error_count: int = 0
      dropped_count: int = 0

  TransportError:
    parent: Telemetry
    fields:
      error: string
      source_address: optional NetworkAddress
      payload: optional ProtocolPayload
