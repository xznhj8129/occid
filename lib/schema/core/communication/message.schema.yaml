version: 1
type: schema
name: message
description: "Discrete typed envelopes for communication feed data."
tags:
  - core
root: communication

enums:
  MeshtasticPort:
    - TEXT_MESSAGE = 0
    - POSITION
    - PRIVATE

models:
  Message:
    parent: Communication
    variants:
      - C3
      - ISR
      - Telemetry
      - Response

  C3:
    parent: Message

  ISR:
    parent: Message

  Telemetry:
    parent: Message

  Response:
    parent: Message

  MessageEnvelope:
    parent: Message
    fields:
      msg_id: string
      msg_type: string
      src: string
      dst: string
      ts: float
      conversation_id: optional string
      ttl_s: optional float
      qos: QosTier = ROUTINE
      priority: MessagePriority = ROUTINE
      ack_mode: AckMode = RECEIPT
      route_mode: RouteMode = DIRECT
      route_hint: optional RouteHint
      retry: optional RetryProfile

  DeliveryReceipt:
    parent: Response
    fields:
      msg_id: string
      node_id: string
      delivery_state: DeliveryState
      seen_ts: optional float
      exec_ts: optional float
      error_code: optional string

  CapabilityAdvert:
    parent: Telemetry
    fields:
      node_id: string
      roles: list[CapabilityRole]
      link_ids: list[string]
      sensor_ids: list[string]
      payload_ids: list[string]

  StateDelta:
    parent: Telemetry
    fields:
      entity_id: string
      changed_fields: list[string]
      source: optional string
      confidence: optional ConfidenceLevel

  MessageTarget:
    parent: Message
    fields:
      target_id: optional string
      target_type: optional string
      callsign: optional string
      address: optional NetworkAddress

  ProtocolEventMessage:
    parent: ISR
    fields:
      uid: string
      event_type: string
      event_method: optional string
      callsign: optional string
      time_text: optional string
      start_text: optional string
      stale_text: optional string
      position: optional GlobalPosition
      uncertainty: optional LocationUncertainty
      detail: optional ProtocolPayload
      source_address: optional NetworkAddress
      targets: list[MessageTarget]

  HumanTextMessage:
    parent: C3
    fields:
      sender_id: optional string
      sender_name: optional string
      destination_id: optional string
      destination_group: optional string
      kind: optional string
      message: string
      position: optional GlobalPosition
      targets: list[MessageTarget]

  MessageTransferResult:
    parent: Response
    fields:
      target_count: int = 0
      bytes_sent: int = 0
      delivery_state: optional DeliveryState
      error: optional string

  TransportCounters:
    parent: Telemetry
    fields:
      rx_count: int = 0
      tx_count: int = 0
      parse_error_count: int = 0
      dropped_count: int = 0

  TransportError:
    parent: Telemetry
    fields:
      error: string
      source_address: optional NetworkAddress
      payload: optional ProtocolPayload

  MeshReceiveMetrics:
    parent: Telemetry
    fields:
      snr: optional float
      rssi: optional float
      hop_limit: optional int
      rx_time: optional float

  MeshPositionSample:
    parent: Telemetry
    fields:
      position: GlobalPosition
      position_ts: optional float
      pdop: optional float
      ground_speed: optional float
      ground_track: optional float
      sats_in_view: optional int

  MeshtasticMessage:
    parent: Message
    fields:
      sender_id: string
      sender_name: optional string
      destination_id: string
      port: optional MeshtasticPort
      private_port_num: optional int
      text: optional string
      payload: optional bytes
      position: optional MeshPositionSample
      metrics: optional MeshReceiveMetrics

  NodeHeartbeat:
    parent: Telemetry
    fields:
      node_id: string
      last_seen_ts: float
      node_state: optional MeshNodeState
      rssi: optional float
      snr: optional float
      hop_limit: optional int
      link_condition: optional LinkCondition
      connection_status: optional ConnectionStatus
