version: 1
type: schema
package: mesh
root: MeshView
tags:
  - core

enums:
  MeshNodeState:
    - UNKNOWN = 0
    - ACTIVE
    - DEGRADED
    - LOST

  MeshtasticPort:
    - TEXT_MESSAGE = 0
    - POSITION
    - PRIVATE

models:
  MeshLink:
    parent: Link
    fields:
      src_id: StringID
      dst_id: StringID
      condition: LinkCondition
      connection_status: optional ConnectionStatus
      latency_ms: optional float
      packet_loss: optional float
      updated_ts: optional float

  MeshNode:
    parent: Node
    fields:
      node_id: StringID
      state: optional MeshNodeState
      last_seen_ts: optional float
      position: optional GlobalPosition
      rssi: optional float
      snr: optional float
      hop_limit: optional int
      link_condition: optional LinkCondition
      connection_status: optional ConnectionStatus
      roles: list[CapabilityRole]

  MeshView:
    description: Current observed mesh topology and node/link state
    parent: Network
    fields:
      epoch: int = 0
      nodes: map[string, MeshNode]
      links: list[MeshLink]
      partition_id: optional StringID

  MeshtasticMessage:
    parent: Message
    fields:
      sender_id: StringID
      sender_name: optional string
      destination_id: StringID
      port: optional MeshtasticPort
      private_port_num: optional int
      text: optional string
      payload: optional bytes
      position: optional MeshPositionSample
      metrics: optional MeshReceiveMetrics

  MeshReceiveMetrics:
    parent: TelemetryMessage
    fields:
      snr: optional float
      rssi: optional float
      hop_limit: optional int
      rx_time: optional float

  MeshPositionSample:
    parent: TelemetryMessage
    fields:
      position: GlobalPosition
      position_ts: optional float
      pdop: optional float
      ground_speed: optional float
      ground_track: optional float
      sats_in_view: optional int

  NodeHeartbeat:
    parent: TelemetryMessage
    fields:
      node_id: StringID
      last_seen_ts: float
      node_state: optional MeshNodeState
      rssi: optional float
      snr: optional float
      hop_limit: optional int
      link_condition: optional LinkCondition
      connection_status: optional ConnectionStatus
