version: 1
type: schema
name: mesh
description: "Mesh communication node records."
tags:
  - core
root: node

enums:
  MeshNodeState:
    - UNKNOWN = 0
    - ACTIVE
    - DEGRADED
    - LOST

models:
  MeshNode:
    parent: Node
    fields:
      node_id: string
      state: optional MeshNodeState
      last_seen_ts: optional float
      position: optional GlobalPosition
      rssi: optional float
      snr: optional float
      hop_limit: optional int
      link_condition: optional LinkCondition
      connection_status: optional ConnectionStatus
      roles: list[CapabilityRole]
