version: 1
type: schema
package: mesh
root: MeshView
tags:
  - core

enums:
  MeshNodeState:
    - UNKNOWN = 0
    - ACTIVE
    - DEGRADED
    - LOST

  MeshtasticPort:
    - TEXT_MESSAGE = 0
    - POSITION
    - PRIVATE

models:
  MeshLink:
    description: Observed state of a link between two mesh nodes
    semantic_role: specialization
    parent: LinkState
    fields:
      src_id: StringID
      dst_id: StringID
      updated_ts: optional float

  MeshNode:
    semantic_role: specialization
    parent: Node
    fields:
      node_id: StringID
      state: optional MeshNodeState
      last_seen_ts: optional float
      position: optional GlobalPosition
      link_state: optional LinkState
      roles: list[CapabilityRole]

  MeshView:
    description: Current observed mesh topology and node/link state
    semantic_role: specialization
    parent: Network
    fields:
      epoch: int = 0
      nodes: map[string, MeshNode]
      links: list[MeshLink]
      partition_id: optional StringID

  MeshtasticMessage:
    semantic_role: specialization
    parent: Message
    fields:
      sender_id: StringID
      sender_name: optional string
      destination_id: StringID
      port: optional MeshtasticPort
      private_port_num: optional int
      text: optional string
      payload: optional bytes
      position: optional MeshPositionSample
      metrics: optional MeshReceiveMetrics

  MeshReceiveMetrics:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      state: LinkState

  MeshPositionSample:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      state: LocationState

  NodeHeartbeat:
    semantic_role: specialization
    parent: TelemetryMessage
    fields:
      node_id: StringID
      last_seen_ts: float
      node_state: optional MeshNodeState
      state: LinkState
