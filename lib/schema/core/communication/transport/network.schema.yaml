version: 1
type: schema
name: network
description: "Graph topology of information flow"
tags:
  - core
root: transport

enums:
  AddressKind:
    - IPV4 = 0
    - IPV6
    - MAC
    - CALLSIGN
    - URI

models:
  Network:
    parent: Transport

  RouteHint:
    parent: Network
    fields:
      next_hop: optional string
      hop_limit: optional int
      preferred_relays: list[NodeRef]
      avoid_nodes: list[NodeRef]

  NetworkAddress:
    parent: Network
    fields:
      kind: AddressKind
      value: string
      port: optional int

  MeshView:
    parent: Network
    fields:
      epoch: int = 0
      nodes: map[string, MeshNode]
      links: list[MeshLink]
      partition_id: optional string
