version: 1
type: schema
package: record
root: RecordMeta
tags:
  - core

models:
  RecordMeta:
    description: Persistent-record instance identity, revision, timestamps, origin, classification, and provenance metadata
    parent: Struct
    fields:
      # Identifies this persisted record instance or revision. Model-specific IDs
      # identify the stable logical operational object across record revisions.
      record_id: StringID
      revision: int = 0
      created_ts: float
      updated_ts: float
      origin_system: string
      classification: optional string
      provenance: list[string]
