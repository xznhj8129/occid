version: 1
type: schema
package: record
root: Record
tags:
  - core

models:
  Record: 
    # Note: do we even need this? Why do we need records of things? Isn't the stored data itself a record?
    description: Persistent Record UID, class-local Record ID, revision, timestamps, origin, classification, and provenance metadata
    semantic_role: representation
    parent: Struct
    fields:
      # Record identity is separate from the logical Entity/Task/Track/etc.
      # described by the record. UID is global; ID is local to the Record class.
      uid: UID
      id: IntID(Record)
      revision: int = 0
      created_ts: float
      updated_ts: float
      origin_system: string
      provenance: list[string]
