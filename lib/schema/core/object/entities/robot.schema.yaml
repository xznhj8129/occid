version: 1
type: schema
package: robot
root: Robot
tags:
  - core

enums:
  VideoProtocol:
    - RTSP = 0
    - RTMP
    - SRT
    - HLS
    - UDP
    - TCP
    - WEBRTC

  TelemetryType:
    - MSP = 0
    - MAVLINK
    - CRSF
    - MANUAL_ENTRY

  RCType:
    - PWM = 0
    - CRSF
    - MAVLINK
    - MSP

  UAVRadioType:
    - ELRS = 0
    - MLRS
    - SIK
    - WIFI_DUALBAND
    - MESHTASTIC
    - WIFI_915

  AutopilotType:
    - BETAFLIGHT = 0
    - INAV
    - ARDUPILOT
    - PX4
    - CUSTOM

  RobotControlMode:
    - MANUAL = 0
    - REMOTE
    - ASSISTED
    - PROGRAMMED
    - AUTONOMOUS
    - ROGUE

  ControlAxis:
    - ROLL = 0
    - PITCH
    - YAW
    - THROTTLE
    - AUX

  GimbalAxis:
    - ROLL = 0
    - PITCH
    - YAW

models:
  Robot:
    parent: Machine
    description: Robot entities and control surfaces
    fields:
      robot_control: optional RobotController
      remote_control: RemoteControlSchema

  GroundRobot:
    parent: GroundMachine
    fields:
      machine_type: MachineType = ROBOT

  VideoConfigSchema:
    parent: Parameter
    fields:
      protocol: optional VideoProtocol
      port: optional int
      stream_url: optional string
      overlay_url: optional string
      webrtc_url: optional string
      overlay_webrtc_url: optional string
      hls_url: optional string

  ReceiverConfig:
    parent: Parameter
    fields:
      rx_min_usec: int
      rx_max_usec: int
      rx_center_usec: int

  ChannelMapEntry:
    parent: Parameter
    fields:
      axis: ControlAxis
      source_channel: int
      output_channel: optional int
      label: optional string

  ModeRange:
    parent: Parameter
    fields:
      mode_id: optional int
      mode_name: optional string
      channel: int
      range: NumericRange

  RobotController:
    parent: Parameter
    fields:
      control_modes: optional RobotControlMode
      autopilot_type: AutopilotType
      autopilot_firmware: FirmwareInfo

  RemoteControlSchema:
    parent: Interface
    fields:
      rc_link: string = ""
      vid_link: string = ""
      ctrl_video_sep: optional bool
      telemetry: optional TelemetryState
      rc_telemetry: optional ControlAxisSet
      control_input: optional ControlAxisSet
      control_output: optional ControlAxisSet
      control_override: optional ControlOverride
      receiver_config: optional ReceiverConfig
      channel_map: list[ChannelMapEntry]
      mode_ranges: list[ModeRange]

  ObserverSource:
    parent: Interface
    description: Remote imagery/video observation source with camera geometry and telemetry links
    fields:
      name: string
      objtype: EntitySubtype = AIR_ROBOT
      active: bool = true
      dbid: optional StringID
      pos: GlobalPosition
      attitude: EulerAngles
      gimbal_ang: optional EulerAngles
      gimbal_axes: list[GimbalAxis]
      fov_h_deg: optional float
      fov_v_deg: optional float
      media_kind: SensorDataFormat = VIDEO
      video: optional VideoConfigSchema
      video_res: optional tuple[int, int]
      telemetry_type: optional TelemetryType
      telem_port: optional string
      telem_baud: optional int
      commands_allowed: bool = false
      can_zoom: bool = false

  FlightControlState:
    parent: Guidance
    fields:
      armed: optional bool
      in_air: optional bool
      override_active: optional bool
      failsafe: optional bool
      active_modes: list[int]
      active_mode_names: list[string]
      nav_state_code: optional int
      flight_mode: optional string
      attitude_setpoint: optional ControlAttitudeSetpoint
      navigation_validity: optional NavigationValidity
      readiness: optional NavReadinessState
      runtime_load: optional RuntimeLoadState
