version: 1
type: schema
package: object
root: Object
tags:
  - core
models:
  Object:
    description: Atoms
    parent: Root
    variants:
      - Entity
      - Set
      - Item
      - Location
    fields:
      capabilities: optional list[Capability]

  Set:
    parent: Object
    variants:
      - Organization
      - Collection
      - Cluster

  Collection:
    description: Informal, adhoc grouping of objects with common purpose, appartnance, affinity or goal
    parent: Set

  Cluster:
    description: A set of objects united only by criterion
    parent: Set

  Item:
    description: A discrete bounded non-agent object
    parent: Object
    variants:
      - Equipment
      - Component
      - Payload

  Equipment:
    parent: Item

  Component:
    parent: Item

  Location:
    description: Physical-world feature, named location, site, or bounded place.
    parent: Object

  GeoJsonFeature:
    parent: Location
    fields:
      id: StringID
      type: const string = "Feature"
      geometry: GeoJsonGeometry
      properties: map[string, MetadataValue]
      bbox: optional BoundingBox

  GeoJsonFeatureCollection:
    parent: Collection
    fields:
      features: list[GeoJsonFeature]
      bbox: optional BoundingBox

  MissionPoi:
    description: Named operational point of interest with stable identity and a concrete global position
    parent: Location
    fields:
      uid: StringID
      name: string
      pos: GlobalPosition
      origin: string
      cot: optional string
      added_ts: optional float
      stale_after_s: optional float
      url: optional string
