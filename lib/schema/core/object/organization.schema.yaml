version: 1
type: schema
package: organization
root: Organization
tags:
  - core

enums:
  OrgLevel:
    - UNIT = 0
    - GROUP

  OrgType:
    - CIV = 0
    - COMMERCIAL
    - NGO
    - GOVT

  OrgTopology:
    - NONE = 0
    - HIERARCHICAL
    - CELLULAR

models:
  Organization:
    description: A structured collection of organized entities and/or subordinate organizations with common command and control
    semantic_role: concept
    parent: Set
    variants:
      - Group
      - Unit
    fields:
      record: Record
      uid: UID
      id: IntID(Organization)
      name: optional string
      unit_code: optional string
      callsign: optional string
      org_level: OrgLevel
      org_rank: int
      org_type: optional OrgType
      topology: optional OrgTopology
      elements: list
      roster: Roster
      leases: list[AttachmentLease]

  Group:
    semantic_role: representation
    parent: Organization
    fields:
      orglevel: OrgLevel = GROUP

  Unit:
    semantic_role: representation
    parent: Organization
    fields:
      orglevel: OrgLevel = UNIT

  OrgRole:
    semantic_role: representation
    parent: Control
    fields:
      role: string # temporary
      authority: Authority
      assignment: Assignment
      rank: int # temporary

  Roster:
    semantic_role: representation
    parent: Control
    fields:
      roster: map[UID, OrgRole]