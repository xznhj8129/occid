models:
  Organization:
    description: A structured collection of organized entities and/or subordinate organizations with common command and control
    semantic_role: concept
    parent: Set

    fields:
      record: Record
      uid: UID
      id: IntID(Organization)
      name: optional string
      unit_code: optional string
      callsign: optional string
      org_level: OrgLevel
      org_type: optional OrgType
      topology: optional OrgTopology
      definition_uid: optional UID
      member_uids: optional list[UID]
      roster: optional Roster

  Group:
    semantic_role: representation
    parent: Organization
    fields:
      org_level: OrgLevel = GROUP

  Unit:
    semantic_role: representation
    parent: Organization
    fields:
      org_level: OrgLevel = UNIT

  Side:
    description: Named operational side or alignment grouping; relative friendly/hostile identity is modeled separately from side membership
    semantic_role: concept
    parent: Set
    fields:
      record: Record
      uid: UID
      id: IntID(Side)
      name: optional string
      description: optional PlainText
      member_uids: list[UID]

  Coalition:
    description: Operational side composed of multiple organizations or other sides acting together
    semantic_role: representation
    parent: Side

  OrgRole:
    semantic_role: representation
    parent: Control
    fields:
      role: Role
      authority: Authority
      assignment: Assignment

  Roster:
    semantic_role: representation
    parent: Control
    fields:
      roster: map[UID, OrgRole]

  OrganizationState:
    description: Time-indexed mutable organizational condition, membership, location, readiness, holdings, and roster separated from organization identity
    semantic_role: representation
    parent: SubjectState
    fields:
      position: optional LocationState
      operational_status: optional OrganizationOperationalState
      readiness: optional ReadinessLevel
      inventory: optional InventoryState
      health: optional HealthSnapshot

  MilitaryOrg:
    semantic_role: representation
    parent: Organization

    fields:
      category: optional NATOUnitCategory
      resource_requirements: list[ResourceRequirement]

  FlyingOrg:
    semantic_role: representation
    parent: MilitaryOrg
    fields:
      category: NATOUnitCategory
      op_domain: OperationalDomain = AIR

  OrbatOrg:
    semantic_role: representation
    parent: MilitaryOrg

    fields:
      org_layout: OrgLayout = ORBAT
      topology: OrgTopology = HIERARCHICAL
      category: NATOUnitCategory
      size: OOBSize
      op_domain: OperationalDomain
      taskforce: optional bool
      spacing: DistanceMeters

  GroundOrbatOrg:
    semantic_role: representation
    parent: OrbatOrg
    fields:
      category: NATOUnitCategory
      op_domain: OperationalDomain = LAND
      combat_domain: OperationalDomain

  MilitaryStrength:
    description: Reported qualitative military strength when exact resource holdings are unavailable or inappropriate; exact counts remain ResourceHolding data
    semantic_role: representation
    parent: Struct
    fields:
      overall: optional StrengthCondition
      personnel: optional StrengthCondition
      equipment: optional StrengthCondition

  MilitaryOrganizationState:
    description: Military-specific changing organization state layered on generic OrganizationState
    semantic_role: representation
    parent: OrganizationState
    fields:
      reinforcement_status: optional ReinforcementStatus
      strength: optional MilitaryStrength
