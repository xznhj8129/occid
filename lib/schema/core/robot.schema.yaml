version: 1
type: schema
package: robot
root: Robot
tags:
  - core

enums:
  VideoProtocol:
    - RTSP = 0
    - RTMP
    - SRT
    - HLS
    - UDP
    - TCP

  SerialTelemetryType:
    - MSP = 0
    - MAVLINK

  RCType:
    - PWM = 0
    - CRSF
    - MAVLINK
    - MSP

  UAVRadioType:
    - ELRS = 0
    - MLRS
    - SIK
    - WIFI_DUALBAND
    - MESHTASTIC
    - WIFI_915

  AutopilotType:
    - BETAFLIGHT = 0
    - INAV
    - ARDUPILOT
    - PX4
    - CUSTOM

  RobotControlMode:
    - MANUAL = 0
    - REMOTE
    - ASSISTED
    - PROGRAMMED
    - AUTONOMOUS
    - ROGUE

  ControlAxis:
    - ROLL = 0
    - PITCH
    - YAW
    - THROTTLE
    - AUX

models:
  Robot:
    parent: Machine
    description: Robot entities and control surfaces

  GroundRobot:
    parent: GroundMachine
    fields:
      machine_type: MachineType = ROBOT
      robot_control: optional RobotControlSchema
      remote_control: RemoteControlSchema

  AirRobot:
    parent: AirMachine
    fields:
      machine_type: MachineType = ROBOT
      robot_control: optional RobotControlSchema
      remote_control: RemoteControlSchema

  Parameters:
    description: Current operating configuration or control regime
    parent: Property

  VideoConfigSchema:
    parent: Parameters
    fields:
      protocol: optional VideoProtocol
      port: optional int
      stream_url: optional string
      overlay_url: optional string
      webrtc_url: optional string
      overlay_webrtc_url: optional string
      hls_url: optional string

  ReceiverConfig:
    parent: Parameters
    fields:
      rx_min_usec: int
      rx_max_usec: int
      rx_center_usec: int

  ChannelMapEntry:
    parent: Parameters
    fields:
      axis: ControlAxis
      source_channel: int
      output_channel: optional int
      label: optional string

  ModeRange:
    parent: Parameters
    fields:
      mode_id: optional int
      mode_name: optional string
      channel: int
      range: NumericRange

  RobotControlSchema:
    parent: Parameters
    fields:
      control_modes: optional RobotControlMode
      autopilot: optional bool
      autopilot_controller_model: string = ""
      autopilot_type: optional AutopilotType
      autopilot_fw: optional FirmwareInfo

  RemoteControlSchema:
    parent: Interface
    fields:
      links: map[string, LinkSchema]
      rc_link: string = ""
      vid_link: string = ""
      ctrl_video_sep: optional bool
      telemetry: optional TelemetryState
      rc_telemetry: optional ControlAxisSet
      control_input: optional ControlAxisSet
      control_output: optional ControlAxisSet
      control_override: optional ControlOverride
      receiver_config: optional ReceiverConfig
      channel_map: list[ChannelMapEntry]
      mode_ranges: list[ModeRange]

  FlightControlState:
    parent: Guidance
    fields:
      armed: optional bool
      in_air: optional bool
      override_active: optional bool
      failsafe: optional bool
      active_modes: list[int]
      active_mode_names: list[string]
      nav_state_code: optional int
      flight_mode: optional string
      attitude_setpoint: optional ControlAttitudeSetpoint
      mission_progress: optional MissionProgress
      navigation_validity: optional NavigationValidity
      readiness: optional VehicleReadinessState
      controller_identity: optional FlightControllerIdentity
      runtime_load: optional RuntimeLoadState
