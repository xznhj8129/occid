version: 1
type: schema
package: condition
root: Condition
tags:
  - core

enums:
  BooleanOperator:
    - NONE = 0
    - NOT
    - AND
    - OR
    - XOR
    - NAND
    - NOR
    - XNOR

models:
  Condition:
    description: Reusable predicate logic evaluated against object, system, or process facts; it describes logic rather than the mutable state of evaluating that logic
    semantic_role: concept
    parent: Data
    variants:
      - Predicate
      - BooleanLogic

  Predicate:
    description: Atomic condition leaf; concrete predicate schemas define operands and comparison semantics instead of embedding free-form expressions
    semantic_role: type
    parent: Condition
    fields:
      subject_ref: optional UID

  BooleanLogic:
    description: Boolean composition of Conditions; NONE is identity and NOT is negation for a single term, while the remaining operators combine the term set
    semantic_role: type
    parent: Condition
    fields:
      operator: BooleanOperator
      terms: list[Condition]
