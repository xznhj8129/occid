version: 1
type: schema
name: relationship
description: "Nature of relations, ownership, provenance, link"
tags:
  - core
root: properties

models:
  Relationship:
    parent: Properties

  RelationSchema:
    parent: Relationship
    fields:
      src_id: string
      dst_id: string
      rel_kind: string
      since_ts: optional float
      until_ts: optional float
      confidence: optional ConfidenceLevel
      source: optional string

  EntityComponentRef:
    parent: Relationship
    fields:
      component_id: string
      component_type: optional string
      label: optional string
