version: 1
type: schema
name: properties
description: "A generally fixed characteristic, classification, disposition, or capability that defines an object, but is not merely its momentary condition"
tags:
  - core
root: information
branches:
  - identity
  - attributes
  - parameters
  - relationship

models:
  Properties:
    parent: Information
    variants:
      - Identity
      - Attributes
      - Parameters
      - Relationship

  FeaturePropertyValue:
    parent: Properties
    fields:
      text_value: optional string
      int_value: optional int
      float_value: optional float
      bool_value: optional bool

  FeatureProperty:
    parent: Properties
    fields:
      key: string
      value: FeaturePropertyValue
