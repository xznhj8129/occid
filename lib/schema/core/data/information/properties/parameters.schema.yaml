version: 1
type: schema
package: parameters
root: Parameters
tags:
  - core

enums:
  VideoProtocol:
    - RTSP = 0
    - RTMP
    - SRT
    - HLS
    - UDP
    - TCP

  SerialTelemetryType:
    - MSP = 0
    - MAVLINK

  RCType:
    - PWM = 0
    - CRSF
    - MAVLINK
    - MSP

  UAVRadioType:
    - ELRS = 0
    - MLRS
    - SIK
    - WIFI_DUALBAND
    - MESHTASTIC
    - WIFI_915

  AutopilotType:
    - BETAFLIGHT = 0
    - INAV
    - ARDUPILOT
    - PX4
    - CUSTOM

  RobotControlMode:
    - MANUAL = 0
    - REMOTE
    - ASSISTED
    - PROGRAMMED
    - AUTONOMOUS
    - ROGUE

  ControlAxis:
    - ROLL = 0
    - PITCH
    - YAW
    - THROTTLE
    - AUX

models:
  Parameters:
    description: "Current operating configuration or control regime"
    parent: Properties

  VideoConfigSchema:
    parent: Parameters
    fields:
      protocol: optional VideoProtocol
      port: optional int
      stream_url: optional string
      overlay_url: optional string
      webrtc_url: optional string
      overlay_webrtc_url: optional string
      hls_url: optional string

  ReceiverConfig:
    parent: Parameters
    fields:
      rx_min_usec: int
      rx_max_usec: int
      rx_center_usec: int

  ChannelMapEntry:
    parent: Parameters
    fields:
      axis: ControlAxis
      source_channel: int
      output_channel: optional int
      label: optional string

  ModeRange:
    parent: Parameters
    fields:
      mode_id: optional int
      mode_name: optional string
      channel: int
      range: NumericRange

  RobotControlSchema:
    parent: Parameters
    fields:
      control_modes: optional RobotControlMode
      autopilot: optional bool
      autopilot_controller_model: string = ""
      autopilot_type: optional AutopilotType
      autopilot_fw: optional FirmwareInfo
