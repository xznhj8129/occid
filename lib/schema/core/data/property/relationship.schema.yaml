version: 1
type: schema
package: relationship
root: Relationship
tags:
- core

enums:
  RelationshipKind:
  - MEMBER_OF = 0
  - COMMANDS
  - OPERATES
  - SUPPORTS
  - OWNS

  SpatialRelationKind:
  - CONTAINS = 0
  - WITHIN
  - INTERSECTS
  - OVERLAPS
  - TOUCHES
  - CROSSES
  - CONNECTS

models:
  Relationship:
    description: Nature of relations, ownership, provenance, link
    semantic_role: concept
    parent: Property

  DirectedRelationship:
    description: Typed directed semantic relationship between two OCCID objects
    semantic_role: representation
    parent: Relationship
    fields:
      subject_uid: ID
      object_uid: ID
      relation: RelationshipKind
      since_ts: optional Timestamp
      until_ts: optional Timestamp
      confidence: optional ConfidenceLevel
      source: optional string

  EntityComponentRef:
    semantic_role: representation
    parent: Relationship
    fields:
      component_ref: string
      component_type: optional string
      label: optional string

  SpatialRelationship:
    description: Persisted asserted topological relationship between identified spatial objects; subject is related to reference by relation
    semantic_role: representation
    parent: Relationship
    fields:
      uid: ID
      subject_uid: ID
      reference_uid: ID
      relation: SpatialRelationKind