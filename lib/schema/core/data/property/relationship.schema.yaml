version: 1
type: schema
package: relationship
root: Relationship
tags:
  - core

enums:
  RelationshipKind:
    - MEMBER_OF = 0
    - COMMANDS
    - OPERATES
    - SUPPORTS
    - OWNS

  SpatialRelationKind:
    - CONTAINS = 0
    - WITHIN
    - INTERSECTS
    - OVERLAPS
    - TOUCHES
    - CROSSES
    - CONNECTS

models:
  Relationship:
    description: Nature of relations, ownership, provenance, link
    semantic_role: ontology
    parent: Property
    variants:
      - DirectedRelationship
      - EntityComponentRef
      - SpatialRelationship

  DirectedRelationship:
    description: Typed directed semantic relationship between two OCCID objects
    semantic_role: specialization
    parent: Relationship
    fields:
      subject_uid: UID
      object_uid: UID
      relation: RelationshipKind
      since_ts: optional float
      until_ts: optional float
      confidence: optional ConfidenceLevel
      source: optional string

  EntityComponentRef:
    semantic_role: specialization
    parent: Relationship
    fields:
      component_ref: string
      component_type: optional string
      label: optional string

  SpatialRelationship:
    description: Persisted asserted topological relationship between identified spatial objects; subject is related to reference by relation
    semantic_role: specialization
    parent: Relationship
    fields:
      record: RecordMeta
      uid: UID
      id: int
      subject_uid: UID
      reference_uid: UID
      relation: SpatialRelationKind
