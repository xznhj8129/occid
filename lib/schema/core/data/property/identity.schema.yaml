version: 1
type: schema
package: identity
root: Identity
tags:
  - core

models:
  Identity:
    description: Identity bindings and identity-related properties
    semantic_role: concept
    parent: Property
    variants:
      - StringName
      - IdentityBootstrap

  StringName:
    description: Human-readable reference for something
    semantic_role: representation
    parent: Identity
    type: string

  IdentityBootstrap:
    description: Stable Node-centered binding of one deployed Node to the Entity it serves and that Entity's Organization
    semantic_role: representation
    parent: Identity
    fields:
      node_uid: UID
      node_id: IntID(Node)
      entity_uid: UID
      entity_id: IntID(Entity)
      organization_uid: UID
      organization_id: IntID(Organization)
