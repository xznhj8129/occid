version: 1
type: schema
package: execution
root: Execution
tags:
  - core

enums:
  ExecutionPhase:
    - CREATED = 0
    - QUEUED
    - RUNNING
    - SUCCEEDED
    - FAILED
    - CANCELLED

models:
  Execution:
    description: One execution attempt for an assignment, independently tracked across local and external executors
    semantic_role: ontology
    parent: State
    fields:
      record: RecordMeta
      uid: UID
      id: int
      assignment_uid: UID
      executor_uid: UID
      attempt: int = 0
      phase: ExecutionPhase = CREATED
      progress: optional float
      started_at: optional float
      completed_at: optional float
      result: optional MetadataValue
      failure: optional string
      external_job_refs: list[string]

  ExecutionAcceptance:
    description: Executor admission decision for one exact dispatch of an existing Execution; distinct from transport delivery and from execution completion
    semantic_role: specialization
    parent: State
    fields:
      execution_uid: UID
      dispatch_ref: string
      executor_uid: UID
      accepted: bool
      retryable: bool = false
      reason: optional string
      reported_at: float

  ExecutionStatusReport:
    description: Executor report for one exact execution dispatch; may report that no retained status exists and is distinct from transport delivery evidence
    semantic_role: specialization
    parent: State
    fields:
      execution_uid: UID
      dispatch_ref: string
      executor_uid: UID
      found: bool = true
      phase: optional ExecutionPhase
      progress: optional float
      task_delta: optional TaskDelta
      entity_state: optional EntityState
      failure: optional string
      reported_at: float

  TaskDelta:
    description: Time-indexed task-state update; not an assignment definition
    semantic_role: specialization
    parent: State
    fields:
      record: RecordMeta
      task_uid: UID
      task_rev: int = 0
      phase: TaskPhase
      progress: optional float
      owner_uid: optional UID
      updated_ts: float
