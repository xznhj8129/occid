version: 1
type: schema
package: resource
root: Resource
tags:
  - core

enums:
  NATOSupplyClass:
  - CLASS_I = 0
  - CLASS_II
  - CLASS_III
  - CLASS_IV
  - CLASS_V
  - CLASS_VI
  - CLASS_VII
  - CLASS_VIII
  - CLASS_IX
  - CLASS_X

models:
  Resource:
    description: Power, fuel, supply, inventory, payload loadout, capacity, and consumption state.
    semantic_role: concept
    parent: State

  ResourceHolding:
    description: Current quantity of an identified resource definition held by a subject, separated from authorized or required quantity
    semantic_role: representation
    parent: Resource
    fields:
      resource_definition_uid: UID
      on_hand: Quantity
      available: optional Quantity
      committed: optional Quantity

  InventoryState:
    description: Current holdings of independently defined resources
    semantic_role: representation
    parent: Resource
    fields:
      holdings: list[ResourceHolding]

  FuelState:
    description: Current amount and capacity of a consumable fuel resource in an explicitly declared quantity representation
    semantic_role: representation
    parent: Resource
    fields:
      fuel_type: FuelType
      capacity: optional Quantity
      remaining: optional Quantity

  Supplies:
    description: Supply-oriented inventory state retained as a specialization of generic inventory
    semantic_role: representation
    parent: InventoryState
    fields:
      fuel: optional FuelState

  PowerSource:
    semantic_role: representation
    parent: Resource
    fields:
      source_uid: optional UID
      power_type: PowerType
      status: PowerStatus
      remaining_ratio: optional NormalizedRatio

  PowerState:
    semantic_role: representation
    parent: Resource
    fields:
      status: PowerStatus
      sources: list[PowerSource]
      electrical_sources: list[ElectricalResourceState]

  ElectricalResourceState:
    description: Electrical measurements and remaining storage state for one identified electrical resource
    semantic_role: representation
    parent: Resource
    fields:
      source_uid: optional UID
      potential: optional Volts
      current: optional Amperes
      power: optional Watts
      consumed_charge: optional AmpereHours
      consumed_energy: optional WattHours
      remaining_ratio: optional NormalizedRatio
      remaining_charge: optional AmpereHours
      remaining_energy: optional WattHours
      temperature: optional DegreesCelsius

  ResourceTemplate:
    description: Identified definition of a resource kind that can be required, authorized, held, consumed, or assigned
    semantic_role: concept
    parent: Definition
    fields:
      record: Record
      uid: UID
      id: IntID(ResourceTemplate)
      name: optional string
      description: optional PlainText

  EquipmentTemplate:
    description: Template of equipment counted or allocated as a resource; individual physical equipment may additionally exist as Equipment objects
    semantic_role: representation
    parent: ResourceTemplate

  PersonnelTemplate:
    description: Template of a personnel category used for strength, staffing, or resource planning
    semantic_role: representation
    parent: ResourceTemplate

  SupplyTemplate:
    description: Template of a consumable or stock resource with a customary quantity unit
    semantic_role: representation
    parent: ResourceTemplate
    fields:
      quantity_unit: optional QuantityUnit

  ResourceRequirement:
    description: Required or authorized quantity of one resource definition
    semantic_role: representation
    parent: Struct
    fields:
      resource_definition_uid: UID
      quantity: Quantity
      
  MilitarySupplyTemplate:
    description: Military supply definition classified by NATO-style supply class while retaining the generic resource identity and quantity unit
    semantic_role: representation
    parent: SupplyTemplate
    fields:
      supply_class: NATOSupplyClass