version: 1
type: schema
package: input
root: Input
tags:
  - core

models:
  Input:
    description: Current operator or receiver input state and control mapping.
    parent: State

  ControlAxisSet:
    description: Normalized control-axis values independent of the native receiver or flight-controller representation
    parent: Input
    fields:
      roll: optional float
      pitch: optional float
      yaw: optional float
      throttle: optional float
      aux: list[float]

  ControlChannelValue:
    parent: Input
    fields:
      channel_index: int
      value: optional float

  ControlOverride:
    description: Normalized direct control override; endpoint adapters define the exact native mapping and reject unsupported axes
    parent: Input
    fields:
      roll: optional float
      pitch: optional float
      yaw: optional float
      throttle: optional float
      aux: list[ControlChannelValue]

  ControlAttitudeSetpoint:
    description: Attitude and normalized thrust setpoint using radians; frame metadata is optional in the record but control code that depends on frame semantics must require it explicitly
    parent: Input
    fields:
      roll_rad: float
      pitch_rad: float
      yaw_rad: float
      thrust_normalized: float
      body_frame: optional BodyReferenceFrame
      reference_frame: optional InertialReferenceFrame
