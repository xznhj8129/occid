version: 1
type: schema
package: input
root: Input
tags:
  - core

models:
  Input:
    description: Current operator or receiver input state and control mapping.
    semantic_role: representation
    parent: State

  ControlAxisSet:
    description: Normalized control-axis values in the signed range -1.0 to +1.0, independent of the native receiver or flight-controller representation
    semantic_role: representation
    parent: Input
    fields:
      roll: optional float
      pitch: optional float
      yaw: optional float
      throttle: optional float
      aux: list[float]

  ControlChannelValue:
    description: One normalized auxiliary/control channel value in the signed range -1.0 to +1.0 when present
    semantic_role: representation
    parent: Input
    fields:
      channel_index: int
      value: optional float

  ControlOverride:
    description: Normalized direct control override in the signed range -1.0 to +1.0; endpoint adapters define the exact native mapping and reject unsupported axes
    semantic_role: representation
    parent: Input
    fields:
      roll: optional float
      pitch: optional float
      yaw: optional float
      throttle: optional float
      aux: list[ControlChannelValue]

  ControlAttitudeSetpoint:
    description: Attitude and normalized thrust setpoint using radians; frame metadata is optional in the record but control code that depends on frame semantics must require it explicitly
    semantic_role: representation
    parent: Input
    fields:
      roll_rad: float
      pitch_rad: float
      yaw_rad: float
      thrust_normalized: float
      body_frame: optional BodyReferenceFrame
      reference_frame: optional InertialReferenceFrame
