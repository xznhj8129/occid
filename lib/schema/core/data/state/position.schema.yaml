version: 1
type: schema
package: position
root: Position
tags:
  - core

models:
  Position:
    description: "Position in space, address or placement"
    parent: State

  LocationState:
    parent: Position
    fields:
      inertial_frame: optional InertialReferenceFrame
      body_frame: optional BodyReferenceFrame
      position: optional GlobalPosition
      uncertainty: optional LocationUncertainty
      attitude: optional EulerAngles
      altitude: optional AltitudeState
      velocity: optional VelocityVector
      navigation_validity: optional NavigationValidity
      gnss: optional GnssSolution

  SpotterOrigin:
    parent: Position
    fields:
      position: GlobalPosition
      attitude: optional EulerAngles
      look_vector: optional LocalDirection
