version: 1
type: schema
package: resources
root: Resources
tags:
  - core

enums:
  PowerStatus:
    - UNKNOWN = 0
    - NOT_PRESENT
    - OPERATING
    - DISABLED
    - ERROR

  PowerType:
    - UNKNOWN = 0
    - GAS
    - BATTERY
    - SOLAR
    - NUCLEAR

models:
  Resources:
    description: "How much of something something has; power, fuel, food, etc"
    parent: State

  FuelState:
    parent: Resources
    fields:
      fuel_type: FuelType
      capacity: optional float
      remaining: optional float

  SuppliesSchema:
    parent: Resources
    fields:
      fuel: optional FuelState
      stores: list[ItemCount]

  PowerSourceSchema:
    parent: Resources
    fields:
      source_id: string
      power_type: PowerType
      status: PowerStatus
      remaining_pct: optional float

  PowerStateSchema:
    parent: Resources
    fields:
      status: PowerStatus
      sources: list[PowerSourceSchema]
      electrical_sources: list[ElectricalResourceState]

  ElectricalResourceState:
    parent: Resources
    fields:
      source_id: optional string
      battery_id: optional int
      voltage_v: optional float
      current_a: optional float
      power_w: optional float
      consumed_mah: optional float
      consumed_mwh: optional float
      consumed_ah: optional float
      remaining_pct: optional float
      remaining_capacity: optional float
      temperature_deg_c: optional float
      rssi: optional float
