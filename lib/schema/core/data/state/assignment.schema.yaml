version: 1
type: schema
package: assignment
root: Assignment
tags:
  - core

models:
  Assignment:
    description: "Assignments, tasks, plans, missions, stages"
    parent: State

  TaskDelta:
    parent: Assignment
    fields:
      task_id: string
      task_rev: int = 0
      phase: TaskPhase
      progress: optional float
      owner: optional string
      updated_ts: float

  FlightAssignment:
    parent: Assignment
    fields:
      num: int
      unit_id: optional string
      callsign: optional string
      objective_assign: optional int
      wave_n: int = 0
      formation_n: int = 0
      takeoff_time: float = 0.0
