version: 1
type: schema
package: assignment
root: Assignment
tags:
  - core

enums:
  AssignmentStatus:
    - PROPOSED = 0
    - ASSIGNED
    - ACCEPTED
    - ACTIVE
    - COMPLETE
    - REJECTED
    - CANCELLED

  ExecutionPhase:
    - CREATED = 0
    - QUEUED
    - RUNNING
    - SUCCEEDED
    - FAILED
    - CANCELLED

models:
  Assignment:
    description: Explicit binding of a task to an assignee under stated authority and constraints
    parent: State
    fields:
      record: RecordMeta
      assignment_id: StringID
      task_id: StringID
      assignee_id: StringID
      plan_id: optional StringID
      authority: string
      assigned_by: StringID
      assigned_at: float
      accepted_at: optional float
      status: AssignmentStatus = PROPOSED
      constraints: list[Constraint]

  Execution:
    description: One execution attempt for an assignment, independently tracked across local and external executors
    parent: State
    fields:
      record: RecordMeta
      execution_id: StringID
      assignment_id: StringID
      executor_id: StringID
      attempt: int = 0
      phase: ExecutionPhase = CREATED
      progress: optional float
      started_at: optional float
      completed_at: optional float
      result: optional MetadataValue
      failure: optional string
      external_job_refs: list[StringID]

  ExecutionAcceptance:
    description: Executor admission decision for one exact dispatch of an existing Execution; distinct from transport delivery and from execution completion
    parent: State
    fields:
      execution_id: StringID
      dispatch_id: StringID
      executor_id: StringID
      accepted: bool
      retryable: bool = false
      reason: optional string
      reported_at: float

  ExecutionStatusRequest:
    description: Request the latest retained semantic status for one exact execution dispatch without redispatching or re-executing it
    parent: Control
    fields:
      execution_id: StringID
      dispatch_id: StringID
      requester_id: StringID
      requested_at: float

  ExecutionStatusReport:
    description: Executor report for one exact execution dispatch; may carry canonical task and entity state evidence and is distinct from transport delivery evidence
    parent: State
    fields:
      execution_id: StringID
      dispatch_id: StringID
      executor_id: StringID
      phase: ExecutionPhase
      progress: optional float
      task_delta: optional TaskDelta
      entity_state: optional EntityState
      failure: optional string
      reported_at: float

  TaskDelta:
    description: Time-indexed task-state update; not an assignment definition
    parent: State
    fields:
      record: RecordMeta
      task_id: StringID
      task_rev: int = 0
      phase: TaskPhase
      progress: optional float
      owner_id: optional StringID
      updated_ts: float

  FlightAssignment:
    parent: Assignment
    fields:
      num: int
      unit_id: optional StringID
      callsign: optional string
      objective_assign: optional int
      wave_n: int = 0
      formation_n: int = 0
      takeoff_time: float = 0.0
