version: 1
type: schema
package: state
root: State
tags:
  - core

enums:
  ObservationTimeBasis:
    - UNKNOWN = 0
    - UNIX
    - BOOT

models:
  State:
    description: Changing condition of an object, node, link, task, system, or process
    semantic_role: type
    parent: Data

  EntityState: # this really fucking stinks
    description: Time-indexed mutable condition reported for an entity independently of its identity and specification
    semantic_role: representation
    parent: State
    fields:
      record: Record
      subject_uid: UID
      timestamp: float
      position: optional LocationState
      motion: optional VelocityVector
      angular_velocity: optional AngularVelocityVector
      airspeed: optional Airspeed
      flight_control: optional FlightControlState
      power: optional PowerState
      operational_status: optional EntityOperationalState
      lifecycle_status: optional EntityLifecycleStatus
      health: optional HealthSnapshot
      resources: optional Supplies
      link_states: map[string, LinkState]
      control_state: optional ControlLevel
      source_observation_ts: optional Timestamp
      source_time_basis: optional ObservationTimeBasis
      received_ts: optional Timestamp
      published_ts: optional Timestamp
