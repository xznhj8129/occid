version: 1
type: schema
package: observation
root: Observation
tags:
  - core

enums:
  IntelCategory:
    - IMINT = 0
    - ELINT
    - SIGINT
    - MASINT

  ObservationKind:
    - DETECTION = 0
    - TRACK
    - IDENTIFICATION
    - CLASSIFICATION

  ObservedObjectType:
    - PERSONNEL = 0
    - VEHICLES
    - AIRCRAFT
    - INSTALLATION
    - WATERCRAFT
    - ROUTE
    - TRACE_SIGNATURE

  IsrFocusType:
    - POINT = 0
    - AREA
    - TRACK
    - ROUTE
    - TARGET

  EvidenceLevel:
    - SUSPECTED = 0
    - DETECTED
    - OBSERVED
    - CONFIRMED
    - POSITIVE_ID

  TrackState:
    - NEW = 0
    - ACTIVE
    - STALE
    - LOST

  DetectionBoxSpace:
    - IMAGE_PIXEL = 0
    - IMAGE_NORMALIZED
    - BODY_ANGULAR
    - WORLD

models:
  Observation:
    description: External detection, classification, track, signal, spot report, threat, or assessment data
    semantic_role: ontology
    parent: Data
    variants:
      - Detection
      - Classification
      - Track
      - TrackUpdate
      - Assessment
      - IsrObservation

  Classification:
    semantic_role: ontology
    parent: Observation

  Track:
    description: Persistent maintained identity for one correlated observed object or phenomenon
    semantic_role: ontology
    parent: Observation
    fields:
      record: RecordMeta
      uid: UID
      id: int

  Assessment:
    semantic_role: ontology
    parent: Observation
    variants:
      - IsrResult

  Detection:
    description: Assessment that something exists or occurred
    semantic_role: ontology
    parent: Observation

  VisionBox:
    semantic_role: specialization
    parent: Detection
    fields:
      space: DetectionBoxSpace
      bounds: BoundingBox

  VisionDetection:
    semantic_role: specialization
    parent: Detection
    fields:
      detection_ref: optional string
      label: optional string
      class_index: optional int
      confidence: optional float
      box: optional VisionBox
      bearing: optional LocalDirection
      position: optional GlobalPosition
      source_frame_ref: optional string
      attributes: map[string, MetadataValue]

  VisionDetectionFrame:
    semantic_role: specialization
    parent: Detection
    fields:
      record: RecordMeta
      frame_ref: optional string
      sensor_uid: optional UID
      timestamp_us: optional int
      detections: list[VisionDetection]

  IsrObservation:
    semantic_role: specialization
    parent: Observation
    fields:
      record: RecordMeta
      uid: UID
      id: int
      track_uid: optional UID
      sensor_uid: optional UID
      obs_ts: float
      observation_kind: optional ObservationKind
      category: optional IntelCategory
      spotter_origin: optional SpotterOrigin
      position: optional GlobalPosition
      uncertainty: optional LocationUncertainty
      confidence: optional ConfidenceLevel

  IsrParameters:
    semantic_role: specialization
    parent: Struct
    fields:
      focus_type: optional IsrFocusType
      focus_point: optional GlobalPosition
      dwell_s: optional float
      revisit_s: optional float
      sensor_types: list[SensorType]
      sensor_modes: list[SensorMode]
      effect_domains: list[EffectDomain]
      evidence_level: optional EvidenceLevel

  TrackUpdate:
    description: State update about an existing Track; does not define Track identity
    semantic_role: specialization
    parent: Observation
    fields:
      record: RecordMeta
      track_uid: UID
      track_state: optional TrackState
      updated_ts: float
      confidence: optional ConfidenceLevel

  IsrResult:
    semantic_role: specialization
    parent: Assessment
    fields:
      detections: list[IsrObservation]
      track_updates: list[TrackUpdate]
      media: optional list[MediaItemSchema]
      confidence: optional ConfidenceLevel
      observations: list[IsrObservation]
