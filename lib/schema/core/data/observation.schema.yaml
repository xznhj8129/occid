version: 1
type: schema
package: observation
root: Observation
tags:
  - core

enums:
  IntelCategory:
    - IMINT = 0
    - ELINT
    - SIGINT
    - MASINT

  ObservationKind:
    - DETECTION = 0
    - TRACK
    - IDENTIFICATION
    - CLASSIFICATION

  ObservedObjectType:
    - PERSONNEL = 0
    - VEHICLES
    - AIRCRAFT
    - INSTALLATION
    - WATERCRAFT
    - ROUTE
    - TRACE_SIGNATURE

  IsrFocusType:
    - POINT = 0
    - AREA
    - TRACK
    - ROUTE
    - TARGET

  EvidenceLevel:
    - SUSPECTED = 0
    - DETECTED
    - OBSERVED
    - CONFIRMED
    - POSITIVE_ID

  TrackState:
    - NEW = 0
    - ACTIVE
    - STALE
    - LOST

  DetectionBoxSpace:
    - IMAGE_PIXEL = 0
    - IMAGE_NORMALIZED
    - BODY_ANGULAR
    - WORLD
    
models:
  Observation:
    description: External detection, classification, track, signal, spot report, threat, or assessment data
    parent: Data
    variants:
      - Detection
      - Classification
      - Track
      - Assessment
      - IsrObservation

  Classification:
    parent: Observation

  Track:
    parent: Observation
    variants:
      - TrackUpdate
      - IntelTrackSchema

  Assessment:
    parent: Observation
    variants:
      - IsrResult

  Detection:
    description: Assessment that something exists or occurred
    parent: Observation

  VisionBox:
    parent: Detection
    fields:
      space: DetectionBoxSpace
      bounds: BoundingBox

  VisionDetection:
    parent: Detection
    fields:
      detection_id: optional StringID
      label: optional string
      class_id: optional int
      confidence: optional float
      box: optional VisionBox
      bearing: optional LocalDirection
      position: optional GlobalPosition
      source_frame_id: optional StringID
      attributes: map[string, MetadataValue]

  VisionDetectionFrame:
    parent: Detection
    fields:
      frame_id: optional StringID
      sensor_id: optional StringID
      timestamp_us: optional int
      detections: list[VisionDetection]

  IsrObservation:
    parent: Observation
    fields:
      obs_id: StringID
      track_id: optional StringID
      sensor_id: optional StringID
      obs_ts: float
      observation_kind: optional ObservationKind
      category: optional IntelCategory
      spotter_origin: optional SpotterOrigin
      position: optional GlobalPosition
      uncertainty: optional LocationUncertainty
      confidence: optional ConfidenceLevel

  IsrParameters:
    fields:
      focus_type: optional IsrFocusType
      focus_point: optional GlobalPosition
      dwell_s: optional float
      revisit_s: optional float
      sensor_types: list[SensorType]
      sensor_modes: list[SensorMode]
      effect_domains: list[EffectDomain]
      evidence_level: optional EvidenceLevel

  TrackUpdate:
    parent: Track
    fields:
      track_id: StringID
      track_state: optional TrackState
      updated_ts: float
      confidence: optional ConfidenceLevel

  IsrResult:
    parent: Assessment
    fields:
      detections: list[IsrObservation]
      track_updates: list[TrackUpdate]
      media: optional list[MediaItemSchema]
      confidence: optional ConfidenceLevel
      observations: list[IsrObservation]

  IntelTrackSchema:
    parent: Track
    fields:
      schema_id: StringID
      schema_type: string = "INTEL_TRACK"
      created_ts: optional float
      updated_ts: optional float
      origin_system: optional string
      trust_score: optional ConfidenceLevel
      alt_ids: list[StringID]
      entity_flags: list[string]
      faction: optional string
      spotted_time: float
      updated_time: float
      stale_time: float
      track_state: TrackState = NEW
      category: optional IntelCategory
      sensor_id: optional StringID
      spotter_last: optional SpotterOrigin
      position: optional GlobalPosition
      uncertainty: optional LocationUncertainty
      error_m: optional float
      latest_observation: optional IsrObservation
      observations: list[IsrObservation]
