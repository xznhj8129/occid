version: 1
type: schema
package: property
root: Property
tags:
  - core

models:
  Property:
    description: Mostly stable identity, attribute, configuration, classification, display, provenance, and relationship data
    parent: Data
    variants:
      - Identity
      - Attributes
      - Parameters
      - Relationship

  FeaturePropertyValue:
    parent: Property
    fields:
      text_value: optional string
      int_value: optional int
      float_value: optional float
      bool_value: optional bool

  FeatureProperty:
    parent: Property
    fields:
      key: string
      value: FeaturePropertyValue

  Attributes:
    description: Fundamental characteristics, type, form
    parent: Property

  MetadataValue:
    parent: Attributes
    fields:
      text_value: optional string
      int_value: optional int
      float_value: optional float
      bool_value: optional bool

  MetadataEntry:
    parent: Attributes
    fields:
      key: string
      value: MetadataValue

  SymbologySchema:
    parent: Attributes
    fields:
      sidc: optional string
      cot: optional string

  DisplayMeta:
    parent: Attributes
    fields:
      icon_code: optional string
      tint: optional string
      short_label: optional string

  ClassificationSchema:
    parent: Attributes
    fields:
      level: ClassificationLevel
      codewords: list[string]
      release_to: list[string]

  SensorFieldOfView:
    parent: Attributes
    fields:
      horizontal: optional NumericRange
      vertical: optional NumericRange

  Identity:
    description: Fundamental identity, name, ID
    parent: Property

  Identifier:
    parent: Identity
    fields:
      id_type: IdentifierType
      value: string

  HardwareIdentity:
    parent: Identity
    fields:
      hardware_uid: optional string
      legacy_uid: optional string
      vendor_id: optional int
      vendor_name: optional string
      product_id: optional int
      product_name: optional string
      board_info: optional string

  FlightControllerIdentity:
    parent: Identity
    fields:
      api_version: Version
      controller_variant: optional string
      hardware: optional HardwareIdentity
      flight_software: optional FirmwareInfo
      os_software: optional FirmwareInfo

  Relationship:
    description: Nature of relations, ownership, provenance, link
    parent: Property

  RelationSchema:
    parent: Relationship
    fields:
      src_id: string
      dst_id: string
      rel_kind: string
      since_ts: optional float
      until_ts: optional float
      confidence: optional ConfidenceLevel
      source: optional string

  EntityComponentRef:
    parent: Relationship
    fields:
      component_id: string
      component_type: optional string
      label: optional string
