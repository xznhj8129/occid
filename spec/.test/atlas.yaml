version: 1
type: atlas
name: atlas.yaml
includes:
- ontology.yaml
- basis.yaml
- factorizations.yaml
- charts.yaml
charts:

  control_reference_geometry:
    description: Control-side spatial references factored into carrier geometry, purpose, rule intent, and policy coordinates.
    summary:

      carrier_count: 4

      basis_count: 11

      constraint_count: 10

      landmark_count: 22

      projection_count: 18
    basis:

      reference_family:
        description: Functional family applied to a control-side spatial carrier.
        values:
        - ControlMeasure
        - RallyPoint
        - ControlArea
        - Airspace
        - Geofence

      reference_purpose:
        description: Intended operational meaning of a control-side spatial carrier.
        values:
        - Objective
        - Initial
        - Action
        - Linkup
        - Alternate
        - Assembly
        - AttackPosition
        - SupportByFire
        - Boundary
        - Phase
        - Checkpoint
        - ContactPoint
        - Coordination
        - FinalCoordination
        - LimitOfAdvance
        - Release
        - Start
        - Trigger
        - Route
        - Axis
        - DirectionOfAttack
        - KeepIn
        - KeepOut
        - Ditch
        - Loiter

      area_polarity:
        description: Whether a bounded area is an inclusion or exclusion region.
        values:
        - In
        - Out

      response_policy:
        description: Action or policy taken when a rule, trigger, or boundary condition fires.
        values:
        - Warn
        - Report
        - Loiter
        - RTL
        - Land
        - Brake
        - Deny
        - Fence
        - MissionPause

      segment_geometry:
        description: Primitive geometric behavior of a route or path segment.
        values:
        - GreatCircle
        - Rhumbline
        - Straight
        - TurnArc
        - Orbit
        - Hold
        - Approach
        - Departure
        - Missed
        - Emergency

      hold_pattern:
        description: Repeated spatial holding pattern.
        values:
        - Orbit
        - Racetrack
        - FigureEight
        - Hold

      orbit_direction:
        description: Direction of travel within an orbiting hold pattern.
        values:
        - Left
        - Right

      orbit_duration_mode:
        description: Stop condition for an orbit or hold.
        values:
        - UntilCommanded
        - FixedTime
        - ResourceBased

      trigger_channel:
        description: Mechanism by which a trigger becomes true.
        values:
        - Time
        - Position
        - Event
        - Threshold
        - Condition
        - Order

      trigger_actor:
        description: Which side or actor originates an externally caused trigger.
        values:
        - System
        - Friendly
        - Enemy

      deconfliction_dimension:
        description: Dimension along which interference is avoided.
        values:
        - Altitude
        - Temporal
        - Lateral
        - Speed
        - Route
        - Frequency
    carriers:

      Mark:
        path: Class/Control/Reference/Mark
        variables:

          reference_family:
            description: Functional family applied to a control-side spatial carrier.
            values:
            - ControlMeasure
            - RallyPoint

          reference_purpose:
            description: Intended operational meaning of a control-side spatial carrier.
            values:
            - Objective
            - Initial
            - Action
            - Linkup
            - Alternate
            - Checkpoint
            - ContactPoint
            - Release
            - Start
        math:

          ambient_cardinality: 18

          legal_cardinality: 9

          basis_rank: 2

          min_active_rank: 2

          max_active_rank: 2

          optional_variables: []

          always_active_variables:
          - reference_family
          - reference_purpose

      Path:
        path: Class/Control/Reference/Path
        variables:

          reference_family:
            description: Functional family applied to a control-side spatial carrier.
            values:
            - ControlMeasure

          reference_purpose:
            description: Intended operational meaning of a control-side spatial carrier.
            values:
            - Route
            - Axis
            - DirectionOfAttack

          segment_geometry:
            description: Primitive geometric behavior of a route or path segment.
            values:
            - GreatCircle
            - Rhumbline
            - Straight
            - TurnArc
            - Orbit
            - Hold
            - Approach
            - Departure
            - Missed
            - Emergency

          hold_pattern:
            description: Repeated spatial holding pattern.
            values:
            - Orbit
            - Racetrack
            - FigureEight
            - Hold

          orbit_direction:
            description: Direction of travel within an orbiting hold pattern.
            values:
            - Left
            - Right

          orbit_duration_mode:
            description: Stop condition for an orbit or hold.
            values:
            - UntilCommanded
            - FixedTime
            - ResourceBased
        math:

          ambient_cardinality: 1800

          legal_cardinality: 168

          basis_rank: 6

          min_active_rank: 3

          max_active_rank: 6

          optional_variables:
          - hold_pattern
          - orbit_direction
          - orbit_duration_mode

          always_active_variables:
          - reference_family
          - reference_purpose
          - segment_geometry

      Region:
        path: Class/Control/Reference/Region
        variables:

          reference_family:
            description: Functional family applied to a control-side spatial carrier.
            values:
            - ControlMeasure
            - ControlArea
            - Geofence

          reference_purpose:
            description: Intended operational meaning of a control-side spatial carrier.
            values:
            - Objective
            - Assembly
            - AttackPosition
            - SupportByFire
            - KeepIn
            - KeepOut
            - Ditch
            - Loiter

          area_polarity:
            description: Whether a bounded area is an inclusion or exclusion region.
            values:
            - In
            - Out

          response_policy:
            description: Action or policy taken when a rule, trigger, or boundary condition fires.
            values:
            - Warn
            - Report
            - Loiter
            - RTL
            - Land
            - Brake
            - Deny
            - Fence
            - MissionPause
        math:

          ambient_cardinality: 720

          legal_cardinality: 152

          basis_rank: 4

          min_active_rank: 2

          max_active_rank: 4

          optional_variables:
          - area_polarity
          - response_policy

          always_active_variables:
          - reference_family
          - reference_purpose

      Boundary:
        path: Class/Control/Reference/Boundary
        variables:

          reference_family:
            description: Functional family applied to a control-side spatial carrier.
            values:
            - ControlMeasure

          reference_purpose:
            description: Intended operational meaning of a control-side spatial carrier.
            values:
            - Boundary
            - Phase
            - FinalCoordination
            - Trigger

          trigger_channel:
            description: Mechanism by which a trigger becomes true.
            values:
            - Time
            - Position
            - Event
            - Threshold
            - Condition
            - Order

          trigger_actor:
            description: Which side or actor originates an externally caused trigger.
            values:
            - System
            - Friendly
            - Enemy

          deconfliction_dimension:
            description: Dimension along which interference is avoided.
            values:
            - Altitude
            - Temporal
            - Lateral
            - Speed
            - Route
            - Frequency
        math:

          ambient_cardinality: 784

          legal_cardinality: 36

          basis_rank: 5

          min_active_rank: 3

          max_active_rank: 4

          optional_variables:
          - deconfliction_dimension
          - trigger_actor
          - trigger_channel

          always_active_variables:
          - reference_family
          - reference_purpose
    constraints:
    - name: rally_points_are_marks
      carrier: Mark
      when:
        reference_family:
        - RallyPoint
      allow:
        reference_purpose:
        - Objective
        - Initial
        - Action
        - Linkup
        - Alternate
    - name: control_measures_on_marks_are_control_points
      carrier: Mark
      when:
        reference_family:
        - ControlMeasure
      allow:
        reference_purpose:
        - Checkpoint
        - ContactPoint
        - Release
        - Start
    - name: path_control_measures_use_path_purposes
      carrier: Path
      when:
        reference_family:
        - ControlMeasure
      allow:
        reference_purpose:
        - Route
        - Axis
        - DirectionOfAttack
    - name: path_holds_activate_hold_coordinates
      carrier: Path
      when:
        segment_geometry:
        - Orbit
        - Hold
      activates:
      - hold_pattern
      - orbit_direction
      - orbit_duration_mode
    - name: regions_as_control_areas_use_control_area_purposes
      carrier: Region
      when:
        reference_family:
        - ControlArea
      allow:
        reference_purpose:
        - KeepIn
        - KeepOut
        - Ditch
        - Loiter
    - name: regions_as_geofences_use_area_polarity_and_policy
      carrier: Region
      when:
        reference_family:
        - Geofence
      activates:
      - area_polarity
      - response_policy
    - name: regions_as_control_measures_use_area_purposes
      carrier: Region
      when:
        reference_family:
        - ControlMeasure
      allow:
        reference_purpose:
        - Objective
        - Assembly
        - AttackPosition
        - SupportByFire
    - name: boundaries_as_control_measures_use_boundary_purposes
      carrier: Boundary
      when:
        reference_family:
        - ControlMeasure
      allow:
        reference_purpose:
        - Boundary
        - Phase
        - FinalCoordination
        - Trigger
    - name: trigger_boundaries_activate_trigger_coordinates
      carrier: Boundary
      when:
        reference_purpose:
        - Trigger
      activates:
      - trigger_channel
      - trigger_actor
    - name: boundaries_support_deconfliction
      carrier: Boundary
      when:
        reference_purpose:
        - Boundary
        - Phase
        - FinalCoordination
      activates:
      - deconfliction_dimension
    landmarks:

      ControlAreaType:
        basis:
        - reference_family
        - area_polarity
        - reference_purpose
        aliases:
          KeepInZone:
