            coordinates:

              reference_family: ControlMeasure

              reference_purpose: Assembly
          Checkpoint:
            carrier: Mark
            coordinates:

              reference_family: ControlMeasure

              reference_purpose: Checkpoint
          ContactPoint:
            carrier: Mark
            coordinates:

              reference_family: ControlMeasure

              reference_purpose: ContactPoint
          ReleasePoint:
            carrier: Mark
            coordinates:

              reference_family: ControlMeasure

              reference_purpose: Release
          StartPoint:
            carrier: Mark
            coordinates:

              reference_family: ControlMeasure

