          Route:
            carrier: Path
            coordinates:

              reference_family: ControlMeasure

              reference_purpose: Route
          Axis:
            carrier: Path
            coordinates:

              reference_family: ControlMeasure

              reference_purpose: Axis
          DirectionOfAttack:
            carrier: Path
            coordinates:

              reference_family: ControlMeasure

              reference_purpose: DirectionOfAttack
    projections:

      GeofenceAction:
        basis:
        - area_polarity
        - response_policy
        aliases:
          KeepIn:
            coordinates:

              area_polarity: In
          KeepOut:
            coordinates:

              area_polarity: Out
          Warn:
            coordinates:

              response_policy: Warn
          RTL:
            coordinates:

              response_policy: RTL
          Land:
            coordinates:

              response_policy: Land
          Loiter:
            coordinates:

              response_policy: Loiter
          Report:
            coordinates:

              response_policy: Report
          Deny:
            coordinates:

              response_policy: Deny
          Brake:
            coordinates:

              response_policy: Brake
          Fence:
            coordinates:

              response_policy: Fence

      GeofenceResponse:
        basis:
        - response_policy
        aliases:
          Report:
            coordinates:

              response_policy: Report
          Warn:
            coordinates:

              response_policy: Warn
          Loiter:
            coordinates:

              response_policy: Loiter
          RTL:
            coordinates:

              response_policy: RTL
          Land:
            coordinates:

              response_policy: Land
          Brake:
            coordinates:

              response_policy: Brake
          MissionPause:
            coordinates:

              response_policy: MissionPause
          Fence:
            coordinates:

              response_policy: Fence

  response_status:
    description: Generalized lifecycle and disposition chart for responses, directives, executions, and reported events.
    summary:

      carrier_count: 5

      basis_count: 5

      constraint_count: 3

      landmark_count: 0

      projection_count: 67
    basis:

      phase:
        description: Generalized phase of a state machine independent of subject.
        values:
