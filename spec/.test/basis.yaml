version: 1
type: basis
name: basis.yaml
description: Orthogonal semantic variables for the core schema. Ontology provides carriers; this file provides reusable factor spaces.

module_boundaries:
- fires
- electronic_warfare
- logistics
- medical
- cbrn
- terrain
- weather
- maintenance

variables:
  dimension:
    description: Topological dimensionality independent of coordinate encoding.
    values:
    - 2D
    - 3D
    applies_to:
    - Class/Struct/Vector
    - Class/Struct/Line
    - Class/Struct/Path
    - Class/Struct/Bounding
    - Class/Definition/Coordinate
    - Class/Struct/GeoPos

  frame_scope:
    description: Scope of a frame independent of named realization or reference semantics.
    values:
    - Local
    - Global
    - Reference
    applies_to:
    - Class/Definition/Frame

  reference_frame_kind:
    description: Semantic role of a reference frame when the frame is not local or global.
    values:
    - Altitude
    - Bearing
    applies_when:
      frame_scope:
      - Reference
    applies_to:
    - Class/Definition/Frame

  global_frame_name:
    description: Concrete named realization of the global frame family.
    values:
    - WGS84
    - ETRS89
    - ECEF
    - ECI
    - TEME
    - LVLH
    applies_when:
      frame_scope:
      - Global
    applies_to:
    - Class/Definition/Frame

  altitude_reference:
    description: Zero datum or reference surface used for altitude values.
    values:
    - AMSL
    - HAE
    - AGL
    - Barometric
    - StartRelative
    - HAAT
    - AboveSeaFloor
    - BelowSeaSurface
    - EGM96
    applies_to:
    - Class/Definition/Frame
    - Class/Struct/GeoPos
    - Class/Data/Information/State/Position

  bearing_reference:
    description: Zero direction used for angular bearings.
    values:
    - TrueNorth
    - MagneticNorth
    - GridNorth
    - RelativeToHeading
    applies_to:
    - Class/Definition/Frame
    - Class/Struct/Bearing

  coordinate_family:
    description: Coordinate encoding family independent of dimensionality.
    values:
    - Cartesian
    - Geodetic
    - UTM
    - MGRS
    - PlusCode
    - ECI
    - ENU
    - Spherical
    applies_to:
    - Class/Definition/Coordinate
    - Class/Struct/GeoPos
    - Class/Data/Information/State/Position

  geometry_kind:
    description: Geometric carrier kind.
    values:
    - Point
    - Line
    - Path
    - Polygon
    - Volume
    - Orientation
    - Arc
    - Ellipse
    - Ellipsoid
    - Frustum
    - Corridor
    - Annulus
    applies_to:
    - Class/Definition/Geometry
    - Class/Control/Reference
    - Class/Struct/Shape

  time_form:
    description: How time is represented, not what the timestamp means.
    values:
    - Instant
    - Window
    - Offset
    applies_to:
    - Class/Definition/Time

  uncertainty_model:
    description: Mathematical form used to represent uncertainty.
    values:
    - Ellipse
    - CovarianceMatrix
    applies_to:
    - Class/Struct/Uncertainty
    - Class/Data/Information/Intel/Track
    - Class/Data/Information/State/Guidance

  scalar_domain:
    description: Scalar storage domain for generic range structs.
    values:
    - Float
    - UInt32
    - Double
    - Duration
    applies_to:
    - Class/Struct/Range

  physical_domain:
    description: Medium or domain in which a machine primarily exists or operates.
    values:
    - Land
    - Air
    - Sea
    - Undersea
    - Space
    applies_to:
    - Class/Object/Entity/Machine

  civil_domain:
    description: Institutional alignment of an organization.
    values:
    - Civilian
    - Government
    - Military
    applies_to:
    - Class/Object/Set/Organization

  task_level:
    description: Scale and command depth of a directive or execution artifact.
    values:
    - Technical
    - Tactical
    - Operational
    - Strategic
    applies_to:
    - Class/Control/Directive
    - Class/Control/Execution

  faction_taxonomy:
    description: Which faction classification system is being applied.
    values:
    - Disposition
    - Nationality
    - LegalStatus
    applies_to:
    - Class/Definition/Type/Factions

  faction_disposition:
    description: High-level side or disposition relative to the observer.
    values:
    - UNKNOWN
    - PENDING
    - FRIENDLY
    - SUSPECT
    - HOSTILE
    - NEUTRAL
    - ASSUMED
    - FAKER
    - JOKER
    applies_to:
    - Class/Definition/Type/Factions
    - Class/Data/Information/Properties/Attributes

  reference_family:
    description: Functional family applied to a control-side spatial carrier.
    values:
    - ControlMeasure
    - RallyPoint
    - ControlArea
    - Airspace
    - Geofence
    applies_to:
    - Class/Control/Reference/Mark
    - Class/Control/Reference/Path
    - Class/Control/Reference/Region
    - Class/Control/Reference/Boundary

  reference_purpose:
    description: Intended operational meaning of a control-side spatial carrier.
    values:
    - Objective
    - Initial
    - Action
    - Linkup
    - Alternate
    - Assembly
    - AttackPosition
    - SupportByFire
    - Boundary
    - Phase
    - Checkpoint
    - ContactPoint
    - Coordination
    - FinalCoordination
    - LimitOfAdvance
    - Release
    - Start
    - Trigger
    - Route
    - Axis
    - DirectionOfAttack
    - KeepIn
    - KeepOut
    - Ditch
    - Loiter
    applies_to:
    - Class/Control/Reference/Mark
    - Class/Control/Reference/Path
    - Class/Control/Reference/Region
    - Class/Control/Reference/Boundary

  area_polarity:
    description: Whether a bounded area is an inclusion or exclusion region.
    values:
    - In
    - Out
    applies_to:
    - Class/Control/Reference/Region

  response_policy:
    description: Action or policy taken when a rule, trigger, or boundary condition fires.
    values:
    - Warn
    - Report
    - Loiter
    - RTL
    - Land
    - Brake
    - Deny
    - Fence
    - MissionPause
    applies_to:
    - Class/Control/Constraint
    - Class/Control/Reference/Region
    - Class/Communication/Message/Response

  segment_geometry:
    description: Primitive geometric behavior of a route or path segment.
    values:
    - GreatCircle
    - Rhumbline
    - Straight
    - TurnArc
    - Orbit
    - Hold
    - Approach
    - Departure
    - Missed
    - Emergency
    applies_to:
    - Class/Control/Reference/Path
    - Class/Control/Execution/Sequence

  hold_pattern:
    description: Repeated spatial holding pattern.
    values:
    - Orbit
    - Racetrack
    - FigureEight
    - Hold
    applies_to:
    - Class/Control/Execution/Action
    - Class/Control/Reference/Path

  orbit_direction:
    description: Direction of travel within an orbiting hold pattern.
    values:
    - Left
    - Right
    applies_to:
    - Class/Control/Execution/Action

  orbit_duration_mode:
    description: Stop condition for an orbit or hold.
    values:
    - UntilCommanded
    - FixedTime
    - ResourceBased
    applies_to:
    - Class/Control/Execution/Action

  trigger_channel:
    description: Mechanism by which a trigger becomes true.
    values:
    - Time
    - Position
    - Event
    - Threshold
    - Condition
    - Order
    applies_to:
    - Class/Control/Constraint/Condition
    - Class/Control/Execution/Action

  trigger_actor:
    description: Which side or actor originates an externally caused trigger.
    values:
    - System
    - Friendly
    - Enemy
    applies_to:
    - Class/Control/Constraint/Condition
    - Class/Control/Execution/Action

  deconfliction_dimension:
    description: Dimension along which interference is avoided.
    values:
    - Altitude
    - Temporal
    - Lateral
    - Speed
    - Route
    - Frequency
    applies_to:
    - Class/Control/Constraint
    - Class/Control/Execution/Plan

  action_family:
    description: Broad class of activity attached to a plan step or waypoint.
    values:
    - Navigation
    - Hold
    - Payload
    - Sensor
    - Mission
    applies_to:
    - Class/Control/Execution/Action
    - Class/Control/Reference/Mark

  action_primitive:
    description: Concrete primitive action within an action family.
    values:
    - Transit
    - Flyover
    - Flyby
    - Takeoff
    - Land
    - Loiter
    - Orbit
    - Hold
    - ReturnToLaunch
    - Photo
    - Survey
    - Delivery
    - Relay
    - Rendezvous
    applies_to:
    - Class/Control/Execution/Action
    - Class/Control/Reference/Mark

  node_role:
    description: Functional role of a communication endpoint.
    values:
    - Sensor
    - Effector
    - C2
    - Relay
    - Gateway
    - Observer
    applies_to:
    - Class/Communication/Node

  network_topology:
    description: Topological form of message connectivity.
    values:
    - Mesh
    - PointToPoint
    - Broadcast
    - StoreAndForward
    applies_to:
    - Class/Communication/Transport/Network

  protocol_family:
    description: Message or session protocol family.
    values:
    - MAVLink
    - MAVLink_M
    - MSPv2
    - ROS
    - STANAG4586
    - CoT
    - CustomSerial
    - Meshtastic
    - RTP_RTSP
    - SRT
    - HLS
    - WebRTC
    - Link16
    - VMF
    - ADS_B
    - XMPP
    - DDS
    applies_to:
    - Class/Communication/Transport/Protocol

  serialization_format:
    description: Payload serialization format independent of transport protocol.
    values:
    - Protobuf
    - JSON
    - XML
    - CBOR
    - MessagePack
    - FlatBuffers
    - Avro
    - BSON
    - Binary_Custom
    - ASCII_Text
    applies_to:
    - Class/Communication/Transport/Protocol
    - Class/Communication/Message

  compression:
    description: Compression codec used on serialized payloads or streams.
    values:
    - None
    - GZIP
    - LZ4
    - Zstd
    - Snappy
    - Deflate
    applies_to:
    - Class/Communication/Transport/Protocol
    - Class/Communication/Feed/Stream

  routing_semantics:
    description: Delivery semantics of a communication path.
    values:
    - Unicast
    - Multicast
    - Broadcast
    - Anycast
    - PubSub
    - RequestReply
    - StoreAndForward
    applies_to:
    - Class/Communication/Transport
    - Class/Communication/Feed

  stream_codec:
    description: Codec family used for a continuous stream.
    values:
    - H264
    - H265
    - VP8
    - VP9
    - AV1
    - MJPEG
    - RAW
    - PCM
    - AAC
    - Opus
    applies_to:
    - Class/Communication/Feed/Stream

  message_shape:
    description: Envelope update shape independent of payload meaning.
    values:
    - Snapshot
    - Delta
    - History
    - Log
    applies_to:
    - Class/Communication/Message

  data_flow_direction:
    description: Semantic direction of information flow relative to the controller.
    values:
    - CommandDown
    - StatusUp
    - TelemetryUp
    applies_to:
    - Class/Communication/Feed
    - Class/Communication/Message

  message_priority:
    description: Message precedence independent of transport.
    values:
    - Routine
    - Priority
    - Immediate
    - Flash
    - FlashOverride
    applies_to:
    - Class/Communication/Message

  acknowledgment_phase:
    description: Which execution phase requires acknowledgment.
    values:
    - None
    - Receipt
    - Processing
    - Execution
    applies_to:
    - Class/Communication/Message/Response

  phase:
    description: Generalized phase of a state machine independent of subject.
    values:
    - Created
    - Submitted
    - Scheduled
    - Sent
    - Received
    - Acknowledged
    - Executing
    - Waiting
    - Active
    - Paused
    - Review
    - Complete
    - CancelRequested
    - CompleteRequested
    - Expired
    - Deleted
    - Lost
    - Recovered
    - HandedOff
    applies_to:
    - Class/Communication/Message/Response
    - Class/Control/Directive
    - Class/Control/Execution
    - Class/Data/Information/State/Lifecycle
    - Class/Data/Information/Event

  disposition:
    description: Outcome or judgment independent of lifecycle phase.
    values:
    - Success
    - Failure
    - Approved
    - Denied
    - Rejected
    - Pending
    - Delivered
    - Applied
    - InTransit
    - Stale
    applies_to:
    - Class/Communication/Message/Response
    - Class/Control/Directive
    - Class/Data/Information/State/Lifecycle

  reason:
    description: Cause or rationale behind a disposition, abort, or failure.
    values:
    - NoAssets
    - BadRequest
    - InsufficientInfo
    - Timeout
    - Unavailable
    - Stale
    - Manual
    - Battery
    - Fuel
    - Weather
    - Damage
    - HostileContact
    - EquipmentFailure
    - Geofence
    - CommunicationLoss
    - MissionInvalid
    - HighWind
    - Crash
    applies_to:
    - Class/Communication/Message/Response
    - Class/Control/Execution/Action
    - Class/Data/Information/Event

  actor:
    description: Which agent class emitted, decided, or caused a state transition.
    values:
    - Manager
    - Machine
    - Platform
    - C2
    - System
    - Human
    - Friendly
    - Enemy
    applies_to:
    - Class/Communication/Message/Response
    - Class/Control/Directive
    - Class/Data/Information/Event

  severity:
    description: Human urgency or seriousness scale.
    values:
    - Info
    - Low
    - Medium
    - High
    - Critical
    - Emergency
    applies_to:
    - Class/Communication/Message
    - Class/Data/Information/Event

  operational_context:
    description: Context in which data was produced or interpreted.
    values:
    - Exercise
    - Operational
    - Simulated
    applies_to:
    - Class/Data/Information/Intel
    - Class/Data/Information/State
    - Class/Communication/Message

  operational_state:
    description: Current operating state of a system or subsystem.
    values:
    - Off
    - Startup
    - NonOperational
    - Nominal
    - Degraded
    - Operational
    - Emergency
    - Maintenance
    - Calibrating
    - Standby
    - Sleep
    - Denied
    applies_to:
    - Class/Data/Information/State/Internal
    - Class/Data/Information/State/Condition

  health_state:
    description: Health or readiness assessment.
    values:
    - Healthy
    - Warn
    - Fail
    - Offline
    - NotReady
    applies_to:
    - Class/Data/Information/State/Condition
    - Class/Data/Information/State/Sensor

  connection_state:
    description: Connectivity state of a link or participant.
    values:
    - Online
    - Offline
    applies_to:
    - Class/Data/Information/State/Internal
    - Class/Communication/Node

  power_state:
    description: Availability state of a power source.
    values:
    - Unknown
    - NotPresent
    - Operating
    - Disabled
    - Error
    applies_to:
    - Class/Data/Information/State/Resources

  producer_kind:
    description: Broad source class that originated a datum.
    values:
    - Human
    - Machine
    - Fused
    applies_to:
    - Class/Data/Information/Intel
    - Class/Data/Information/State/Guidance

  acquisition_channel:
    description: Primary channel or modality from which a datum was obtained.
    values:
    - GPS
    - INS
    - Radio
    - Magnetic
    - Visual
    - Tracker
    - Manual
    - Simulated
    - Configured
    - Optical
    applies_to:
    - Class/Data/Information/Intel
    - Class/Data/Information/State/Guidance

  derivation_method:
    description: How a datum was transformed from source into its reported value.
    values:
    - Measured
    - Mensurated
    - Transcribed
    - Estimated
    - Calculated
    - Passed
    - Fused
    - Pasted
    applies_to:
    - Class/Data/Information/Intel
    - Class/Data/Information/State/Guidance

  transmission_link:
    description: Specific radio or tactical data link used when the acquisition channel is a link feed.
    values:
    - EPLRS
    - PLRS
    - Doppler
    - VHF
    - TADIL_A
    - TADIL_B
    - TADIL_J
    applies_when:
      acquisition_channel:
      - Radio
    applies_to:
    - Class/Data/Information/Intel
    - Class/Data/Information/State/Guidance

  correlation_method:
    description: Whether correlation was manually judged or automatically computed.
    values:
    - Manual
    - Automated
    applies_to:
    - Class/Data/Information/Intel/Track
    - Class/Data/Information/Intel/Classification

  fusion_method:
    description: Mathematical or heuristic fusion algorithm.
    values:
    - NearestNeighbor
    - Bayesian
    - DempsterShafer
    - KalmanFilter
    - CovarianceIntersection
    - Voting
    - WeightedAverage
    applies_to:
    - Class/Data/Information/Intel/Track
    - Class/Data/Information/State/Guidance

  fusion_level:
    description: Level in a standard fusion stack.
    values:
    - L0_SourcePreprocessing
    - L1_ObjectAssessment
    - L2_SituationAssessment
    - L3_ImpactAssessment
    - L4_ProcessRefinement
    applies_to:
    - Class/Data/Information/Intel

  reliability_grade:
    description: Reliability grade of the source.
    values:
    - A_CompletelyReliable
    - B_UsuallyReliable
    - C_FairlyReliable
    - D_NotUsuallyReliable
    - E_Unreliable
    - F_CannotBeJudged
    applies_to:
    - Class/Data/Information/Intel

  credibility_grade:
    description: Credibility grade of the information content.
    values:
    - 1_Confirmed
    - 2_ProbablyTrue
    - 3_PossiblyTrue
    - 4_Doubtful
    - 5_Improbable
    - 6_CannotBeJudged
    applies_to:
    - Class/Data/Information/Intel

  fix_dimension:
    description: Spatial dimensionality of a navigation fix, including no-fix.
    values:
    - NoFix
    - 2D
    - 3D
    applies_to:
    - Class/Data/Information/State/Guidance

  correction_regime:
    description: Correction or augmentation regime applied to a navigation solution.
    values:
    - Standalone
    - DGPS
    - RTKFloat
    - RTKFixed
    applies_to:
    - Class/Data/Information/State/Guidance

  fix_specialization:
    description: Special navigation solution subtype outside the normal dimensional fix ladder.
    values:
    - None
    - Static
    - PPS
    applies_to:
    - Class/Data/Information/State/Guidance

  nav_source:
    description: Sensor or subsystem contributing to navigation.
    values:
    - GPS
    - GLONASS
    - Galileo
    - BeiDou
    - INS
    - VIO
    - OpticalFlow
    - SLAM
    - Barometer
    - Radar
    - Altimeter
    - Fused
    applies_to:
    - Class/Data/Information/State/Guidance

  navigation_mode:
    description: Control regime currently driving navigation.
    values:
    - Manual
    - Waypoint
    - RTL
    - Loiter
    - Guided
    - Land
    - Takeoff
    - Circle
    - Drift
    - PositionHold
    - Brake
    - Throw
    - ADSB
    - SmartRTL
    - FlowHold
    - Follow
    - Zigzag
    - SystemID
    - AutoRotate
    applies_to:
    - Class/Data/Information/State/Guidance
    - Class/Control/Execution/Action

  autonomy_class:
    description: Degree of autonomy in control delegation.
    values:
    - Remote
    - Assisted
    - SemiAutonomous
    - Supervised
    - Autonomous
    applies_to:
    - Class/Object/Entity/Machine/Robot

  propulsion_type:
    description: Primary propulsion energy or mechanism class.
    values:
    - Electric
    - Gasoline
    - Diesel
    - Turbine
    - Hybrid
    - Hydrogen
    - Solar
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  land_propulsion:
    description: Primary land locomotion form.
    values:
    - Wheeled
    - Tracked
    - Bipedal
    - Legged
    applies_when:
      physical_domain:
      - Land
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  airframe_family:
    description: Broad aircraft configuration family.
    values:
    - Multirotor
    - FixedWing
    - VTOL
    applies_when:
      physical_domain:
      - Air
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  multirotor_layout:
    description: Rotor layout for multirotor aircraft.
    values:
    - Quad
    - Hex
    - Octo
    - Coaxial
    - Y6
    - X8
    applies_when:
      airframe_family:
      - Multirotor
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  fixed_wing_layout:
    description: Planform layout for fixed-wing aircraft.
    values:
    - Conventional
    - FlyingWing
    - Canard
    - TandemWing
    - BlendedWingBody
    - Delta
    applies_when:
      airframe_family:
      - FixedWing
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  vtol_layout:
    description: Transition layout for VTOL aircraft.
    values:
    - Tiltrotor
    - Tailsitter
    - LiftAndCruise
    - QuadPlane
    - CopterPlane
    applies_when:
      airframe_family:
      - VTOL
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  launch_method:
    description: Launch mechanism or regime.
    values:
    - HTOL
    - VTOL
    - Catapult
    - HandLaunch
    - RailLaunch
    - TubeLaunch
    - DropLaunch
    - BalloonLaunch
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  recovery_method:
    description: Recovery or landing mechanism.
    values:
    - HTOL
    - VTOL
    - Parachute
    - DeepStall
    - NetRecovery
    - SkyHook
    - BellyLand
    - Ditching
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot

  guidance_type:
    description: Terminal or primary guidance mechanism.
    values:
    - Unguided
    - GPS
    - INS
    - LaserGuided
    - IRHoming
    - RadarHoming
    - CommandGuided
    - Wire
    - FiberOptic
    - Terminal_TV
    - Vision
    applies_to:
    - Class/Object/Entity/Machine/Payload
    - Class/Control/Execution/Action

  air_role:
    description: Operational role of an air vehicle or aircraft mission system.
    values:
    - GroundAttack
    - AntiAir
    - Fighter
    - Reconnaissance
    - IMINT
    - SIGINT
    - Minelaying
    - Cargo
    applies_when:
      physical_domain:
      - Air
    applies_to:
    - Class/Object/Entity/Machine/Vehicle
    - Class/Object/Entity/Machine/Robot
