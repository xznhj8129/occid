Class:
  description: Any distinct part of the overall framework that can be identified, described, or referenced
  children:

    Definition:
      description: Abstract structure used to define how values, space, geometry, time, or relations are interpreted.
      children:

        Frame:
          description: Frames of reference
          axis: FrameType
          
        Coordinate:
          description: Coordinate systems and encodings
          axis: CoordinateEncoding
          
        Geometry:
          description: Spatial and geometric primitives
          axis: GeometryType
          
        Time:
          description: Temporal reference frames
          axis: TimeType
          
        Type:
          description: Orthogonal typology axes used to speciate objects, control wrappers, and data without changing their structural class
          children:

            Category: 
              description: What kind of thing something is within its structural class (ie, waypoint, route, zone)

            Purpose: 
              description: Why something exists, is designated, or is intended to be used

            Function: 
              description: What something does, how it behaves, or what rule semantics it carries (ie, include, exclude, trigger, hold)

            Factions: 
              description: Appartnance buckets
              axis: FactionAxis

            Domains:
              description: Domains of existence, movement, operations and effects

        Relationship:
          description: Nature of relations, ownership, provenance, link
          
    Struct:
      description: Reusable data primitives built on combinations of Definition primitives (vectors, positions, quaternions, paths, bounding boxes).
      axis: StructType

    Object:
      description: Atoms
      children:

        Entity:
          description: One discrete "atom" capable of actions
          children:

            Actor:
              description: Entity capable of thought, observation, reflexion, logic, reasoning, introspection, and making judgments and decisions
              children:
                Person:
                  description: Human being
                  
                Agent:
                  description: Artificial intelligence, distinct from it's substrate
                  
            Machine:
              description: Discrete non-inert man-made object capable of actions
              axis: PhysicalDomain
              children:

                Vehicle:
                  description: Machine capable of movement only through onboard human crew
                  
                Robot:
                  description: Machine capable of movement without human crew
                  
                Platform:
                  description: Reusable, static machine that carries out actions

        Set:
          description: An object that represents many objects
          children: 

            Organization:
              description: A structured collection of organized entities and/or subordinate organizations with common command and control
              axis: CivilDomain
              children:

                Group:
                  description: An organization that contains subordinate organizations
                  
                Unit:
                  description: An organization that contains no subordinate organizations and consists only of entities

            Collection:
              description: Informal, adhoc grouping of objects with common purpose, appartnance, affinity or goal
                  
            Cluster:
              description: A set of objects united only by criterion
              
            System:
              description: An organized assembly of multiple objects bound together as a functional whole, but not by itself a discrete actor, organization, collection, or site
          
        Item:
          description: A discrete bounded non-agent object
          children:

            Record:
              description: Item whose purpose is holding information
              
            Equipment:
              description: A mission-purpose item physically used, carried, held, or worn by a human being
              
            Component:
              description: An item that is part of a machine and has an internal purpose or effect
              
            Payload:
              description: An item that is part of a machine and has an external effect or mission purpose
              
        World: 
          description:
          # Country -> Region -> Town -> Street -> Address -> House -> Floor -> Room
          # Grid square -> Position mark -> Object

          children:
            Feature: 
              description: "Immovable, immutable, clearly recognizable and distinct real-world feature (ie, river, town, hill)"

            Location: 
              description: Spatially bounded physical location (ie, building, town, bridge; not conceptual, ie, waypoint) of interest

            Site: 
              description: Spatially bounded area or building designated, recognized or assigned a specific function      

    Control:
      description: Scale-invariant; the binding of agents to objectives through structured decomposition
      children:

        Reasoning:
          description: 

          children:
            Purpose:
              description: Reason, justification, imperative for action

            Intent:
              description: Desired effect and operational meaning that guides execution
              
            Objective:
              description: Specific desired future condition, effect, or end-state

        Directive:
          description: What must be achieved, why, and within what bounds
          axis: TaskLevel
          children:
              
            Mission:
              description: A directive to accomplish an objective; "do X to achieve Y"
              
            Task:
              description: A directive to carry out part of a mission
              
            Command:
              description: An immediate imperative requiring execution without interpretation
              
        Execution:
          description: How directed activity is structured and carried out
          axis: TaskLevel
          children:

            Plan:
              description: The ordered structure of actions toward an objective
              
            Sequence:
              description: The ordered steps within a plan or mission
              
            Action:
              description: A discrete intentional act that changes state

        Reference:
          description: Control-side structural wrapper binding spatial definitions and structs into control-usable referents
          children:

            Mark:
              description: A discrete spatial reference wrapper used by control logic or execution

            Path:
              description: An ordered composition wrapper over spatial references

            Region:
              description: A bounded spatial reference wrapper over an area or volume

            Boundary:
              description: A delimiting spatial reference wrapper over an edge, line, or bound

          
        Constraint:
          description: A boundary, limitation, or rule restricting permissible action
          children:

            Restriction:
              description: must not do X
              
            Limitation:
              description: only within Y
              
            Condition:
              description: only when Z is true
              
        Interface:
          description: The translation of an action into the terms of the executing layer
          

    Communication:
      description: Definition, implementation, metadata and formats of information transfer
      children:

        Node:
          description: Endpoint that transmits or receives messages
          
        Transport:
          description: The form of information flow
          children:

            Network:
              description: Graph topology of information flow
              
            Carrier:
              description: What are messages transmitted over
              
            Protocol:
              description: Format and standard of messages
              
        Feed:
          description: Information pipe
          children:

            Link:
              description: Discontinuous data flow of discrete packets
              
            Stream:
              description: Continuous data flow at a constant rate, usually Sensory
              
        Message:
          description: Discrete typed envelope for feed data
          children:

            C3:
              description: Communication whose purpose is to direct, command or control
              
            ISR:
              description: Communication about external objects, events, or the environment

            Telemetry:
              description: Communication about the sender's own internal state or process
              
            Response:
              description: Communication whose purpose is acknowledgment, acceptance, rejection, result, or completion notice
              

    Data:
      description: Concrete typed structures describing objects, their characteristics, condition, intentions, actions, or effects
      children:

        Information:
          description: Symbolic, usually structured data that can be directly read
          children:

            Properties:
              description: A generally fixed characteristic, classification, disposition, or capability that defines an object, but is not merely its momentary condition
              children:

                Identity:
                  description: Fundamental identity, name, ID
                  
                Attributes:
                  description: Fundamental characteristics, type, form
                  
                Parameters:
                  description: Current operating configuration or control regime
                  
                Relationship:
                  description: Nature of relations, ownership, provenance, link
                  
            State:
              description: Telemetric, changing data describing the own state or condition of an object at a given time
              children:

                Kinematic:
                  description: Physical orientation, velocity, acceleration, angular rates
                  
                Internal:
                  description: Diagnostic internals of a machine or system (CPU, memory, cycles, firmware, connectivity)
                  
                Position:
                  description: Position in space, address or placement
                  
                Guidance:
                  description: Status and quality of the navigation solution, mode, source, and validity
                  
                Sensor:
                  description: Onboard sensor readings, readiness, calibration, and availability
                  
                Input:
                  description: Current operator / receiver input state and control mapping
                  
                Resources:
                  description: How much of something something has; power, fuel, food, etc
                  
                Condition:
                  description: Integrity, damage, faults, readiness
                  
                Lifecycle:
                  description: Current stage in existence or execution
                  
                Assignment:
                  description: Assignments, tasks, plans, missions, stages
                  
            Event:
              description: A discrete occurrence — something that happened at a point in time, whether planned or not
              children:
              
                FlightEvent:
                  description: Discrete transition in flight state or safety state
                  
                MissionEvent:
                  description: Discrete transition in mission execution state
                  
            Intel:
              description: Effect-side data that something happened or changed external to the sender object
              children:

                Detection:
                  description: Assessment that something exists or occurred
                  
                Classification:
                  description: Assessment assigning type or identity to an object
                  
                Track:
                  description: Assessment of the state of an external object over time
                  
                Assessment:
                  description: Evaluation of effect, damage, outcome, or threat
                  
        Sensory:
          description: Unstructured, non-symbolic sensory signal data that has to be interpreted
          children:

            AV:
              description: Seen or heard; video, images, audio recordings
              
            Spatial:
              description: point clouds, 3D models, scans, etc
              
            Samples:
              description: IQ samples or other analog data
              
